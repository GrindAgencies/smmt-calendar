<html lang="en">
<head>
<script src="session.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{ -webkit-tap-highlight-color:transparent; }

  /* ============================ the podium ============================
     Second, first, third — first raised and crowned, the way the mockup has it.
     Built as a 3-column grid so the middle column can simply be taller. */
  .pod{ display:grid; grid-template-columns:1fr 1.12fr 1fr; gap:7px; align-items:end; margin:6px 0 4px; }
  .pod-s{
    position:relative; background:var(--tsfg-raise); border:1px solid var(--tsfg-line);
    border-radius:var(--tsfg-r); padding:14px 6px 11px; text-align:center;
    /* A grid item will not shrink below its content unless told to, so a long name
       pushed the third card past the right edge of the phone. */
    min-width:0;
  }
  .pod-s.first{ border-color:var(--tsfg-gold); padding-top:19px; }
  .pod-s .rk{
    position:absolute; top:-12px; left:50%; transform:translateX(-50%);
    width:25px; height:25px; border-radius:50%; background:var(--tsfg-raise-2);
    border:1px solid var(--tsfg-line); color:var(--tsfg-ink-2);
    font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center;
  }
  .pod-s.first .rk{ background:var(--tsfg-gold); border-color:var(--tsfg-gold); color:#17120a; }
  .pod-s .crown{ position:absolute; top:-30px; left:50%; transform:translateX(-50%); font-size:17px; }
  .pod-s .av{
    width:58px; height:58px; border-radius:50%; margin:4px auto 8px; display:block;
    object-fit:cover; background:var(--tsfg-raise-2); border:2px solid var(--tsfg-line);
  }
  .pod-s.first .av{ width:68px; height:68px; border-color:var(--tsfg-gold); }
  /* A name is the whole point of a podium, so it WRAPS rather than truncating —
     "Christopher Lorenz" was reading as "Christophe…". Two lines are reserved whether
     the name needs them or not, so the three cards keep their shoulders level. */
  .pod-s .nm{
    font-size:12px; font-weight:700; margin-bottom:7px; min-width:0;
    line-height:1.25; min-height:2.5em;
    display:flex; align-items:center; justify-content:center;
    overflow-wrap:anywhere; hyphens:auto;
  }
  .pod-s .vl{
    display:block; border:1px solid var(--tsfg-line); border-radius:var(--tsfg-r-sm);
    padding:6px 3px; font-size:12.5px; font-weight:800; font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .pod-s.first .vl{ border-color:var(--tsfg-gold); color:var(--tsfg-gold); }

  /* =========================== the rankings ========================== */
  .rank-head{
    display:grid; grid-template-columns:24px 1fr auto; gap:10px; align-items:center;
    padding:0 13px 7px; font-size:10.5px; font-weight:800; letter-spacing:.07em;
    text-transform:uppercase; color:var(--tsfg-ink-2);
  }
  .rank-row{
    display:grid; grid-template-columns:24px 30px 1fr auto; gap:10px; align-items:center;
    padding:10px 13px; border-bottom:1px solid var(--tsfg-line-soft);
  }
  .rank-row:last-child{ border-bottom:0; }
  .rank-row .n{ font-size:13px; font-weight:700; color:var(--tsfg-ink-2); font-variant-numeric:tabular-nums; }
  .rank-row img, .rank-row .ini{
    width:30px; height:30px; border-radius:50%; object-fit:cover;
    background:var(--tsfg-raise-2); display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800; color:var(--tsfg-ink-2);
  }
  .rank-row .nm{ font-size:14px; font-weight:600; min-width:0; line-height:1.3;
    overflow-wrap:anywhere; }
  .rank-row .vl{ font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; }
  /* You, highlighted — the row a person looks for first. */
  .rank-row.me{
    background:var(--tsfg-gold-wash); border:1px solid var(--tsfg-gold);
    border-radius:var(--tsfg-r-sm); margin:3px 0;
  }
  .rank-row.me .nm, .rank-row.me .vl, .rank-row.me .n{ color:var(--tsfg-gold); font-weight:800; }

  /* ======================== your rank footer ======================== */
  .yours{
    display:grid; grid-template-columns:auto 1fr 1px 1fr; gap:14px; align-items:center;
    border:1px solid var(--tsfg-gold); border-radius:var(--tsfg-r);
    padding:13px 16px; margin-top:14px; background:var(--tsfg-raise);
  }
  .yours .ic{ font-size:19px; }
  .yours .k{ font-size:11px; color:var(--tsfg-ink-2); font-weight:600; }
  .yours .v{ font-size:19px; font-weight:800; letter-spacing:-.02em; margin-top:1px; }
  .yours .sep{ background:var(--tsfg-line); height:30px; }

  /* ========================= custom range ========================== */
  .sheet{
    position:fixed; inset:0; z-index:90; background:rgba(0,0,0,.72);
    display:none; align-items:center; justify-content:center;
    /* the safe area matters here: on a notched phone a centred sheet can sit under the
       status bar, and with the keyboard open Apply must still be reachable */
    padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px);
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  }
  .sheet.on{ display:flex; }
  .sheet-c{
    width:100%; max-width:360px; margin:auto; background:var(--tsfg-raise);
    border:1px solid var(--tsfg-gold); border-radius:var(--tsfg-r); padding:17px;
    max-height:calc(100dvh - 72px); overflow-y:auto;
  }
  .sheet-c h3{ font-size:17px; font-weight:800; margin:0 0 14px; letter-spacing:-.02em; }
  /* WHY THE DATE BAR WAS CUT OFF. A grid item's default min-width is `auto`, which means it
     refuses to shrink below the intrinsic width of its content - and a native <input type=date>
     reports a wide intrinsic size (it has to fit mm/dd/yyyy plus the picker icon). Two of those
     plus the gap and the sheet's padding simply did not fit a narrow phone, so the second field
     and its icon pushed outside the rounded container. The fix is min-width:0 on the items, so
     the 1fr columns can actually do their job, plus a genuine stack below 400px instead of
     squeezing two fields into a space that cannot hold them. Nothing is hidden with overflow. */
  .dcol{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px; }
  .dcol > div{ min-width:0; }
  .dcol label{ display:block; font-size:11.5px; color:var(--tsfg-ink-2); font-weight:600; margin-bottom:5px; }
  .dcol input{
    width:100%; min-width:0; max-width:100%; box-sizing:border-box; padding:11px 10px; font-size:14px;
    background:var(--tsfg-raise-2); color:var(--tsfg-ink);
    border:1px solid var(--tsfg-line); border-radius:var(--tsfg-r-sm); font-family:inherit;
  }
  @media (max-width:400px){ .dcol{ grid-template-columns:1fr; } }

  /* Custom dates is a SECONDARY control: the primary period row stays three choices. */
  .rangerow{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin:2px 0 14px; }
  .rangebtn{
    display:inline-flex; align-items:center; gap:6px; padding:7px 13px; cursor:pointer;
    background:var(--tsfg-raise); border:1px solid var(--tsfg-line); border-radius:var(--tsfg-r-pill);
    color:var(--tsfg-ink-2); font-family:inherit; font-size:12px; font-weight:700;
  }
  .rangebtn.on{ border-color:var(--tsfg-gold); color:var(--tsfg-gold); }
  .rangenow{ font-size:12px; color:var(--tsfg-gold); font-weight:700; }
  .rangeclear{
    background:none; border:0; color:var(--tsfg-ink-2); font-family:inherit;
    font-size:12px; font-weight:700; cursor:pointer; text-decoration:underline;
  }
  .sample{
    display:inline-block; padding:4px 11px; border-radius:var(--tsfg-r-pill);
    border:1px solid var(--tsfg-line); color:var(--tsfg-ink-2); font-size:11px; font-weight:700;
  }
</style>
</head>
<body class="tsfg tsfg-haspad">

<div class="tsfg-top">
  <button class="tsfg-back" onclick="back()" aria-label="Back">&lsaquo;</button>
</div>

<div class="tsfg-wrap">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">
    <div>
      <h1 class="tsfg-title">Leaderboard</h1>
      <p class="tsfg-lede">Celebrate the team. Raise the standard.</p>
    </div>
    <div style="font-size:26px;margin-top:6px">&#127942;</div>
  </div>

  <!-- Three rows, three choices each, each row one dimension and named for a screen reader.
       Custom dates is deliberately NOT a fourth segment squeezed in here - it is the secondary
       control below, so the primary row stays three evenly sized targets. -->
  <div class="tsfg-seg" id="segPeriod" role="group" aria-label="Period">
    <button data-p="week"  onclick="setPeriod('week')">Week</button>
    <button data-p="month" onclick="setPeriod('month')" class="on">Month</button>
    <button data-p="all"   onclick="setPeriod('all')">All time</button>
  </div>

  <div class="tsfg-seg" id="segMetric" role="group" aria-label="Metric">
    <button data-m="recruiter"  onclick="setMetric('recruiter')">Directs</button>
    <button data-m="premium"    onclick="setMetric('premium')" class="on">Production</button>
    <button data-m="points_paid" onclick="setMetric('points_paid')">Paid</button>
  </div>

  <div class="tsfg-seg" id="segScope" role="group" aria-label="Scope">
    <button data-s="personal"  onclick="setScope('personal')">Personal</button>
    <button data-s="baseshop"  id="scopeShop" style="display:none" onclick="setScope('baseshop')">Base shop</button>
    <button data-s="hierarchy" onclick="setScope('hierarchy')" class="on">Hierarchy</button>
  </div>

  <div class="rangerow">
    <button class="rangebtn" id="rangeBtn" onclick="openRange()" aria-label="Choose custom dates">&#128197; Custom dates</button>
    <span class="rangenow" id="rangeNow"></span>
  </div>

  <div id="body"><div class="tsfg-spin">Loading the board…</div></div>
</div>

<!-- custom date range -->
<div class="sheet" id="rangeSheet" onclick="if(event.target===this)closeRange()">
  <div class="sheet-c">
    <h3>Custom date range</h3>
    <div class="dcol">
      <div><label>Start date</label><input type="date" id="rFrom"></div>
      <div><label>End date</label><input type="date" id="rTo"></div>
    </div>
    <p class="tsfg-muted" style="font-size:12px;margin:8px 0 14px;line-height:1.45" id="rNote">
      Both days are included. Figures are counted on the business date — production by the day it
      was written, Paid by the day the money landed.
    </p>
    <div class="tsfg-btnrow">
      <button class="tsfg-btn quiet" onclick="closeRange()">Cancel</button>
      <button class="tsfg-btn" onclick="applyRange()">Apply</button>
    </div>
  </div>
</div>

<nav class="tsfg-tabs" style="--tsfg-tabn:4">
  <button class="tsfg-tab" onclick="go('app.html')">
    <svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2Z"/></svg>Home
  </button>
  <button class="tsfg-tab" onclick="go('teamhub.html')">
    <svg viewBox="0 0 24 24"><path d="M20 15a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2Z"/></svg>The Hub
  </button>
  <button class="tsfg-tab on">
    <svg viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/><path d="M12 14v3m-3 3h6"/></svg>Board
  </button>
  <button class="tsfg-tab" onclick="go('profile.html')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profile
  </button>
</nav>

<script>
var LB   = 'https://bmfqxtocxkjhsgfnndlo.supabase.co/functions/v1/leaderboard-api';
var HUBAV= 'https://bmfqxtocxkjhsgfnndlo.supabase.co/functions/v1/hub-api';

try{ if(!localStorage.getItem('tsfg_code')) location.replace('index.html'); }catch(e){}
var CODE = (localStorage.getItem('tsfg_code')||'').toUpperCase();

function go(u){ location.href=u; }
/* Back always returns to the main tools screen. It used to be history.back(), which
   lands wherever you happened to come FROM — the sign-in page after a login redirect,
   an external site, or nothing at all on a cold open from a shared link. A top-level
   tool has exactly one parent and it is Home. */
function back(){ go('app.html'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function initials(n){ n=String(n||'').trim(); if(!n) return '?'; var p=n.split(/\s+/); return ((p[0][0]||'')+(p.length>1?p[p.length-1][0]:'')).toUpperCase(); }

/* The three metrics the mockup names, mapped onto the boards leaderboard-api already
   computes. Nothing new is invented server-side — Directs is the recruiting board,
   Production is submitted premium, Paid is commission actually paid out. */
var METRICS = {
  recruiter  : { label:'Directs',    sub:'New business partners', money:false, unit:'partner' },
  premium    : { label:'Production', sub:'Submitted premium',     money:true },
  points_paid: { label:'Paid',       sub:'Commission paid out',   money:true }
};

var PERIOD='month', METRIC='premium', SCOPE='hierarchy', RANGE=null, AVATARS={}, SHOPOK=false, MYSHOP='', SEQ=0;
var SHOPCHK='https://bmfqxtocxkjhsgfnndlo.supabase.co/functions/v1/nb-baseshop';
try{
  PERIOD = sessionStorage.getItem('tsfg_lb_period') || 'month';
  METRIC = sessionStorage.getItem('tsfg_lb_metric') || 'premium';
  SCOPE  = sessionStorage.getItem('tsfg_lb_scope')  || 'hierarchy';
  var _r = sessionStorage.getItem('tsfg_lb_range'); if(_r) RANGE = JSON.parse(_r);
}catch(e){}
/* 2026-10-26: a remembered choice that is no longer valid (an old metric name, a hand-edited value)
   used to throw in render() on every visit for the rest of the session. Fall back instead. */
if(!METRICS[METRIC]) METRIC='premium';
if(['week','month','all','custom'].indexOf(PERIOD)<0) PERIOD='month';
if(['personal','baseshop','hierarchy'].indexOf(SCOPE)<0) SCOPE='hierarchy';

function money(n){ return '$'+Math.round(Number(n)||0).toLocaleString('en-US'); }
function fmt(v){ return METRICS[METRIC].money ? money(v) : String(Math.round(Number(v)||0)); }

/* Choosing a preset clears any custom range - leaving Week lit while a custom range is
   actually in force is exactly the misleading state the brief calls out. */
function setPeriod(p){
  PERIOD=p; RANGE=null;
  try{ sessionStorage.setItem('tsfg_lb_period',p); sessionStorage.removeItem('tsfg_lb_range'); }catch(e){}
  syncSegs(); load();
}
function setMetric(m){
  if(!METRICS[m]) return;
  METRIC=m; try{ sessionStorage.setItem('tsfg_lb_metric',m); }catch(e){}
  syncSegs();
  render();                      /* every metric is already in the one reply */
}
function setScope(sc){
  if(sc==='baseshop' && !SHOPOK) return;
  SCOPE=sc; try{ sessionStorage.setItem('tsfg_lb_scope',sc); }catch(e){}
  syncSegs(); load();            /* a different cohort is a different question for the server */
}
/* One place that decides what is lit, so the three rows and the custom pill can never
   disagree about what is actually in force. */
function syncSegs(){
  [].forEach.call(document.querySelectorAll('#segPeriod button'),function(b){
    b.classList.toggle('on', !RANGE && b.getAttribute('data-p')===PERIOD);
  });
  [].forEach.call(document.querySelectorAll('#segMetric button'),function(b){
    b.classList.toggle('on', b.getAttribute('data-m')===METRIC);
  });
  [].forEach.call(document.querySelectorAll('#segScope button'),function(b){
    b.classList.toggle('on', b.getAttribute('data-s')===SCOPE);
  });
  var btn=document.getElementById('rangeBtn'), now=document.getElementById('rangeNow');
  if(btn) btn.classList.toggle('on', !!RANGE);
  if(now) now.innerHTML = RANGE
    ? (esc(prettyRange(RANGE))+' <button class="rangeclear" onclick="setPeriod(PERIOD)">clear</button>')
    : '';
}
function prettyDay(d){
  var MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return MN[parseInt(d.slice(5,7),10)-1]+' '+parseInt(d.slice(8,10),10)+', '+d.slice(0,4);
}
function prettyRange(r){ return r.from===r.to ? prettyDay(r.from) : (prettyDay(r.from)+' – '+prettyDay(r.to)); }

/* ------------------------------- custom range ------------------------------ */
function openRange(){
  var t=new Date(), f=new Date(); f.setDate(1);
  function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  /* Opening starts from the range already in force, so reopening to nudge one day does not
     throw the other away. */
  document.getElementById('rFrom').value = RANGE? RANGE.from : ymd(f);
  document.getElementById('rTo').value   = RANGE? RANGE.to   : ymd(t);
  var note=document.getElementById('rNote');
  if(note) note.innerHTML='Both days are included. Figures are counted on the business date — production by the day it was written, Paid by the day the money landed.';
  document.getElementById('rangeSheet').classList.add('on');
}
function closeRange(){ document.getElementById('rangeSheet').classList.remove('on'); }
/* Edits are a draft until Apply; Cancel simply closes and the previously applied period
   still stands, because nothing outside this function is touched until Apply runs. */
function applyRange(){
  var f=document.getElementById('rFrom').value, t=document.getElementById('rTo').value;
  var note=document.getElementById('rNote');
  if(!f||!t){ if(note){ note.innerHTML='<b style="color:var(--tsfg-warn)">Pick both dates</b> — a range needs a start and an end.'; } return; }
  if(f>t){ var x=f; f=t; t=x; }          /* end before start is a slip, not an error - swap it */
  RANGE={from:f,to:t};
  try{ sessionStorage.setItem('tsfg_lb_range', JSON.stringify(RANGE)); }catch(e){}
  closeRange(); syncSegs(); load();
}

/* --------------------------------- loading -------------------------------- */
var DATA=null;

function load(){
  document.getElementById('body').innerHTML='<div class="tsfg-spin">Loading the board…</div>';
  /* leaderboard-api takes week / month / year. A custom range is computed here from the
     same board by asking for the widest period that contains it and filtering — see
     render(). Scope is 'hierarchy' so an agent sees the whole company board they compete on. */
  /* leaderboard-api v24 honours a day-exact range, so a custom period is now sent as what it
     is instead of being widened to the year and apologised for. All three dimensions go to the
     server; none of them is applied by hiding rows here. */
  var mine = ++SEQ;
  var body = {action:'board', code:CODE, scope:SCOPE, period:(RANGE?'custom':PERIOD)};
  if(RANGE){ body.from=RANGE.from; body.to=RANGE.to; }
  fetch(LB,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){ return r.json(); })
    .then(function(r){
      if(mine!==SEQ) return;                 /* a newer selection is already in flight */
      if(!r||!r.ok){
        document.getElementById('body').innerHTML='<div class="tsfg-empty"><b>Could not load the board</b><span>'+esc((r&&r.error)||'Try again in a moment.')+'</span></div>';
        return;
      }
      DATA=r; loadAvatars(); render();
    })
    .catch(function(){
      if(mine!==SEQ) return;
      document.getElementById('body').innerHTML='<div class="tsfg-empty"><b>Could not reach the server</b><span>Check your connection and try again.</span></div>';
    });
}

/* Base shop is offered only to the people who lead one - the same can_see_baseshop() rule the
   New Business tab uses, asked once through nb-baseshop's cheap check action so the two screens
   cannot disagree about who qualifies. */
function bootScope(){
  fetch(SHOPCHK,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'check'})})
    .then(function(r){ return r.json(); })
    .then(function(r){
      if(!r||!r.ok) return;
      MYSHOP=r.baseshop||''; SHOPOK=!!r.allowed;
      if(SHOPOK){ document.getElementById('scopeShop').style.display=''; }
      else if(SCOPE==='baseshop'){ SCOPE='hierarchy'; syncSegs(); load(); }
    }).catch(function(){});
}

/* Faces make a leaderboard feel like a team rather than a spreadsheet. They come from the
   same store the chat uses, and a missing one falls back to initials — never a broken image. */
function loadAvatars(){
  fetch(HUBAV,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'hub_avatars',code:CODE})})
    .then(function(r){ return r.json(); })
    .then(function(r){ if(r&&r.ok&&r.avatars){ AVATARS=r.avatars; render(); } })
    .catch(function(){});
}

function face(code,name,cls){
  var u = AVATARS[String(code||'').toUpperCase()];
  if(u) return '<img class="'+cls+'" src="'+esc(u)+'" alt="">';
  return '<div class="'+cls+' ini">'+esc(initials(name))+'</div>';
}

/* --------------------------------- render --------------------------------- */
/* What the board is actually showing, said in words, so a reader never has to guess which of
   the nine combinations produced the number in front of them. */
function periodWords(){
  if(RANGE) return prettyRange(RANGE);
  return PERIOD==='week' ? 'this week' : (PERIOD==='all' ? 'all time' : 'this month');
}
function scopeWords(){
  if(SCOPE==='baseshop')  return MYSHOP ? (MYSHOP+' base shop') : 'your base shop';
  if(SCOPE==='personal')  return 'you';
  return 'the whole organisation';
}

function render(){
  if(!DATA) return;
  var M = METRICS[METRIC];
  var board = (DATA.boards||{})[METRIC] || {};
  var host = document.getElementById('body');
  var sub = esc(M.sub)+' · '+esc(periodWords());

  /* PERSONAL IS NOT A RANKING. The server answers that scope with your own figure plus where it
     places you, which is the honest thing to show: a one-person podium would imply you had won
     a competition that was never run. */
  if(SCOPE==='personal'){
    var v = Number(board.value)||0;
    var lead = board.leader;
    var h = '<div class="tsfg-card" style="padding:18px 16px;text-align:center">'+
      '<div class="tsfg-muted" style="font-size:12px;font-weight:700">'+esc(M.label)+' · '+esc(periodWords())+'</div>'+
      '<div style="font-size:40px;font-weight:800;letter-spacing:-.03em;margin:6px 0 2px">'+fmt(v)+'</div>'+
      '<div class="tsfg-muted" style="font-size:12.5px">'+esc(M.sub)+'</div></div>';
    h += '<div class="yours" style="margin-top:12px">'+
      '<span class="ic">&#128200;</span>'+
      '<div><div class="k">In '+esc(DATA.base||'your base shop')+'</div><div class="v">'+
        (board.rank_base?('#'+board.rank_base+'<span style="font-size:12px;font-weight:600;color:var(--tsfg-ink-2)"> of '+board.of_base+'</span>'):'—')+'</div></div>'+
      '<div class="sep"></div>'+
      '<div><div class="k">Company-wide</div><div class="v">'+
        (board.rank_company?('#'+board.rank_company+'<span style="font-size:12px;font-weight:600;color:var(--tsfg-ink-2)"> of '+board.of_company+'</span>'):'—')+'</div></div>'+
    '</div>';
    if(lead && lead.name){
      h += '<p class="tsfg-muted" style="font-size:12.5px;margin:12px 2px 0">Leading '+esc(periodWords())+
           ': <b style="color:var(--tsfg-gold)">'+esc(lead.name)+'</b> with '+fmt(lead.value)+'.</p>';
    }
    host.innerHTML = h;
    return;
  }

  var rows  = (board.top||[]).slice();
  var note  = '';

  if(!rows.length){
    host.innerHTML = note+
      '<div class="tsfg-empty"><div class="ic"><svg viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/></svg></div>'+
      '<b>Nothing on the board yet</b><span>'+esc(M.sub)+' will appear here as the team logs it.</span></div>';
    return;
  }

  /* A podium needs three real people. With one or two, an empty plinth invents a competitor
     who does not exist - so below three the board drops straight to the ranking list. */
  var scored = Number(board.scored)||0;
  var top3 = rows.slice(0,3);
  var realTop3 = top3.filter(function(x){ return x && (Number(x.value)||0) > 0; }).length;
  if(realTop3 < 3){
    var html0 = note;
    if(scored===0){
      html0 += '<p class="tsfg-muted" style="font-size:12.5px;margin:0 0 12px">Nobody has scored '+esc(M.sub.toLowerCase())+' '+esc(periodWords())+' yet.</p>';
    }
    html0 += buildList(rows, board, M, sub);
    host.innerHTML = html0;
    return;
  }

  var order = [top3[1], top3[0], top3[2]];           /* 2nd · 1st · 3rd */

  var html = note + '<div class="pod">' + order.map(function(p,i){
    if(!p) return '<div></div>';
    var rank = (i===1)?1:(i===0?2:3);
    var first = rank===1;
    return '<div class="pod-s'+(first?' first':'')+'">'+
      (first?'<div class="crown">&#128081;</div>':'')+
      '<div class="rk">'+rank+'</div>'+
      face(p.code,p.name,'av')+
      '<div class="nm">'+esc(p.name)+'</div>'+
      '<span class="vl">'+fmt(p.value)+'</span>'+
    '</div>';
  }).join('') + '</div>';

  html += buildList(rows, board, M, sub);
  document.getElementById('body').innerHTML = html;
}

/* The ranking table and your own standing. Shared by the podium path and the fewer-than-three
   path so the two can never drift apart. The heading follows the chosen scope rather than
   always saying "Team rankings", which was wrong on two of the three scopes. */
function buildList(rows, board, M, sub){
  var heading = (SCOPE==='baseshop') ? (MYSHOP ? (MYSHOP+' rankings') : 'Base shop rankings')
                                     : 'Company rankings';
  var html = '<h2 class="tsfg-h" style="margin-bottom:2px">'+esc(heading)+'</h2>'+
             '<p class="tsfg-muted" style="font-size:12.5px;margin:0 0 11px">'+sub+'</p>';

  html += '<div class="tsfg-card" style="padding:9px 2px">'+
    '<div class="rank-head"><span>#</span><span style="grid-column:2/3">Team member</span><span>'+esc(M.label)+'</span></div>';

  /* Show the leading group, and always show YOU even if you are further down — a board you
     cannot find yourself on is just a list of other people. */
  var shown = rows.slice(0,8);
  var mine  = rows.filter(function(r){ return String(r.code||'').toUpperCase()===CODE; })[0];
  var meIn  = shown.some(function(r){ return String(r.code||'').toUpperCase()===CODE; });
  if(mine && !meIn) shown.push(mine);

  html += shown.map(function(r){
    var isMe = String(r.code||'').toUpperCase()===CODE;
    return '<div class="rank-row'+(isMe?' me':'')+'">'+
      '<span class="n">'+(r.rank||'')+'</span>'+
      face(r.code,r.name,'')+
      '<span class="nm">'+(isMe?'You':esc(r.name))+'</span>'+
      '<span class="vl">'+fmt(r.value)+'</span>'+
    '</div>';
  }).join('') + '</div>';

  /* Your rank, and how far the next place is — the one number that turns a table into a goal.
     "You are top" is only claimed when somebody was actually behind you; topping a board of
     one is not a win and must not be dressed as one. */
  var me = board.me || {rank:0,value:0};
  var scored = Number(board.scored)||0;
  if(me.rank){
    var ahead = rows.filter(function(r){ return (r.rank||0) === me.rank-1; })[0];
    var gap = ahead ? Math.max(0, (Number(ahead.value)||0) - (Number(me.value)||0)) : 0;
    var topHonest = (!ahead && scored > 1);
    html += '<div class="yours">'+
      '<span class="ic">&#128200;</span>'+
      '<div><div class="k">Your rank</div><div class="v">#'+me.rank+
        '<span style="font-size:12px;font-weight:600;color:var(--tsfg-ink-2)"> of '+(Number(board.total)||rows.length)+'</span></div></div>'+
      '<div class="sep"></div>'+
      '<div><div class="k">'+(ahead?'Next rank':(topHonest?'You are top':'Your total'))+'</div>'+
      '<div class="v">'+(ahead ? (fmt(gap)+' away') : (topHonest ? '&#127881;' : fmt(me.value)))+'</div></div>'+
    '</div>';
  }
  return html;
}

syncSegs();
bootScope();
load();
</script>
<script defer src="notif.js"></script>
<script src="i18n.js"></script>
</body>
