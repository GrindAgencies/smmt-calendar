<!doctype html>
<html lang="en">
<head>
<script src="session.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Standard — App</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Standard">
<link rel="stylesheet" href="tsfg-ui.css">
<style>
  /* The home screen. Everything general lives in tsfg-ui.css; what is here is only what
     this one screen has that no other screen does — the highlights wheel. */
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{ -webkit-tap-highlight-color:transparent; }

  /* ======================== DEPTH, NOT DECORATION ========================
     Christopher: the homepage "feels bland and flat". On a near-black ground a drop
     shadow is invisible - there is nothing darker to cast it onto - so depth has to
     come from SURFACE and EDGE instead: a tonal wash behind everything, cards a step
     lighter than the page, a warm hairline catching the top edge like light falling
     on it, and a shadow underneath to seat it. Low contrast on purpose: it should
     read as a lit room, not a pattern. */
  body::before{
    content:''; position:fixed; inset:0; z-index:-2; pointer-events:none;
    background:
      radial-gradient(120% 70% at 50% -8%,  rgba(214,175,98,.11) 0%, rgba(214,175,98,0) 58%),
      radial-gradient(100% 55% at 50% 104%, rgba(214,175,98,.05) 0%, rgba(214,175,98,0) 60%),
      var(--tsfg-bg, #090909);
  }
  /* A very fine grain stops the gradient banding on OLED phones. */
  body::after{
    content:''; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.025;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
  }

  .tsfg-tile{
    position:relative; overflow:hidden;
    background:linear-gradient(180deg, var(--tsfg-raise-2, #242424) 0%, var(--tsfg-raise, #191919) 100%);
    box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 6px 18px -8px rgba(0,0,0,.85);
    transition:transform .14s cubic-bezier(.2,.7,.3,1), box-shadow .14s ease, border-color .14s ease;
  }
  /* The lit top edge. One pixel, and it is what makes a flat rectangle read as an object. */
  .tsfg-tile::before{
    content:''; position:absolute; inset:0 0 auto; height:1px; pointer-events:none;
    background:linear-gradient(90deg, transparent, rgba(214,175,98,.42), transparent);
  }
  .tsfg-tile:active{
    transform:scale(.975);
    box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 2px 8px -6px rgba(0,0,0,.9);
    border-color:var(--tsfg-gold);
  }
  .hl-slide{ box-shadow:0 10px 26px -14px rgba(0,0,0,.9); }

  /* ===================== BRANDED DESTINATION OPENING =====================
     Tapping a tool names where it is going while the page is already loading. It is one
     navigation, not a splash screen: the route is set immediately and the overlay simply
     covers the gap. Capped well under half a second, and skipped outright for anyone who
     has asked for less motion. */
  .nav-go{
    position:fixed; inset:0; z-index:200; display:none;
    align-items:center; justify-content:center; background:var(--tsfg-bg, #090909);
    opacity:0; transition:opacity .16s ease;
  }
  .nav-go.on{ display:flex; opacity:1; }
  /* ROUND TWO, task 14: the entrance is now a deliberate ~3 seconds with a glisten, which
     supersedes the first brief's 250-450ms. The budget is the WHOLE transition, not three
     seconds added to it:
        0 - 0.4s   the title rises in and the rule draws under it
        0.4 - 2.5s it sits still and readable while ONE warm-gold sweep crosses the letters
        2.5s       we hand over to the destination, whose own arrival finishes around 3s
     The shimmer is a moving gradient clipped to the glyphs, so it lights the lettering
     itself rather than putting a white bar over the top of it; the gold stays legible
     throughout because the sweep only brightens, never washes out. */
  .nav-go .ttl{
    font-size:clamp(23px,7vw,30px); font-weight:800; letter-spacing:-.03em;
    color:var(--tsfg-gold);
    transform:translateY(7px) scale(.985); opacity:0;
    animation:navrise .40s cubic-bezier(.2,.7,.3,1) forwards;
  }
  .nav-go .ttl::after{
    content:attr(data-t); position:absolute; left:0; right:0; top:0; bottom:0;
    display:flex; align-items:center; justify-content:center; pointer-events:none;
    background:linear-gradient(100deg,
      rgba(255,240,205,0) 38%, rgba(255,243,214,.95) 50%, rgba(255,240,205,0) 62%);
    background-size:260% 100%; background-position:160% 0;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
    animation:navsheen 1.5s cubic-bezier(.4,0,.2,1) .55s 1 forwards;
  }
  .nav-go .rule{
    position:absolute; left:50%; bottom:calc(50% - 32px); width:0; height:1px;
    background:linear-gradient(90deg, transparent, var(--tsfg-gold), transparent);
    transform:translateX(-50%); animation:navrule .45s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes navrise{ to{ transform:none; opacity:1; } }
  @keyframes navrule{ to{ width:150px; } }
  @keyframes navsheen{ from{ background-position:160% 0; } to{ background-position:-60% 0; } }
  @media (prefers-reduced-motion: reduce){
    .nav-go, .nav-go .ttl, .nav-go .rule{ animation:none !important; transition:none !important; }
    .nav-go .ttl{ opacity:1; transform:none; }
    .tsfg-tile{ transition:none; }
  }

  /* ===================== MANAGE HIGHLIGHTS (Elijah only) ===================== */
  .mg-ov{ position:fixed; inset:0; z-index:150; background:rgba(0,0,0,.74); display:none;
    align-items:flex-end; justify-content:center; -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
  .mg-ov.on{ display:flex; }
  .mg-c{ width:100%; max-width:520px; max-height:88dvh; overflow-y:auto;
    background:var(--tsfg-raise); border:1px solid var(--tsfg-line);
    border-radius:var(--tsfg-r) var(--tsfg-r) 0 0;
    padding:16px 15px calc(env(safe-area-inset-bottom) + 18px); }
  .mg-row{ display:flex; gap:11px; align-items:center; padding:9px 0; border-bottom:1px solid var(--tsfg-line); }
  .mg-row:last-child{ border-bottom:0; }
  .mg-row img{ width:66px; height:40px; object-fit:cover; border-radius:8px; flex:0 0 auto; background:var(--tsfg-raise-2); }
  .mg-row .t{ flex:1 1 auto; min-width:0; font-size:13px; line-height:1.35; }
  .mg-row .t b{ display:block; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mg-row .t span{ color:var(--tsfg-ink-3); font-size:11.5px; }
  .mg-b{ border:1px solid var(--tsfg-line); background:var(--tsfg-raise-2); color:var(--tsfg-ink);
    border-radius:9px; width:32px; height:32px; font-size:15px; cursor:pointer; flex:0 0 auto; }
  .mg-b:disabled{ opacity:.3; }
  .mg-b.danger{ color:var(--tsfg-bad, #ff6b6b); }

  /* ===================== THE TEAM HIGHLIGHTS WHEEL =====================
     Christopher: "create a team wheel of highlights through uploaded images."
     A scroll-snap rail rather than a JS carousel: one element per image, it
     flicks with the thumb the way a phone gallery does, it still works if the
     script fails, and it costs no timer. The dots follow the scroll. */
  .hl{ position:relative; margin:4px 0 6px; }
  .hl-rail{
    display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch; scrollbar-width:none; border-radius:var(--tsfg-r);
  }
  .hl-rail::-webkit-scrollbar{ display:none; }
  .hl-slide{
    position:relative; flex:0 0 100%; scroll-snap-align:center;
    aspect-ratio:16/10; border-radius:var(--tsfg-r); overflow:hidden;
    border:1px solid var(--tsfg-gold-dim); background:var(--tsfg-raise);
  }
  .hl-slide img{ width:100%; height:100%; object-fit:cover; display:block; }
  .hl-slide .cap{
    position:absolute; left:0; right:0; bottom:0; padding:30px 14px 13px;
    background:linear-gradient(transparent, rgba(0,0,0,.82));
    font-size:15px; font-weight:800; letter-spacing:-.01em;
  }
  .hl-slide .rm{
    position:absolute; top:9px; left:9px; width:30px; height:30px; border-radius:50%;
    border:0; background:rgba(0,0,0,.62); color:#fff; font-size:17px; cursor:pointer;
    display:none; align-items:center; justify-content:center; line-height:1;
  }
  body.can-post .hl-slide .rm{ display:flex; }

  /* The row only takes space when there is something in it: the title is always useful, but
     Manage belongs to the authorised account only, which body.can-post still governs. */
  .hl-head{ display:flex; align-items:center; gap:10px; margin:0 2px 8px; min-height:30px; }
  .hl-head-t{
    font-size:12px; font-weight:800; letter-spacing:.09em; text-transform:uppercase;
    color:var(--tsfg-ink-3); flex:1 1 auto; min-width:0;
  }
  .hl-up{
    flex:0 0 auto;
    display:none; align-items:center; gap:7px;
    padding:7px 12px; border-radius:var(--tsfg-r-pill);
    background:var(--tsfg-raise-2); border:1px solid var(--tsfg-line); color:var(--tsfg-ink);
    font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .hl-up:active{ background:var(--tsfg-raise); }
  body.can-post .hl-up{ display:inline-flex; }
  .hl-up svg{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8; }

  .hl-dots{ display:flex; gap:6px; justify-content:center; margin-top:9px; min-height:6px; }
  .hl-dots i{ width:6px; height:6px; border-radius:50%; background:var(--tsfg-line); transition:background .18s; }
  .hl-dots i.on{ background:var(--tsfg-gold); }

  /* The empty state sits in the same frame so the page does not jump once images load. */
  .hl-none{
    flex:0 0 100%; aspect-ratio:16/10; border-radius:var(--tsfg-r);
    border:1px dashed var(--tsfg-line);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px;
    color:var(--tsfg-ink-2); text-align:center; padding:20px;
  }
  .hl-none svg{ width:30px; height:30px; stroke:var(--tsfg-ink-3); fill:none; stroke-width:1.4; }
  .hl-none b{ color:var(--tsfg-ink); font-size:14.5px; }
  .hl-none span{ font-size:12.5px; max-width:250px; line-height:1.45; }

  .toast{
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(76px + env(safe-area-inset-bottom));
    background:#1d1d1f; color:#fff; border:1px solid var(--tsfg-line);
    padding:11px 17px; border-radius:var(--tsfg-r-pill); font-size:13.5px; font-weight:600;
    opacity:0; pointer-events:none; transition:opacity .2s; z-index:200; max-width:88vw; text-align:center;
  }
  .toast.on{ opacity:1; }

  /* The gear sits over the centred header rather than in its flow, so the wordmark stays
     optically centred and the bell (notif.js, upper right) balances it. 24px glyph, 44px tap
     target, clear of the safe area. */
  .tsfg-brand{ position:relative; }
  .brand-gear{
    position:absolute; left:4px; top:calc(10px + env(safe-area-inset-top));
    width:44px; height:44px; display:flex; align-items:center; justify-content:center;
    color:var(--tsfg-gold-dim); text-decoration:none; border-radius:50%;
  }
  .brand-gear svg{ width:23px; height:23px; }
  .brand-gear:active{ background:rgba(201,154,46,.14); }

</style>
</head>
<body class="tsfg">

<div class="tsfg-wrap">

  <!-- THE MARK, AND THE GEAR.
       The header used to render apple-touch-icon.png. That file is the iOS home-screen icon:
       180x180, RGB, with the black ground baked in and no alpha -- which is the black square
       behind the logo in screenshot G of the 2026-10-23 handoff. It is pointed at logo.png
       instead, which now carries real transparency.
       apple-touch-icon.png is deliberately NOT altered: iOS composites the home-screen icon
       onto an opaque tile and does not honour transparency there, so making it transparent
       would fix a header nobody complained about twice and damage the installed app icon.
       Different jobs, different files.

       The gear is section 3's requested upper-left entry to Profile & Settings. The bell stays
       where it is -- notif.js owns it, upper right -- so the two side actions balance and the
       wordmark stays optically centred. -->
  <header class="tsfg-brand">
    <a class="brand-gear" href="profile.html" aria-label="Profile and settings" title="Profile &amp; Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3.1"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </a>
    <img src="logo.png" alt="" onerror="this.style.display='none'">
    <h1>THE STANDARD</h1>
    <div class="sub">Financial Group</div>
  </header>

  <!-- ======================= team highlights ======================= -->
  <section class="hl" aria-label="Team highlights">
    <!-- MANAGE SITS BESIDE THE ARTWORK, NOT ON IT. It was an absolutely positioned pill at the
         top-right of the image, and on the current highlight it lands straight across the
         headline. Section 3 of the 2026-10-23 handoff: the preview's pill "is a placement
         reference, not permission to cover real headline content", and names the preferred
         refinement -- "a compact title/action row adjacent to the image, leaving the image
         itself clear". This is that row.
         Everything else about highlights is untouched: the carousel, the dots, the per-slide
         remove control, the uploads, and the body.can-post rule that keeps management to the
         authorised account. -->
    <div class="hl-head">
      <span class="hl-head-t">Team highlights</span>
      <button class="hl-up" onclick="openManage()" aria-label="Manage team highlights">
      <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"/></svg>
      Manage
      </button>
    </div>
    <div class="hl-rail" id="rail">
      <div class="hl-none" id="hlNone">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="m21 15-4.5-4.5L7 20"/></svg>
        <b>No highlights yet</b>
        <span id="hlNoneSub">Loading…</span>
      </div>
    </div>
    <div class="hl-dots" id="dots"></div>
    <input type="file" id="fileIn" accept="image/*" multiple hidden>
    <input type="file" id="fileSwap" accept="image/*" hidden>
  </section>

  <!-- ========================== your tools ========================= -->
  <h2 class="tsfg-h">Your tools</h2>
  <div class="tsfg-tiles">
    <button class="tsfg-tile" onclick="go('teamhub.html')">
      <svg viewBox="0 0 24 24"><path d="M8.5 15.5H6a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/><path d="M10 19.5h8a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2Z"/></svg>
      The Hub<span class="badge" id="chatDot" style="display:none"></span>
    </button>
    <button class="tsfg-tile" onclick="go('leaderboard.html')">
      <svg viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/><path d="M12 14v3m-3 3h6"/></svg>
      Leaderboard
    </button>
    <button class="tsfg-tile" onclick="go('scheduler.html')">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4m8-4v4"/></svg>
      Scheduler
    </button>
    <button class="tsfg-tile" onclick="go('newbiz.html')">
      <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M12 11v5m-2.5-2.5h5"/></svg>
      New Business
    </button>
    <button class="tsfg-tile" onclick="go('summit.html?tab=road')">
      <svg viewBox="0 0 24 24"><path d="M4 20 12 4l8 16"/><path d="m8 13 4-2 4 2"/></svg>
      Road to EMD
    </button>
    <button class="tsfg-tile" onclick="go('resources.html')">
      <svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5Z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5Z"/></svg>
      Resource Library
    </button>
  </div>

</div>


<!-- Manage highlights. Only ever opened by the one account the server lets edit; every
     button in here is refused server-side as well, so the sheet is convenience, not security. -->
<div class="mg-ov" id="mgOv" onclick="if(event.target===this)closeManage()">
  <div class="mg-c">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <h3 style="margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em;flex:1">Team highlights</h3>
      <button class="mg-b" onclick="closeManage()" aria-label="Close">&times;</button>
    </div>
    <div id="mgList"></div>
    <button class="tsfg-btn" style="margin-top:14px" onclick="pickImages()">+&nbsp; Add photos</button>
    <p class="tsfg-muted" style="font-size:11.5px;line-height:1.5;margin:10px 2px 0" id="mgNote"></p>
  </div>
</div>

<!-- The branded opening. Inserted once and reused; it never traps focus because it is
     removed the moment the next page takes over. -->
<div class="nav-go" id="navGo" aria-hidden="true"><div class="rule"></div><div class="ttl" id="navTtl" data-t=""></div></div>

<div class="toast" id="toast"></div>

<script>
  var HL_API = 'https://bmfqxtocxkjhsgfnndlo.supabase.co/functions/v1/highlights';

  /* Signed out? This launcher has nothing to show — send them to sign in. */
  try{ if(!localStorage.getItem('tsfg_code')) location.replace('index.html'); }catch(e){}

  /* Tapping a tool names where it is going while the route is ALREADY being followed - the
     navigation starts first and the overlay covers the gap, so nothing is delayed waiting for
     an animation. Repeated taps are swallowed. Reduced motion skips it entirely. */
  var NAVING = false;
  var TOOL_TITLES = {
    'teamhub.html':'The Hub', 'leaderboard.html':'Leaderboard', 'scheduler.html':'Scheduler',
    'newbiz.html':'New Business', 'resources.html':'Resource Library',
    'summit.html?tab=road':'Road to EMD', 'profile.html':'Profile', 'index.html':'The Standard'
  };
  /* Round two, task 14: a deliberate ~3s entrance. HOLD_MS is how long the title is shown
     before handing over; the destination's own arrival animation carries it to about three
     seconds total, so this is the whole budget rather than three seconds bolted on. */
  var HOLD_MS = 2700;   /* 2.70s here + the destination's 0.26s arrival = 2.96s, i.e. the ~3s asked for */
  function go(u){
    if (NAVING) return;                      /* repeated taps cannot stack routes or overlays */
    NAVING = true;
    var title = TOOL_TITLES[u] || '';
    var reduce = false;
    try{ reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
    if (!title || reduce){ location.href = u; return; }

    /* The navigation is NOT what the three seconds are spent waiting for. The destination is
       fetched immediately, in parallel, so by the time the title finishes the page is usually
       already in the browser's cache and appears at once. Without this the animation would be
       three seconds of nothing followed by a load. */
    try{
      var pre = document.createElement('link');
      pre.rel = 'prefetch'; pre.href = u; pre.as = 'document';
      document.head.appendChild(pre);
    }catch(e){}

    var ov = document.getElementById('navGo'), tt = document.getElementById('navTtl');
    if (ov && tt){
      tt.textContent = title;
      tt.setAttribute('data-t', title);      /* the glisten layer reads the same text */
      ov.classList.add('on');
    }
    setTimeout(function(){ location.href = u; }, HOLD_MS);
  }
  /* Coming back via the back button can restore this page from cache with the overlay still
     showing. Clear it on show, or Home looks frozen behind its own title. */
  window.addEventListener('pageshow', function(){
    NAVING = false;
    var ov = document.getElementById('navGo'); if (ov) ov.classList.remove('on');
  });
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._x); t._x=setTimeout(function(){t.classList.remove('on');},2600); }

  /* ======================= team highlights ======================= */
  var HL = [], CANEDIT = false, MAXHL = 12;

  function hlApi(body){
    return fetch(HL_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})})
      .then(function(r){ return r.json(); })
      .catch(function(){ return {ok:false, error:'Network error'}; });
  }

  function loadHighlights(){
    hlApi({action:'list'}).then(function(r){
      var sub = document.getElementById('hlNoneSub');
      if(!r || !r.ok){ if(sub) sub.textContent = 'Could not load highlights.'; return; }
      HL = r.highlights || [];
      CANEDIT = !!r.can_edit;
      MAXHL = Number(r.max) || 12;
      document.body.classList.toggle('can-post', CANEDIT);
      if (sub) sub.textContent = CANEDIT
        ? 'Add photos of the team — everyone will see them here.'
        : 'Elijah adds photos of the team here.';
      paintHighlights();
      if (document.getElementById('mgOv').classList.contains('on')) paintManage();
    });
  }

  function paintHighlights(){
    var rail = document.getElementById('rail');
    if (!HL.length){
      /* Rebuild the empty frame rather than returning early. Returning early only held while
         the rail had never been painted - once it had, removing the LAST photo left a blank
         strip where the empty state should be, and the tools below jumped up to meet it. */
      rail.innerHTML =
        '<div class="hl-none" id="hlNone">'+
          '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="m21 15-4.5-4.5L7 20"/></svg>'+
          /* The section is named once now, by .hl-head above the rail. Repeating it inside the
             empty frame read as a duplicate, so this says what the state is instead. */
          '<b>No highlights yet</b>'+
          '<span id="hlNoneSub">'+(CANEDIT
            ? 'Add photos of the team \u2014 everyone will see them here.'
            : 'Elijah adds photos of the team here.')+'</span>'+
        '</div>';
      paintDots(); return;
    }
    rail.innerHTML = HL.map(function(h,i){
      return '<div class="hl-slide" role="group" aria-label="Highlight '+(i+1)+' of '+HL.length+'">'+
        (CANEDIT ? '<button class="rm" title="Remove this highlight" onclick="removeHighlight(event,\''+h.id+'\')">&times;</button>' : '')+
        '<img src="'+esc(h.url)+'" alt="'+esc(h.caption||('Team highlight '+(i+1)))+'" loading="lazy">'+
        '<div class="cap">'+esc(h.caption || 'Team highlights')+'</div>'+
      '</div>';
    }).join('');
    paintDots();
  }

  /* ---------------------- manage (the editor's sheet) ---------------------- */
  var SWAPID = null;
  function openManage(){
    if (!CANEDIT){ toast('Team highlights are managed by Elijah Cox.'); return; }
    document.getElementById('mgOv').classList.add('on');
    paintManage();
  }
  function closeManage(){ document.getElementById('mgOv').classList.remove('on'); }

  function paintManage(){
    var host = document.getElementById('mgList');
    var note = document.getElementById('mgNote');
    if (!HL.length){
      host.innerHTML = '<p class="tsfg-muted" style="font-size:13px;margin:6px 2px 0">No highlights yet. Add a few photos of the team and they appear on everyone\u2019s home screen.</p>';
    } else {
      host.innerHTML = HL.map(function(h,i){
        return '<div class="mg-row">'+
          '<img src="'+esc(h.url)+'" alt="">'+
          '<div class="t"><b>'+esc(h.caption || ('Highlight '+(i+1)))+'</b>'+
            '<span>'+(i+1)+' of '+HL.length+(h.by?(' \u00b7 '+esc(h.by)):'')+'</span></div>'+
          '<button class="mg-b" onclick="moveHighlight('+i+',-1)" '+(i===0?'disabled':'')+' aria-label="Move up">&uarr;</button>'+
          '<button class="mg-b" onclick="moveHighlight('+i+',1)" '+(i===HL.length-1?'disabled':'')+' aria-label="Move down">&darr;</button>'+
          '<button class="mg-b" onclick="swapHighlight(\''+h.id+'\')" aria-label="Replace photo">&#8634;</button>'+
          '<button class="mg-b danger" onclick="removeHighlight(event,\''+h.id+'\')" aria-label="Remove">&times;</button>'+
        '</div>';
      }).join('');
    }
    if (note) note.textContent = HL.length + ' of ' + MAXHL + ' \u00b7 changes save as you make them.';
  }

  /* Reordering writes immediately rather than collecting a draft: there is one list, the
     arrows show what happened, and a half-applied order is impossible because the server is
     sent the whole arrangement at once. */
  function moveHighlight(i, dir){
    var j = i + dir;
    if (j < 0 || j >= HL.length) return;
    var t = HL[i]; HL[i] = HL[j]; HL[j] = t;
    paintManage(); paintHighlights();
    hlApi({action:'reorder', ids: HL.map(function(h){ return h.id; })}).then(function(r){
      if (!r || !r.ok){ toast((r && r.error) || 'Could not save that order'); loadHighlights(); }
    });
  }

  function swapHighlight(id){ SWAPID = id; document.getElementById('fileSwap').click(); }

  document.getElementById('fileSwap').addEventListener('change', function(){
    var f = (this.files || [])[0]; this.value=''; 
    if (!f || !SWAPID) return;
    var id = SWAPID; SWAPID = null;
    toast('Replacing\u2026');
    shrink(f)
      .then(function(url){ return hlApi({action:'replace', id:id, url:url}); })
      .then(function(r){
        if (r && r.ok){ toast('Photo replaced'); loadHighlights(); }
        else toast((r && r.error) || 'Could not replace that photo');
      })
      .catch(function(){ toast('Could not read that file'); });
  });

  function paintDots(){
    var d = document.getElementById('dots');
    if (HL.length < 2){ d.innerHTML=''; return; }
    d.innerHTML = HL.map(function(_,i){ return '<i'+(i===0?' class="on"':'')+'></i>'; }).join('');
  }

  /* The dots follow the rail rather than driving it, so a thumb-flick and the dots agree. */
  document.getElementById('rail').addEventListener('scroll', function(){
    var dots = document.getElementById('dots').children;
    if (!dots.length) return;
    var i = Math.round(this.scrollLeft / Math.max(1, this.clientWidth));
    for (var k=0;k<dots.length;k++) dots[k].classList.toggle('on', k===i);
  }, {passive:true});

  function pickImages(){ document.getElementById('fileIn').click(); }

  /* A phone photo is 3–8 MB and 4000px wide. Sending that would make the wheel crawl, so it
     is resized in the browser first — the same approach profile photos already use. 1400px
     is plenty for a full-bleed card on any phone. */
  function shrink(file){
    return new Promise(function(resolve,reject){
      var fr = new FileReader();
      fr.onerror = function(){ reject(new Error('Could not read that file')); };
      fr.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error('That file is not an image')); };
        img.onload = function(){
          var MAX = 1400, w = img.width, h = img.height;
          if (w > MAX){ h = Math.round(h * MAX / w); w = MAX; }
          var c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          var q = 0.72, out = c.toDataURL('image/jpeg', q);
          /* Step the quality down until it is comfortably under the server's limit. */
          while (out.length > 850000 && q > 0.4){ q -= 0.08; out = c.toDataURL('image/jpeg', q); }
          resolve(out);
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  document.getElementById('fileIn').addEventListener('change', function(){
    var files = Array.prototype.slice.call(this.files || []);
    this.value = '';
    if (!files.length) return;
    toast(files.length === 1 ? 'Adding your photo…' : 'Adding '+files.length+' photos…');

    /* One at a time: a phone uploading six large images at once stalls, and a failure
       halfway through should still leave the earlier ones saved. */
    var done = 0, failed = 0, lastErr = '';
    files.reduce(function(chain, f){
      return chain.then(function(){
        return shrink(f)
          .then(function(url){ return hlApi({action:'add', url:url}); })
          .then(function(r){ if (r && r.ok) done++; else { failed++; if (r && r.error) lastErr = r.error; } })
          .catch(function(){ failed++; });
      });
    }, Promise.resolve()).then(function(){
      if (done) toast(done === 1 ? 'Photo added' : done+' photos added');
      else toast(lastErr || 'Could not add that photo');
      loadHighlights();
    });
  });

  function removeHighlight(ev, id){
    ev.stopPropagation();
    hlApi({action:'remove', id:id}).then(function(r){
      if (r && r.ok){ toast('Removed'); loadHighlights(); }
      else toast((r && r.error) || 'Could not remove that');
    });
  }

  /* The bottom tab bar is gone (Christopher, 2026-10-21: "redundant and unnecessary" —
     every destination it held is already a tile above). notif.js's own bell was hidden on
     this screen ONLY because the Alerts tab stood in for it, so it is visible again; it is
     now the way to reach notifications from here. The helper that proxied taps to it and the
     timer that mirrored its unread count onto the tab went with the tab.

     Dropping .tsfg-haspad from <body> also drops tsfg-ui.css's tab-bar offset for the Ask
     button, which is correct: with no bar to clear it sits at its normal bottom-right spot.
     body.tsfg-hasfab still supplies the padding that keeps the last tile clear of it. */

  /* Belt and braces — notif.js registers this too, but a cold launch should not depend
     on a deferred script to become installable. */
  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }

  loadHighlights();
</script>
<script defer src="notif.js"></script>
<script src="i18n.js"></script>
</body>
</html>
