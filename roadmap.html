<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Journey — The Standard</title>
<link rel="icon" href="logo.png">
<style>
*{box-sizing:border-box}
:root{--bg:#f5f5f7;--panel:#fff;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#8e8e93;--line:#ececf0;--line2:#e3e3e8;--accent:#5b6cff;--gold:#c99a2e;--green:#1a9c52;--tsfg-accent:#5b6cff;--tsfg-side:248px;}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none}
body{padding-left:var(--tsfg-side);padding-top:60px;}
/* shell */
.tsfg-scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:880;}body.tsfg-drawer .tsfg-scrim{display:block;}
.tsfg-side{position:fixed;left:0;top:0;height:100vh;width:var(--tsfg-side);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px;padding:16px 12px;z-index:900;overflow-y:auto;transition:transform .24s;}
.tsfg-brand{display:flex;align-items:center;gap:11px;padding:6px 8px 14px;color:var(--ink);}
.tsfg-brand img{width:34px;height:34px;border-radius:10px;object-fit:cover;}
.tsfg-brand .bn{font-weight:800;font-size:16px;}.tsfg-brand .bn b{color:var(--accent);}
.side-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink2);font-weight:600;font-size:14px;transition:.15s;white-space:nowrap;}
.side-link svg{width:20px;height:20px;flex:0 0 auto;}
.side-link:hover{background:var(--bg);color:var(--ink);}.side-link.on{background:rgba(91,108,255,.10);color:var(--accent);}
.tsfg-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);}
.tsfg-top{position:fixed;top:0;left:var(--tsfg-side);right:0;height:60px;z-index:850;display:flex;align-items:center;gap:14px;padding:0 22px;background:rgba(245,245,247,.85);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);}
.tsfg-title{font-weight:800;font-size:17px;}
.tsfg-ic{width:38px;height:38px;border-radius:11px;border:1px solid var(--line2);background:#fff;color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer;}.tsfg-ic svg{width:18px;height:18px;}
@media(max-width:860px){body{padding-left:0;}.tsfg-side{transform:translateX(-100%);box-shadow:0 20px 60px rgba(0,0,0,.25);}body.tsfg-drawer .tsfg-side{transform:none;}.tsfg-top{left:0;}}
.wrap{max-width:none;margin:0 auto;padding:18px 22px 100px;}
/* HUD */
.hud{position:relative;overflow:hidden;border-radius:22px;padding:20px;color:#fff;background:linear-gradient(135deg,#3a2f6b,#5b6cff 55%,#7c8bff);box-shadow:0 14px 40px rgba(91,108,255,.28);}
.hud .row{display:flex;align-items:center;gap:15px;}
.hud .av{position:relative;width:64px;height:64px;border-radius:50%;flex:0 0 auto;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35);}
.hud .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.hud .nm{font-size:20px;font-weight:900;letter-spacing:-.02em;line-height:1.1;}
.hud .sub{font-size:12.5px;opacity:.9;margin-top:3px;font-weight:600;}
.hud .streak{margin-left:auto;text-align:center;background:rgba(255,255,255,.15);border-radius:14px;padding:8px 12px;flex:0 0 auto;}
.hud .streak .f{font-size:22px;line-height:1;}.hud .streak .n{font-size:13px;font-weight:900;margin-top:2px;}.hud .streak .l{font-size:9px;opacity:.85;text-transform:uppercase;letter-spacing:.05em;}
.xpwrap{margin-top:16px;}
.xprow{display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:6px;}
.xpbar{height:12px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;}
.xpbar>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffe08a,#ffd24a);transition:width .8s cubic-bezier(.2,.8,.2,1);}
.chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.chip{background:rgba(255,255,255,.16);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700;}
/* nearby */
.near{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none;}.near::-webkit-scrollbar{display:none;}
.ncard{flex:0 0 auto;min-width:130px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px 12px;}
.ncard .t{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
.ncard.ahead .t{color:#e0533d;}.ncard.same .t{color:var(--accent);}.ncard.behind .t{color:var(--green);}
.ncard .p{display:flex;align-items:center;gap:8px;}
.nav2{position:relative;width:30px;height:30px;border-radius:50%;background:#eef0f4;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;overflow:hidden;flex:0 0 auto;}
.nav2 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.ncard .nn{font-size:12.5px;font-weight:700;line-height:1.1;}.ncard .nl{font-size:10.5px;color:var(--ink3);}
.sechead{font-size:12px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;margin:24px 4px 6px;}
/* PATH */
.world{margin-top:22px;}
.wband{display:flex;align-items:center;gap:11px;border-radius:16px;padding:12px 16px;color:#fff;font-weight:900;letter-spacing:-.01em;box-shadow:0 8px 22px rgba(0,0,0,.12);}
.wband .wi{font-size:22px;}.wband .wt{font-size:16px;}.wband .wc{margin-left:auto;font-size:11px;font-weight:800;opacity:.9;background:rgba(255,255,255,.2);padding:4px 9px;border-radius:99px;}
.path{position:relative;padding:8px 0 4px;}
.path::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:4px;transform:translateX(-50%);background:repeating-linear-gradient(180deg,var(--line2) 0 10px,transparent 10px 20px);}
.node{position:relative;display:flex;align-items:center;gap:14px;padding:14px 0;width:calc(50% + 34px);}
.node.r{margin-left:auto;flex-direction:row-reverse;text-align:right;}
.dot{position:relative;z-index:2;width:60px;height:60px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#fff;border:4px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.18);cursor:pointer;transition:transform .12s;}
.dot:active{transform:scale(.94);}
.node.locked .dot{background:#c9c9d0;cursor:default;box-shadow:none;}
.node.locked .lbl{opacity:.6;}
.dot.done{background:linear-gradient(180deg,#3ec98a,#1a9c52);}
.dot .av3{position:absolute;inset:-4px;border-radius:50%;overflow:hidden;border:4px solid #ffd24a;box-shadow:0 0 0 4px rgba(255,210,74,.4),0 6px 18px rgba(0,0,0,.25);}
.dot .av3 img{width:100%;height:100%;object-fit:cover;}.dot .av3 .ini{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#5b6cff;}
.node.active .dot{animation:pulse 1.8s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,210,74,.5),0 6px 16px rgba(0,0,0,.18);}50%{box-shadow:0 0 0 10px rgba(255,210,74,0),0 6px 16px rgba(0,0,0,.18);}}
.lbl{min-width:0;}
.lbl .ln{font-weight:800;font-size:14.5px;line-height:1.15;}
.lbl .lm{font-size:11.5px;color:var(--ink3);margin-top:3px;font-weight:600;}
.lbl .lx{font-size:10.5px;font-weight:800;color:var(--gold);margin-top:3px;}
.node.active .lbl .ln::after{content:' • YOU ARE HERE';color:var(--accent);font-size:9.5px;font-weight:900;letter-spacing:.05em;}
/* drawer */
.ov{position:fixed;inset:0;z-index:1200;background:rgba(10,8,20,.55);display:none;align-items:flex-end;justify-content:center;}
.ov.on{display:flex;}
.sheet{width:100%;max-width:560px;background:#fff;border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;padding:20px;box-shadow:0 -20px 60px rgba(0,0,0,.3);}
@media(min-width:640px){.ov{align-items:center;}.sheet{border-radius:22px;}}
.sh-h{display:flex;align-items:flex-start;gap:12px;}
.sh-ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;flex:0 0 auto;}
.sh-h h3{margin:0;font-size:19px;font-weight:900;letter-spacing:-.02em;}
.sh-h .d{font-size:13px;color:var(--ink2);margin-top:3px;}
.sh-x{margin-left:auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:#f2f2f5;font-size:16px;font-weight:800;color:var(--ink2);cursor:pointer;flex:0 0 auto;}
.reward{margin-top:14px;background:var(--gold-soft,rgba(201,154,46,.12));border:1px solid #e6cf8a;border-radius:12px;padding:10px 13px;font-size:12.5px;font-weight:700;color:#8a6d1f;}
.chl{margin-top:14px;}
.chl .ci{display:flex;align-items:center;gap:12px;padding:13px 12px;border:1px solid var(--line);border-radius:13px;margin-top:8px;cursor:pointer;transition:.12s;}
.chl .ci:hover{border-color:var(--accent);}
.chl .ci.done{background:rgba(26,156,82,.07);border-color:#9fdcbb;}
.ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--line2);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;font-weight:900;}
.ci.done .ck{background:var(--green);border-color:var(--green);}
.ci .cn{font-size:14px;font-weight:600;}.ci.done .cn{color:var(--ink2);}
.ci .cx{margin-left:auto;font-size:11px;font-weight:800;color:var(--gold);}
.chl .ci.pend{background:rgba(234,179,8,.09);border-color:#e7c86a;}
.ci.pend .ck{background:#eab308;border-color:#eab308;color:#3a2f00;}
.cv-tag{display:inline-block;margin-left:8px;font-size:9.5px;font-weight:900;letter-spacing:.02em;padding:2px 7px;border-radius:99px;vertical-align:middle;}
.cv-tag.ok{background:rgba(26,156,82,.16);color:#1a9c52;}
.cv-tag.pend{background:rgba(234,179,8,.18);color:#a17d00;}
.cv-tag.key{background:rgba(120,120,140,.14);color:var(--ink3);}
.lvl-guide{margin-top:12px;background:rgba(91,108,255,.08);border:1px solid rgba(91,108,255,.22);border-radius:13px;padding:12px 14px;font-size:13.5px;line-height:1.5;color:var(--ink2);}
.lvl-guide-h{font-size:11px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:5px;}
.lvl-cta{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,#5b6cff,#7c8bff);color:#fff;font-weight:800;font-size:15px;text-decoration:none;box-shadow:0 10px 24px rgba(91,108,255,.32);}
.lvl-cta:active{transform:scale(.98);}
.locknote{margin-top:14px;text-align:center;color:var(--ink3);font-size:13px;font-weight:600;padding:12px;background:#f2f2f5;border-radius:12px;}
/* celebration */
.cele{position:fixed;inset:0;z-index:1400;display:none;align-items:center;justify-content:center;background:rgba(10,8,20,.6);}
.cele.on{display:flex;}
.celecard{background:#fff;border-radius:22px;padding:30px 26px;text-align:center;max-width:340px;animation:pop .4s cubic-bezier(.2,1.3,.5,1);}
@keyframes pop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
.celecard .big{font-size:52px;}.celecard h2{margin:8px 0 4px;font-size:22px;font-weight:900;}.celecard p{color:var(--ink2);font-size:14px;margin:0 0 16px;}
.celecard .xpgain{font-size:15px;font-weight:900;color:var(--gold);margin-bottom:16px;}
.celecard button{border:none;background:var(--accent);color:#fff;font-weight:800;font-size:15px;padding:12px 22px;border-radius:12px;cursor:pointer;font-family:inherit;}
.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:1401;pointer-events:none;border-radius:2px;}
/* ===== cinematics: level-up + CoD rank-up (share #cele overlay) ===== */
.cele{background:radial-gradient(120% 90% at 50% 24%,rgba(22,17,44,.9),rgba(4,3,12,.96));backdrop-filter:blur(4px);}
.celecard{background:transparent;box-shadow:none;padding:0;max-width:min(92vw,420px);animation:none;overflow:visible;}
.cine{position:relative;text-align:center;color:#fff;padding:70px 8px 8px;}
.cine .ring{position:absolute;left:50%;top:96px;width:250px;height:250px;margin:-125px 0 0 -125px;border-radius:50%;filter:blur(1px);animation:cspin 3.6s linear infinite;}
.cine .burst{position:absolute;left:50%;top:96px;width:330px;height:330px;margin:-165px 0 0 -165px;border-radius:50%;animation:cpulse 1.8s ease-out infinite;}
.cine-badge{position:relative;width:150px;height:150px;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;animation:cbadge .7s cubic-bezier(.2,1.5,.4,1) both;}
.cine-badge .icon{font-size:74px;filter:drop-shadow(0 10px 26px rgba(0,0,0,.5));}
.cine .rksvg{width:132px;height:126px;filter:drop-shadow(0 8px 22px rgba(0,0,0,.6));}
.cine-eyebrow{letter-spacing:4px;font-size:12px;font-weight:900;color:var(--gold);text-transform:uppercase;opacity:0;animation:cfade .5s .25s forwards;}
.cine-title{font-size:34px;font-weight:900;line-height:1.04;margin:4px 0 2px;letter-spacing:1px;opacity:0;animation:crise .6s .34s cubic-bezier(.2,1,.3,1) forwards;background:linear-gradient(180deg,#fff,#ffe6a6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.cine-sub{font-size:15px;color:#dfe3ee;margin:2px 12px 10px;opacity:0;animation:cfade .5s .5s forwards;}
.cine-xp{display:inline-block;font-weight:900;color:#1a1206;background:linear-gradient(90deg,#ffe89a,#ffcf4a);padding:7px 16px;border-radius:999px;font-size:14px;margin:2px 0 4px;opacity:0;animation:cpop .5s .62s cubic-bezier(.2,1.5,.4,1) both;}
.cine-emblem{color:var(--gold);font-weight:800;font-size:13px;margin:8px 8px 0;opacity:0;animation:cfade .5s .74s forwards;}
.cine-ranks{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 8px 2px;opacity:0;animation:cfade .5s .8s forwards;}
.cine-ranks .rc{font-size:11.5px;font-weight:800;padding:6px 11px;border-radius:10px;background:rgba(255,255,255,.12);color:#cfd5e6;}
.cine-ranks .rc.to{background:linear-gradient(90deg,var(--gold),#ffcf4a);color:#1a1206;}
.cine-ranks .ar{opacity:.7;font-weight:900;}
.cine-btn{margin-top:18px;border:none;background:linear-gradient(90deg,#5b6cff,#8a5bff);color:#fff;font-weight:800;font-size:15px;padding:12px 26px;border-radius:12px;cursor:pointer;font-family:inherit;opacity:0;animation:cfade .5s .9s forwards;box-shadow:0 10px 24px rgba(91,108,255,.4);}
.cine-piece{position:absolute;left:50%;top:150px;width:46px;height:46px;margin-left:-23px;border-radius:50%;overflow:hidden;border:3px solid var(--gold);box-shadow:0 0 0 4px rgba(255,210,74,.35);animation:launch 1.05s .15s cubic-bezier(.4,0,.2,1) both;z-index:2;background:#5b6cff;}
.cine-piece img{width:100%;height:100%;object-fit:cover;}.cine-piece .ini{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:16px;}
@keyframes cspin{to{transform:rotate(360deg);}}
@keyframes cpulse{0%{transform:scale(.7);opacity:.55;}100%{transform:scale(1.18);opacity:0;}}
@keyframes cbadge{0%{transform:scale(.2) rotate(-22deg);opacity:0;}100%{transform:scale(1) rotate(0);opacity:1;}}
@keyframes cfade{to{opacity:1;}}
@keyframes crise{0%{opacity:0;transform:translateY(14px);}100%{opacity:1;transform:translateY(0);}}
@keyframes cpop{0%{opacity:0;transform:scale(.5);}100%{opacity:1;transform:scale(1);}}
@keyframes launch{0%{transform:translateY(130px) scale(.55);opacity:0;}28%{opacity:1;}100%{transform:translateY(-6px) scale(1);opacity:1;}}
/* HUD rank insignia badge */
.rankbtn{flex:0 0 auto;width:46px;height:46px;padding:3px;margin-right:2px;border:none;border-radius:12px;background:rgba(0,0,0,.22);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.rankbtn .rksvg{width:100%;height:100%;}
.rankbtn:hover{background:rgba(0,0,0,.35);}
.hbtn.on{background:linear-gradient(90deg,#34c759,#12924a);box-shadow:0 0 0 2px rgba(52,199,89,.35);}
/* collapse-gates (fog of war) */
.gband{position:absolute;left:50%;transform:translate(-50%,-50%);width:min(78%,340px);z-index:4;display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:16px;cursor:pointer;background:linear-gradient(180deg,rgba(20,22,40,.78),rgba(12,13,26,.86));border:1px dashed rgba(255,255,255,.28);backdrop-filter:blur(2px);box-shadow:0 8px 20px rgba(0,0,0,.35);color:#eaeef8;transition:transform .15s,border-color .15s;}
.gband:hover{transform:translate(-50%,-50%) scale(1.02);border-color:rgba(255,210,74,.55);}
.gband .gb-ic{font-size:18px;}
.gband .gb-tx{display:flex;flex-direction:column;min-width:0;line-height:1.2;text-align:left;}
.gband .gb-tx b{font-size:13.5px;}
.gband .gb-w{font-size:11px;opacity:.8;}
.gband .gb-race{margin-left:auto;font-size:11px;font-weight:800;color:#ffd24a;background:rgba(255,210,74,.14);padding:3px 8px;border-radius:9px;white-space:nowrap;}
.gband .gb-cta{font-size:11px;font-weight:800;opacity:.85;white-space:nowrap;}
.gband .gb-race+.gb-cta{margin-left:8px;}
.gband .gb-cta:only-of-type,.gband .gb-tx~.gb-cta:last-child{margin-left:auto;}
/* live team-race chips */
.grace{position:absolute;width:30px;height:30px;transform:translate(-50%,-50%);z-index:5;cursor:pointer;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.9);box-shadow:0 3px 8px rgba(0,0,0,.45);background:#2a3350;animation:racebob 3s ease-in-out infinite;}
.grace img{width:100%;height:100%;object-fit:cover;display:block;}
.grace .ini{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;}
.gracex{position:absolute;transform:translate(-50%,-50%);z-index:5;font-size:10px;font-weight:900;color:#fff;background:rgba(16,20,36,.9);border:1px solid rgba(255,255,255,.45);border-radius:10px;padding:2px 6px;}
@keyframes racebob{0%,100%{margin-top:0;}50%{margin-top:-4px;}}
.rksvg{display:block;}
/* ===== Black Ops rank-up ===== */
.bo{position:relative;text-align:center;color:#fff;padding:60px 12px 12px;width:min(94vw,440px);}
.bo-rays{position:absolute;left:50%;top:120px;width:440px;height:440px;margin:-220px 0 0 -220px;border-radius:50%;pointer-events:none;background:repeating-conic-gradient(from 0deg,rgba(255,210,74,.16) 0deg,rgba(255,210,74,.16) 4deg,transparent 4deg,transparent 22deg);opacity:0;animation:boRays 1.1s .5s forwards,cspin 20s linear infinite;}
.bo.epic .bo-rays{background:repeating-conic-gradient(from 0deg,rgba(255,223,106,.24) 0deg,rgba(255,223,106,.24) 4deg,transparent 4deg,transparent 18deg);}
.bo-bar{height:3px;width:0;margin:0 auto 10px;background:linear-gradient(90deg,transparent,#ffd24a,transparent);box-shadow:0 0 12px #ffd24a;animation:boBar .6s cubic-bezier(.3,.9,.3,1) forwards;}
.bo-eyebrow{position:relative;letter-spacing:5px;font-size:12px;font-weight:900;color:#ffd24a;text-transform:uppercase;opacity:0;animation:cfade .4s .18s forwards;}
.bo-badge{position:relative;width:150px;height:150px;margin:8px auto 2px;}
.bo-old,.bo-new{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.bo-old .rksvg,.bo-new .rksvg{width:140px;height:140px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.6));}
.bo-old{animation:boOldOut .5s .55s forwards;}
.bo-new{opacity:0;transform:scale(.4) rotate(-12deg);animation:boNewIn .6s .74s cubic-bezier(.2,1.55,.4,1) forwards;}
.bo-flash{position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle,#fff,transparent 60%);opacity:0;animation:boFlash .55s .72s ease-out;pointer-events:none;}
.bo-title{font-size:26px;font-weight:900;letter-spacing:.5px;line-height:1.06;margin:8px 10px 2px;opacity:0;animation:crise .5s 1.05s forwards;background:linear-gradient(180deg,#fff,#ffe6a6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.bo.epic .bo-title{font-size:29px;}
.bo-sub{font-size:13.5px;color:#dfe3ee;margin:5px 18px 10px;opacity:0;animation:cfade .5s 1.2s forwards;}
.bo-ranks{display:flex;align-items:center;justify-content:center;gap:12px;opacity:0;animation:cfade .5s 1.32s forwards;}
.bo-ranks .rc{font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:9px;background:rgba(255,255,255,.12);color:#cfd5e6;}
.bo-ranks .rc.to{background:linear-gradient(90deg,#ffd24a,#ffcf4a);color:#1a1206;}
.bo-ranks .ar{color:#ffd24a;font-weight:900;}
.bo-btn{margin-top:18px;border:none;background:linear-gradient(90deg,#c99a2e,#ffd24a);color:#1a1206;font-weight:900;font-size:15px;padding:12px 28px;border-radius:12px;cursor:pointer;font-family:inherit;opacity:0;animation:cfade .5s 1.45s forwards;box-shadow:0 10px 24px rgba(255,210,74,.35);}
@keyframes boBar{0%{width:0;}100%{width:78%;}}
@keyframes boOldOut{to{opacity:0;transform:scale(.7) rotate(8deg);}}
@keyframes boNewIn{0%{opacity:0;transform:scale(.4) rotate(-12deg);}60%{opacity:1;}100%{opacity:1;transform:scale(1) rotate(0);}}
@keyframes boFlash{0%{opacity:0;}28%{opacity:.9;}100%{opacity:0;}}
@keyframes boRays{to{opacity:.7;}}
/* rank ladder sheet */
.rkladder{margin-top:10px;max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:7px;}
.rkrow{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:13px;background:var(--card2,#f4f5f8);}
.rkrow .rkm{width:44px;height:44px;flex:0 0 auto;}
.rkrow .rkm .rksvg{width:100%;height:100%;}
.rkrow.lock{opacity:.5;}
.rkrow.cur{background:linear-gradient(90deg,rgba(255,210,74,.22),rgba(255,210,74,.06));box-shadow:inset 0 0 0 1.5px rgba(255,210,74,.6);}
.rkinfo{min-width:0;}.rkn{font-weight:800;font-size:14px;}.rks{font-size:11.5px;color:var(--ink2);margin-top:1px;}
/* skin picker */
.ckhd{font-size:12px;font-weight:800;color:var(--ink2);margin:14px 2px 2px;}
.skgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:6px;}
.skcell{display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 6px 8px;border-radius:13px;background:var(--card2,#f4f5f8);cursor:pointer;border:2px solid transparent;transition:.15s;}
.skcell.on{border-color:#ffd24a;background:rgba(255,210,74,.14);}
.skcell.lk{opacity:.62;}
.skshape{width:40px;height:40px;border-radius:50%;background:var(--fr,#ffd24a);display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 3px 8px rgba(0,0,0,.2);}
.sklab{font-size:12px;font-weight:800;}.skreq{font-size:10px;color:var(--ink3);min-height:12px;}
/* shaped game piece */
.gpiece.shaped{border:none!important;background:var(--fr,#ffd24a);padding:3px;box-shadow:0 8px 16px rgba(0,0,0,.4);filter:drop-shadow(0 0 5px var(--fr,#ffd24a));}
.gpiece.shaped .gpwrap{width:100%;height:100%;overflow:hidden;display:block;}
.gpiece.shaped .gpwrap img{width:100%;height:100%;object-fit:cover;}
.gpiece.shaped .gpwrap .gpini{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:1500;}.toast.show{opacity:1;}
.spin{text-align:center;color:var(--ink3);padding:50px;font-style:italic;}
/* ===== game-board motion ===== */
.node.pop{opacity:0;transform:translateY(16px) scale(.94);animation:nodein .5s cubic-bezier(.2,.85,.25,1) forwards;}
@keyframes nodein{to{opacity:1;transform:none;}}
.path .trail{position:absolute;left:50%;top:0;width:5px;transform:translateX(-50%);border-radius:99px;z-index:1;transition:height 1.1s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 14px rgba(255,210,74,.55);}
.dot.done{overflow:hidden;}
.dot.done::after{content:'';position:absolute;inset:0;border-radius:50%;background:linear-gradient(120deg,transparent 32%,rgba(255,255,255,.6) 50%,transparent 68%);background-size:220% 220%;animation:shine 3.6s ease-in-out infinite;}
.node.active .av3{animation:bob 2.4s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
.node.justarrived .av3{animation:land .75s cubic-bezier(.2,1.5,.35,1);}
@keyframes land{0%{transform:translateY(-52px) scale(.45);opacity:.3;}55%{transform:translateY(7px) scale(1.14);opacity:1;}100%{transform:none;}}
@keyframes shine{0%,100%{background-position:160% 160%;}50%{background-position:-60% -60%;}}
.node.reveal .dot{animation:reveal .6s ease;}
@keyframes reveal{0%{transform:scale(.4) rotate(-10deg);opacity:.4;}60%{transform:scale(1.12);opacity:1;}100%{transform:none;}}
.dot{position:relative;}
.wband{position:relative;overflow:hidden;}
.wband::after{content:'';position:absolute;right:-20px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);}
/* ===== VIDEO-GAME BOARD ===== */
.board{position:relative;margin:14px 0 0;width:100%;max-width:none;}
.gboard{position:relative;width:100%;}
.gstars{position:absolute;inset:0;z-index:0;pointer-events:none;transform:translateY(var(--par1,0));background-repeat:no-repeat;animation:twinkle 5s ease-in-out infinite;background-image:radial-gradient(1.5px 1.5px at 12% 16%,#fff,transparent),radial-gradient(1px 1px at 27% 40%,#fff,transparent),radial-gradient(1.6px 1.6px at 46% 12%,#fff,transparent),radial-gradient(1px 1px at 62% 30%,#cfe0ff,transparent),radial-gradient(1.5px 1.5px at 78% 18%,#fff,transparent),radial-gradient(1px 1px at 88% 44%,#fff,transparent),radial-gradient(1px 1px at 8% 58%,#fff,transparent),radial-gradient(1.6px 1.6px at 35% 68%,#fff,transparent),radial-gradient(1px 1px at 55% 60%,#cfe0ff,transparent),radial-gradient(1px 1px at 72% 72%,#fff,transparent),radial-gradient(1.5px 1.5px at 92% 64%,#fff,transparent),radial-gradient(1px 1px at 20% 86%,#fff,transparent),radial-gradient(1px 1px at 42% 90%,#fff,transparent),radial-gradient(1.4px 1.4px at 66% 88%,#fff,transparent);}
@keyframes twinkle{0%,100%{opacity:.55;}50%{opacity:.9;}}
.ghero{position:absolute;top:5%;left:0;right:0;display:flex;justify-content:center;z-index:0;pointer-events:none;transform:translateY(var(--par2,0));}
.ghero svg{width:min(74%,460px);height:auto;filter:drop-shadow(0 0 22px rgba(180,200,255,.2));}
.gterra{position:absolute;left:0;right:0;bottom:0;z-index:0;line-height:0;pointer-events:none;}
.gterra svg{width:100%;height:72px;display:block;}
.gglow{position:absolute;inset:0;z-index:0;pointer-events:none;}
.hudctrl{position:absolute;top:12px;right:14px;display:flex;gap:7px;z-index:4;}
.hbtn{width:36px;height:36px;border-radius:11px;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.hbtn:hover{background:rgba(255,255,255,.3);}
.gregion{position:absolute;left:-8px;right:-8px;border-radius:30px;z-index:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);overflow:hidden;}
.gflag{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:7px;color:#fff;font-weight:900;font-size:13px;padding:7px 15px;border-radius:99px;box-shadow:0 6px 16px rgba(0,0,0,.22);white-space:nowrap;z-index:2;}
.gflag span{font-size:16px;}
.gscene{position:absolute;left:0;right:0;bottom:0;height:64px;opacity:.16;background:radial-gradient(60px 30px at 18% 100%,currentColor 60%,transparent),radial-gradient(90px 44px at 58% 100%,currentColor 55%,transparent),radial-gradient(54px 28px at 88% 100%,currentColor 60%,transparent);}
svg.gpath{position:absolute;inset:0;z-index:1;pointer-events:none;}
.gnode{position:absolute;width:66px;height:66px;transform:translate(-50%,-50%);z-index:3;cursor:pointer;}
.gnode.pop{opacity:0;animation:gpop .5s cubic-bezier(.2,.85,.25,1) forwards;}
@keyframes gpop{from{opacity:0;transform:translate(-50%,-50%) scale(.4);}to{opacity:1;transform:translate(-50%,-50%) scale(1);}}
.gtwrap{position:relative;width:66px;height:66px;}
.gtile{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.14),0 10px 20px rgba(0,0,0,.22);border:4px solid #fff;}
.gtile.done{background:radial-gradient(circle at 38% 32%,#ffefb0,#e0b84a 62%,#b07d12);color:#5c4300;text-shadow:0 1px 0 rgba(255,255,255,.5);}
.gtile.locked{background:radial-gradient(circle at 38% 32%,#e9e9ee,#b9b9c2 72%,#9a9aa4);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.1),0 8px 14px rgba(0,0,0,.16);}
.gtile.active{background:radial-gradient(circle at 38% 32%,#fff,var(--wc,#5b6cff) 135%);overflow:visible;box-shadow:0 0 0 6px rgba(255,210,74,.4),0 10px 22px rgba(0,0,0,.3);}
.gnum{position:absolute;bottom:-3px;right:-3px;width:24px;height:24px;border-radius:50%;background:#1d1d1f;color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #fff;z-index:4;}
.gtile.done::after{content:'';position:absolute;inset:0;border-radius:50%;background:linear-gradient(120deg,transparent 34%,rgba(255,255,255,.7) 50%,transparent 66%);background-size:230% 230%;animation:gshine 3.4s ease-in-out infinite;}
@keyframes gshine{0%,100%{background-position:175% 175%;}50%{background-position:-75% -75%;}}
.gpiece{position:absolute;inset:-6px;border-radius:50%;overflow:hidden;border:4px solid #ffd24a;box-shadow:0 0 0 4px rgba(255,210,74,.4),0 10px 20px rgba(0,0,0,.32);background:#5b6cff;z-index:6;}
.gpiece img{width:100%;height:100%;object-fit:cover;}
.gpiece .gpini{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:20px;}
.gnode.active{z-index:7;}
.gnode.active .gpiece{animation:gbob 2.4s ease-in-out infinite;}
@keyframes gbob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.gnode.just .gpiece{animation:gland .8s cubic-bezier(.2,1.5,.35,1);}
@keyframes gland{0%{transform:translateY(-72px) scale(.4);opacity:.2;}55%{transform:translateY(9px) scale(1.15);opacity:1;}100%{transform:none;}}
.glabel{position:absolute;top:50%;transform:translateY(-50%);width:138px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 11px;box-shadow:0 4px 12px rgba(0,0,0,.08);}
.gnode.l .glabel{left:80px;text-align:left;}
.gnode.r .glabel{right:80px;text-align:right;}
.gnode.locked .glabel{opacity:.7;}
.gln{font-weight:800;font-size:12.5px;line-height:1.15;color:var(--ink);}
.glm{font-size:10.5px;color:var(--ink3);font-weight:700;margin-top:2px;}
.gnode.active .glabel{border-color:#ffd24a;box-shadow:0 6px 16px rgba(255,210,74,.3);}
.gnode.active .gln::after{content:' • HERE';color:var(--accent);font-size:9px;font-weight:900;}
.gfinish{position:absolute;transform:translate(-50%,-50%);z-index:3;text-align:center;font-size:42px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25));}
.gfl{font-size:11px;font-weight:900;color:var(--gold);margin-top:-6px;letter-spacing:.03em;}
/* ---- Candy-Crush spots ---- */
.ccn{width:62px;height:62px;}
.cc-tile{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:27px;border:4px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.16),0 9px 18px rgba(0,0,0,.26);background:radial-gradient(circle at 38% 30%,#fff,var(--wc,#5b6cff) 145%);transition:transform .14s;}
.ccn:hover .cc-tile{transform:scale(1.07);}
.cc-ic{line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));}
.ccn.done .cc-tile{background:radial-gradient(circle at 38% 32%,#ffefb0,#e0b84a 62%,#b07d12);}
.ccn.done .cc-ic{font-size:22px;opacity:.9;}
.cc-check{position:absolute;top:-5px;left:-5px;width:22px;height:22px;border-radius:50%;background:#1a9c52;color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.3);}
.ccn.locked .cc-tile{filter:grayscale(.85) brightness(.96);opacity:.68;box-shadow:0 4px 0 rgba(0,0,0,.1),0 7px 12px rgba(0,0,0,.16);}
.ccn.active .cc-tile{background:radial-gradient(circle at 38% 30%,#fff,var(--wc,#5b6cff) 150%);box-shadow:0 0 0 5px rgba(255,210,74,.45),0 9px 22px rgba(0,0,0,.3);overflow:visible;}
.ccn.active .cc-tile .gpiece{width:52px;height:52px;}
.cc-num{position:absolute;bottom:-4px;right:-4px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#1d1d1f;color:#fff;font-size:10.5px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #fff;z-index:4;}
.cc-badge{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--bc,#8b93a7);color:#fff;font-size:10.5px;font-weight:900;padding:2px 8px;border-radius:11px;border:2px solid #fff;white-space:nowrap;box-shadow:0 3px 7px rgba(0,0,0,.32);z-index:6;}
/* ---- occupancy panel in the spot sheet ---- */
.occ-sec{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;}
.occ-h{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:4px;}
.occ-note{font-size:12px;color:var(--ink3);}
.occ-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--ink3);margin:6px 0 10px;}
.occ-legend span{display:inline-flex;align-items:center;gap:4px;}
.occ-legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}
.occ-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);}
.occ-row:last-child{border-bottom:none;}
.occ-av{width:34px;height:34px;border-radius:50%;overflow:hidden;flex:0 0 auto;background:#2a3350;position:relative;}
.occ-av img{width:100%;height:100%;object-fit:cover;display:block;}
.occ-av .ini{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;}
.occ-nm{flex:1;min-width:0;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.occ-pct{display:block;font-size:10.5px;color:var(--ink3);font-weight:600;}
.occ-chip{font-size:10.5px;font-weight:900;color:#fff;background:var(--cc,#8b93a7);padding:3px 9px;border-radius:99px;white-space:nowrap;}
.ci.lk{opacity:.6;cursor:default;}
@media(max-width:560px){.glabel{width:100px;padding:6px 8px;}.gnode.l .glabel{left:70px;}.gnode.r .glabel{right:70px;}}
/* ===== living board — ambient motion ===== */
.ghero{animation:ghfloat 7s ease-in-out infinite;}
@keyframes ghfloat{0%,100%{transform:translateY(var(--par2,0));}50%{transform:translateY(calc(var(--par2,0) - 7px));}}
.sv-crawl{animation:svcrawl 7s linear infinite;}
@keyframes svcrawl{to{stroke-dashoffset:-64;}}
.sv-pulse{transform-box:fill-box;transform-origin:center;animation:svpulse 3.6s ease-in-out infinite;}
@keyframes svpulse{0%,100%{opacity:.45;transform:scale(.96);}50%{opacity:.95;transform:scale(1.1);}}
.sv-rot{transform-box:fill-box;transform-origin:center;animation:svrot 28s linear infinite;}
@keyframes svrot{to{transform:rotate(360deg);}}
.gp-flow{animation:gpflow 2.4s linear infinite;}
@keyframes gpflow{to{stroke-dashoffset:-33;}}
.gnode.active .gtwrap::before{content:'';position:absolute;inset:-15px;border-radius:50%;border:2px dashed rgba(255,210,74,.6);animation:orbit 9s linear infinite;pointer-events:none;}
@keyframes orbit{to{transform:rotate(360deg);}}
.greward{position:absolute;top:-32px;left:50%;transform:translateX(-50%);font-size:20px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45));animation:rbob 2.6s ease-in-out infinite;z-index:6;pointer-events:none;}
@keyframes rbob{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(-6px);}}
.gnebula{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.45;mix-blend-mode:screen;transform:translateY(var(--par3,0));animation:nebdrift 26s ease-in-out infinite;}
@keyframes nebdrift{0%,100%{transform:translate(0,var(--par3,0)) scale(1);}50%{transform:translate(3%,var(--par3,0)) scale(1.12);}}
.gcomets{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.gcomet{position:absolute;top:0;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 7px 2px rgba(200,220,255,.8);opacity:0;}
.gcomet::after{content:'';position:absolute;right:2px;top:1px;width:70px;height:1.5px;background:linear-gradient(90deg,rgba(255,255,255,.8),transparent);transform:rotate(24deg);transform-origin:right center;}
.gcomet.c1{left:8%;animation:comet1 13s ease-in infinite;}
.gcomet.c2{left:62%;animation:comet2 19s ease-in infinite 6s;}
@keyframes comet1{0%{transform:translate(0,-30px) rotate(24deg);opacity:0;}5%{opacity:.9;}22%{transform:translate(46vw,420px) rotate(24deg);opacity:0;}100%{opacity:0;}}
@keyframes comet2{0%{transform:translate(0,120px) rotate(24deg);opacity:0;}5%{opacity:.9;}20%{transform:translate(-40vw,640px) rotate(24deg);opacity:0;}100%{opacity:0;}}
@media(prefers-reduced-motion:reduce){.node.active .dot,.node.active .av3,.node.justarrived .av3,.node.reveal .dot,.dot.done::after,.gtile.done::after,.gnode.active .gpiece,.gnode.just .gpiece,.gstars,.ghero,.sv-crawl,.sv-pulse,.sv-rot,.gp-flow,.gnode.active .gtwrap::before,.greward,.gnebula,.gcomet,.grace,.cine .ring,.cine .burst,.cine-badge,.cine-piece{animation:none!important;}.cine-eyebrow,.cine-title,.cine-sub,.cine-xp,.cine-emblem,.cine-ranks,.cine-btn{opacity:1!important;animation:none!important;}.bo-rays,.bo-bar,.bo-flash{display:none!important;}.bo-old{display:none!important;}.bo-new{opacity:1!important;transform:none!important;animation:none!important;}.bo-eyebrow,.bo-title,.bo-sub,.bo-ranks,.bo-btn{opacity:1!important;animation:none!important;}.node.pop,.gnode.pop{opacity:1;transform:translate(-50%,-50%);animation:none;}.xpbar>span,.path .trail{transition:none;}.celecard{animation:none;}.confetti,.gcomets{display:none!important;}}
</style>

function startAmbient(){var c=actx();if(!c||AMB||MUTED)return;

    var st='left:'+p.x+'%;top:'+p.y+'px;'+(FIRST?'animation-delay:'+((animN++)*0.03).toFixed(2)+'s':'');
    body+='<div class="gnode ccn '+l.status+(FIRST?' pop':'')+(l.id===JUSTID?' just':'')+'" style="'+st+'" onclick="openLevel(\''+l.id+'\')">'
      +'<div class="cc-tile" style="--wc:'+w2.color+'">'+inner+'</div>'
      +'<span class="cc-num">'+(i3+1)+'</span>'+occBadge(l.id)+'</div>';
  }
  var finish='<div class="gfinish" style="left:'+pos[N-1].x+'%;top:'+Math.max(26,pos[N-1].y-80)+'px">🏆<div class="gfl">The Standard</div></div>';
  return '<div class="gboard" style="height:'+H+'px">'+regHtml+svg+finish+body+'</div>';
}

function toggleBand(key){if(EXP[key])delete EXP[key];else EXP[key]=true;sfx('unlock');var y=window.scrollY||window.pageYOffset||0;render(true);window.scrollTo(0,y);}
function racerTap(el){try{toast('🏁 '+el.getAttribute('data-nm')+' · lvl '+el.getAttribute('data-lv')+' · '+(+el.getAttribute('data-xp')).toLocaleString()+' 🪙');}catch(e){}}
function nearCard(s,cls,tlabel){
  var lead=cls==='ahead'?('+'+(s.level_index-PLAYER.level_index)+' lvl'):(cls==='behind'?('-'+(PLAYER.level_index-s.level_index)+' lvl'):('Lvl '+s.level_index));
  return '<div class="ncard '+cls+'"><div class="t">'+tlabel+'</div><div class="p">'+avImg(s.has_photo?s.code:'',s.name,'nav2')+'<div style="min-width:0"><div class="nn">'+esc((s.name||'').split(' ')[0])+'</div><div class="nl">'+lead+' · '+s.xp+' XP</div></div></div></div>';
}

function occPanel(lid){
  var o=occFor(lid);
  if(!OCC.eligible){ if(!o.cnt)return ''; return '<div class="occ-sec"><div class="occ-h">👥 '+o.cnt+' broker'+(o.cnt===1?'':'s')+' on this spot</div><div class="occ-note">Senior brokers can see who’s here.</div></div>'; }
  if(!o.roster||!o.roster.length)return '<div class="occ-sec"><div class="occ-h">Who’s on this spot</div><div class="occ-note">Nobody parked here right now.</div></div>';
  var rows=o.roster.map(function(r){var col=stuckColor(r.days);return '<div class="occ-row">'+avImg(r.has_photo?r.code:'',r.name,'occ-av')+'<div class="occ-nm">'+esc(r.name)+'<span class="occ-pct">'+r.pct+'% path</span></div><span class="occ-chip" style="--cc:'+col+'">'+(r.days===0?'just arrived':(r.days+'d here'))+'</span></div>';}).join('');
  return '<div class="occ-sec"><div class="occ-h">Who’s on this spot · '+o.roster.length+'</div><div class="occ-legend"><span><i style="background:#22c55e"></i>&lt;7d</span><span><i style="background:#eab308"></i>7–13</span><span><i style="background:#f97316"></i>14–29</span><span><i style="background:#ef4444"></i>30d+</span></div>'+rows+'</div>';
}
function openLevel(id){
  var l=PLAYER.levels.filter(function(x){return x.id===id;})[0];if(!l)return;
  OPENLVL=l;var w=worldById(l.world);var locked=(l.status==='locked');
  var reward=l.reward_emblem?('<div class="reward">🏅 Completing this unlocks the <b>'+esc(l.reward_emblem.replace(/_/g,' '))+'</b> emblem</div>'):'';
  var chl=(l.challenges||[]).map(function(cid){
    var claimed=!!PROGRESS[cid];var key=KEYS.has(cid);var verified=!!(PLAYER.verify&&PLAYER.verify[cid]);
    var pending=key&&claimed&&!verified;
    var tap=locked?'':' onclick="toggleChallenge(\''+cid+'\')"';
    var box=pending?'⏳':(claimed?'✓':(locked?'🔒':''));
    var tag=verified?'<span class="cv-tag ok">Ops-verified ✓</span>':(pending?'<span class="cv-tag pend">Pending Ops</span>':(key?'<span class="cv-tag key">Needs Ops sign-off</span>':''));
    return '<div class="ci'+(claimed&&!pending?' done':'')+(pending?' pend':'')+(locked?' lk':'')+'"'+tap+'><div class="ck">'+box+'</div><div class="cn">'+esc(LABELS[cid]||cid)+tag+'</div><div class="cx">+25 XP</div></div>';
  }).join('');
  var cta='';var _cta=l.cta||CTAMAP[l.id];
  if(_cta&&_cta.url){var u=_cta.url;if(/calendly\.com/.test(u)){var nm=(PLAYER&&PLAYER.name)||'';if(nm)u+=(u.indexOf('?')>=0?'&':'?')+'name='+encodeURIComponent(nm);}cta='<a class="lvl-cta" href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(_cta.label||'Open')+'</a>';}
  $('sheet').innerHTML='<div class="sh-h"><div class="sh-ic" style="background:'+w.color+'">'+(l.status==='done'?'✓':(locked?'🔒':levelIcon(l)))+'</div>'
    +'<div style="min-width:0"><h3>'+esc(l.name)+'</h3><div class="d">'+esc(w.icon+' '+w.name)+(l.difficulty==='hard'?' · ⚡ Hard':'')+'</div></div><button class="sh-x" onclick="closeSheet()">✕</button></div>'
    +(l.desc?'<div class="lvl-guide"><div class="lvl-guide-h">📋 How to complete this step</div>'+esc(l.desc)+'</div>':'')+cta+reward
    +'<div class="chl">'+chl+'</div>'
    +(locked?'<div style="font-size:11.5px;color:var(--ink3);text-align:center;margin-top:14px">🔒 Unlocks once you finish the earlier spots.</div>':'<div style="font-size:11.5px;color:var(--ink3);text-align:center;margin-top:14px">Checking a challenge saves to your tracker instantly.</div>')
    +occPanel(l.id);
  $('ov').classList.add('on');
}
function closeSheet(){$('ov').classList.remove('on');OPENLVL=null;}

var SAVING=false;
function toggleChallenge(id){
  if(SAVING)return;
  var wasDone=!!PROGRESS[id];
  if(wasDone)delete PROGRESS[id];else PROGRESS[id]=1;
  var lvlBefore=PLAYER.level_index;
  SAVING=true;
  // echo preserved fields so nothing else is blanked
  var body={action:'save',code:CODE,progress:PROGRESS,total:AGENT.total||0,pathway:AGENT.pathway||PLAYER.pathway||'',
    emd:AGENT.emd,md:AGENT.md,ft_log:AGENT.ft_log,carrier_codes:AGENT.carrier_codes,warm_market:AGENT.warm_market,activity_log:AGENT.activity_log,promo:AGENT.promo};
  fetch(TRACKER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(){
    // re-derive from the engine
    return fetch(ROADMAP,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'player',code:CODE})}).then(function(r){return r.json();});
  }).then(function(pd){
    SAVING=false;
    if(pd&&pd.ok){var justCompleted=null;var openId=OPENLVL&&OPENLVL.id;
      // detect a level that flipped to done + whether we crossed into a new world
      var before={};PLAYER.levels.forEach(function(l){before[l.id]=l.status;});
      var worldBefore=PLAYER.current_world;
      PLAYER=pd.player;LABELS=pd.labels||LABELS;WORLDS=pd.worlds||WORLDS;
      PLAYER.levels.forEach(function(l){if(l.status==='done'&&before[l.id]&&before[l.id]!=='done')justCompleted=l;});
      if(justCompleted)JUSTID=PLAYER.current_level; /* avatar lands on its new tile */
      render();
      if(openId){var still=PLAYER.levels.filter(function(x){return x.id===openId;})[0];if(still&&still.status!=='locked')openLevel(openId);else closeSheet();}
      if(justCompleted){var newWorld=(PLAYER.current_world&&PLAYER.current_world!==worldBefore)?worldById(PLAYER.current_world):null;closeSheet();celebrate(justCompleted,newWorld);}
      else if(!wasDone){if(KEYS.has(id)){toast('Marked done — sent to Operations to verify ✓');sfx('check');}else{toast('+25 XP');sfx('check');}}
      // refresh nearby quietly
      fetch(ROADMAP,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'nearby',code:CODE})}).then(function(r){return r.json();}).then(function(n){if(n&&n.ok){NEARBY=n;}});
    }
  }).catch(function(){SAVING=false;toast('Save failed — check connection');});
}

function celebrate(l,newWorld){
  var w=worldById(l.world);var xp=((l.total*25)+100);
  var worldClear=!!newWorld;
  var icon=worldClear?newWorld.icon:(l.reward_emblem?'🏅':'⭐');
  var title=worldClear?'WORLD CLEARED':'LEVEL UP';
  var sub=worldClear?('Entering '+esc(newWorld.icon+' '+newWorld.name)):('You completed “'+esc(l.name)+'”');
  var accent=worldClear?newWorld.color:'#ffd24a';
  $('celecard').innerHTML='<div class="cine"><div class="burst" style="background:radial-gradient(circle,'+accent+'55,transparent 62%)"></div><div class="ring" style="background:conic-gradient(from 0deg,transparent,'+accent+'99,transparent 40%)"></div>'
    +'<div class="cine-piece">'+(PLAYER.has_photo?('<img src="'+AVATAR+'?code='+encodeURIComponent(PLAYER.code)+'" alt="" onerror="this.remove()">'):('<span class="ini">'+esc(initials(PLAYER.name))+'</span>'))+'</div>'
    +'<div class="cine-badge"><span class="icon">'+icon+'</span></div>'
    +'<div class="cine-eyebrow">'+(worldClear?'New World Unlocked':'Milestone reached')+'</div>'
    +'<div class="cine-title">'+title+'</div>'
    +'<div class="cine-sub">'+sub+'</div>'
    +'<div class="cine-xp">+'+xp+' XP earned</div>'
    +(l.reward_emblem?'<div class="cine-emblem">🏅 '+esc(l.reward_emblem.replace(/_/g,' '))+' emblem unlocked!</div>':'')
    +'<button class="cine-btn" onclick="closeCele()">'+(worldClear?'Onward →':'Keep climbing →')+'</button></div>';
  $('cele').classList.add('on');fireConfetti();if(worldClear)setTimeout(function(){sfx('unlock');},380);
}
function closeCele(){$('cele').classList.remove('on');}
function fireConfetti(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var cols=['#ffd24a','#5b6cff','#34c759','#ff2d55','#af52de','#ff9f0a'];
  for(var i=0;i<80;i++){(function(){
    var c=document.createElement('div');c.className='confetti';
    c.style.left=(Math.random()*100)+'vw';c.style.background=cols[i%cols.length];
    var dur=2.4+Math.random()*1.6;c.style.transition='transform '+dur+'s linear, opacity '+dur+'s linear';
    document.body.appendChild(c);
    requestAnimationFrame(function(){c.style.transform='translateY('+(window.innerHeight+40)+'px) rotate('+(Math.random()*720-360)+'deg)';c.style.opacity='0';});
    setTimeout(function(){c.remove();},dur*1000+100);
  })();}
}
function tsfgToggle(){if(window.innerWidth<=860)tsfgDrawer(!document.body.classList.contains('tsfg-drawer'));}
function tsfgDrawer(on){document.body.classList.toggle('tsfg-drawer',!!on);}
function tsfgSignOut(){try{localStorage.removeItem('tsfg_code');localStorage.removeItem('tsfg_name');}catch(e){}location.href='index.html';}
load();
</script>
<script defer src="notif.js"></script>
</body>
