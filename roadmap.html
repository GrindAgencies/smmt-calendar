<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Journey — The Standard</title>
<link rel="icon" href="logo.png">
<style>
*{box-sizing:border-box}
:root{--bg:#f5f5f7;--panel:#fff;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#8e8e93;--line:#ececf0;--line2:#e3e3e8;--accent:#5b6cff;--gold:#c99a2e;--green:#1a9c52;--tsfg-accent:#5b6cff;--tsfg-side:248px;}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none}
body{padding-left:var(--tsfg-side);padding-top:60px;}
/* shell */
.tsfg-scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:880;}body.tsfg-drawer .tsfg-scrim{display:block;}
.tsfg-side{position:fixed;left:0;top:0;height:100vh;width:var(--tsfg-side);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px;padding:16px 12px;z-index:900;overflow-y:auto;transition:transform .24s;}
.tsfg-brand{display:flex;align-items:center;gap:11px;padding:6px 8px 14px;color:var(--ink);}
.tsfg-brand img{width:34px;height:34px;border-radius:10px;object-fit:cover;}
.tsfg-brand .bn{font-weight:800;font-size:16px;}.tsfg-brand .bn b{color:var(--accent);}
.side-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink2);font-weight:600;font-size:14px;transition:.15s;white-space:nowrap;}
.side-link svg{width:20px;height:20px;flex:0 0 auto;}
.side-link:hover{background:var(--bg);color:var(--ink);}.side-link.on{background:rgba(91,108,255,.10);color:var(--accent);}
.tsfg-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);}
.tsfg-top{position:fixed;top:0;left:var(--tsfg-side);right:0;height:60px;z-index:850;display:flex;align-items:center;gap:14px;padding:0 22px;background:rgba(245,245,247,.85);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);}
.tsfg-title{font-weight:800;font-size:17px;}
.tsfg-ic{width:38px;height:38px;border-radius:11px;border:1px solid var(--line2);background:#fff;color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer;}.tsfg-ic svg{width:18px;height:18px;}
@media(max-width:860px){body{padding-left:0;}.tsfg-side{transform:translateX(-100%);box-shadow:0 20px 60px rgba(0,0,0,.25);}body.tsfg-drawer .tsfg-side{transform:none;}.tsfg-top{left:0;}}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 90px;}
/* HUD */
.hud{position:relative;overflow:hidden;border-radius:22px;padding:20px;color:#fff;background:linear-gradient(135deg,#3a2f6b,#5b6cff 55%,#7c8bff);box-shadow:0 14px 40px rgba(91,108,255,.28);}
.hud .row{display:flex;align-items:center;gap:15px;}
.hud .av{position:relative;width:64px;height:64px;border-radius:50%;flex:0 0 auto;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35);}
.hud .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.hud .nm{font-size:20px;font-weight:900;letter-spacing:-.02em;line-height:1.1;}
.hud .sub{font-size:12.5px;opacity:.9;margin-top:3px;font-weight:600;}
.hud .streak{margin-left:auto;text-align:center;background:rgba(255,255,255,.15);border-radius:14px;padding:8px 12px;flex:0 0 auto;}
.hud .streak .f{font-size:22px;line-height:1;}.hud .streak .n{font-size:13px;font-weight:900;margin-top:2px;}.hud .streak .l{font-size:9px;opacity:.85;text-transform:uppercase;letter-spacing:.05em;}
.xpwrap{margin-top:16px;}
.xprow{display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:6px;}
.xpbar{height:12px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;}
.xpbar>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffe08a,#ffd24a);transition:width .8s cubic-bezier(.2,.8,.2,1);}
.chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.chip{background:rgba(255,255,255,.16);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700;}
/* nearby */
.near{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none;}.near::-webkit-scrollbar{display:none;}
.ncard{flex:0 0 auto;min-width:130px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px 12px;}
.ncard .t{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
.ncard.ahead .t{color:#e0533d;}.ncard.same .t{color:var(--accent);}.ncard.behind .t{color:var(--green);}
.ncard .p{display:flex;align-items:center;gap:8px;}
.nav2{position:relative;width:30px;height:30px;border-radius:50%;background:#eef0f4;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;overflow:hidden;flex:0 0 auto;}
.nav2 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.ncard .nn{font-size:12.5px;font-weight:700;line-height:1.1;}.ncard .nl{font-size:10.5px;color:var(--ink3);}
.sechead{font-size:12px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;margin:24px 4px 6px;}
/* PATH */
.world{margin-top:22px;}
.wband{display:flex;align-items:center;gap:11px;border-radius:16px;padding:12px 16px;color:#fff;font-weight:900;letter-spacing:-.01em;box-shadow:0 8px 22px rgba(0,0,0,.12);}
.wband .wi{font-size:22px;}.wband .wt{font-size:16px;}.wband .wc{margin-left:auto;font-size:11px;font-weight:800;opacity:.9;background:rgba(255,255,255,.2);padding:4px 9px;border-radius:99px;}
.path{position:relative;padding:8px 0 4px;}
.path::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:4px;transform:translateX(-50%);background:repeating-linear-gradient(180deg,var(--line2) 0 10px,transparent 10px 20px);}
.node{position:relative;display:flex;align-items:center;gap:14px;padding:14px 0;width:calc(50% + 34px);}
.node.r{margin-left:auto;flex-direction:row-reverse;text-align:right;}
.dot{position:relative;z-index:2;width:60px;height:60px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#fff;border:4px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.18);cursor:pointer;transition:transform .12s;}
.dot:active{transform:scale(.94);}
.node.locked .dot{background:#c9c9d0;cursor:default;box-shadow:none;}
.node.locked .lbl{opacity:.6;}
.dot.done{background:linear-gradient(180deg,#3ec98a,#1a9c52);}
.dot .av3{position:absolute;inset:-4px;border-radius:50%;overflow:hidden;border:4px solid #ffd24a;box-shadow:0 0 0 4px rgba(255,210,74,.4),0 6px 18px rgba(0,0,0,.25);}
.dot .av3 img{width:100%;height:100%;object-fit:cover;}.dot .av3 .ini{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#5b6cff;}
.node.active .dot{animation:pulse 1.8s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,210,74,.5),0 6px 16px rgba(0,0,0,.18);}50%{box-shadow:0 0 0 10px rgba(255,210,74,0),0 6px 16px rgba(0,0,0,.18);}}
.lbl{min-width:0;}
.lbl .ln{font-weight:800;font-size:14.5px;line-height:1.15;}
.lbl .lm{font-size:11.5px;color:var(--ink3);margin-top:3px;font-weight:600;}
.lbl .lx{font-size:10.5px;font-weight:800;color:var(--gold);margin-top:3px;}
.node.active .lbl .ln::after{content:' • YOU ARE HERE';color:var(--accent);font-size:9.5px;font-weight:900;letter-spacing:.05em;}
/* drawer */
.ov{position:fixed;inset:0;z-index:1200;background:rgba(10,8,20,.55);display:none;align-items:flex-end;justify-content:center;}
.ov.on{display:flex;}
.sheet{width:100%;max-width:560px;background:#fff;border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;padding:20px;box-shadow:0 -20px 60px rgba(0,0,0,.3);}
@media(min-width:640px){.ov{align-items:center;}.sheet{border-radius:22px;}}
.sh-h{display:flex;align-items:flex-start;gap:12px;}
.sh-ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;flex:0 0 auto;}
.sh-h h3{margin:0;font-size:19px;font-weight:900;letter-spacing:-.02em;}
.sh-h .d{font-size:13px;color:var(--ink2);margin-top:3px;}
.sh-x{margin-left:auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:#f2f2f5;font-size:16px;font-weight:800;color:var(--ink2);cursor:pointer;flex:0 0 auto;}
.reward{margin-top:14px;background:var(--gold-soft,rgba(201,154,46,.12));border:1px solid #e6cf8a;border-radius:12px;padding:10px 13px;font-size:12.5px;font-weight:700;color:#8a6d1f;}
.chl{margin-top:14px;}
.chl .ci{display:flex;align-items:center;gap:12px;padding:13px 12px;border:1px solid var(--line);border-radius:13px;margin-top:8px;cursor:pointer;transition:.12s;}
.chl .ci:hover{border-color:var(--accent);}
.chl .ci.done{background:rgba(26,156,82,.07);border-color:#9fdcbb;}
.ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--line2);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;font-weight:900;}
.ci.done .ck{background:var(--green);border-color:var(--green);}
.ci .cn{font-size:14px;font-weight:600;}.ci.done .cn{color:var(--ink2);}
.ci .cx{margin-left:auto;font-size:11px;font-weight:800;color:var(--gold);}
.locknote{margin-top:14px;text-align:center;color:var(--ink3);font-size:13px;font-weight:600;padding:12px;background:#f2f2f5;border-radius:12px;}
/* celebration */
.cele{position:fixed;inset:0;z-index:1400;display:none;align-items:center;justify-content:center;background:rgba(10,8,20,.6);}
.cele.on{display:flex;}
.celecard{background:#fff;border-radius:22px;padding:30px 26px;text-align:center;max-width:340px;animation:pop .4s cubic-bezier(.2,1.3,.5,1);}
@keyframes pop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
.celecard .big{font-size:52px;}.celecard h2{margin:8px 0 4px;font-size:22px;font-weight:900;}.celecard p{color:var(--ink2);font-size:14px;margin:0 0 16px;}
.celecard .xpgain{font-size:15px;font-weight:900;color:var(--gold);margin-bottom:16px;}
.celecard button{border:none;background:var(--accent);color:#fff;font-weight:800;font-size:15px;padding:12px 22px;border-radius:12px;cursor:pointer;font-family:inherit;}
.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:1401;pointer-events:none;border-radius:2px;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:1500;}.toast.show{opacity:1;}
.spin{text-align:center;color:var(--ink3);padding:50px;font-style:italic;}
/* ===== game-board motion ===== */
.node.pop{opacity:0;transform:translateY(16px) scale(.94);animation:nodein .5s cubic-bezier(.2,.85,.25,1) forwards;}
@keyframes nodein{to{opacity:1;transform:none;}}
.path .trail{position:absolute;left:50%;top:0;width:5px;transform:translateX(-50%);border-radius:99px;z-index:1;transition:height 1.1s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 14px rgba(255,210,74,.55);}
.dot.done{overflow:hidden;}
.dot.done::after{content:'';position:absolute;inset:0;border-radius:50%;background:linear-gradient(120deg,transparent 32%,rgba(255,255,255,.6) 50%,transparent 68%);background-size:220% 220%;animation:shine 3.6s ease-in-out infinite;}
.node.active .av3{animation:bob 2.4s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
.node.justarrived .av3{animation:land .75s cubic-bezier(.2,1.5,.35,1);}
@keyframes land{0%{transform:translateY(-52px) scale(.45);opacity:.3;}55%{transform:translateY(7px) scale(1.14);opacity:1;}100%{transform:none;}}
@keyframes shine{0%,100%{background-position:160% 160%;}50%{background-position:-60% -60%;}}
.node.reveal .dot{animation:reveal .6s ease;}
@keyframes reveal{0%{transform:scale(.4) rotate(-10deg);opacity:.4;}60%{transform:scale(1.12);opacity:1;}100%{transform:none;}}
.dot{position:relative;}
.wband{position:relative;overflow:hidden;}
.wband::after{content:'';position:absolute;right:-20px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);}
/* ===== VIDEO-GAME BOARD ===== */
.board{position:relative;margin:10px auto 0;max-width:620px;}
.gboard{position:relative;width:100%;}
.gregion{position:absolute;left:-8px;right:-8px;border-radius:30px;z-index:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);overflow:hidden;}
.gflag{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:7px;color:#fff;font-weight:900;font-size:13px;padding:7px 15px;border-radius:99px;box-shadow:0 6px 16px rgba(0,0,0,.22);white-space:nowrap;z-index:2;}
.gflag span{font-size:16px;}
.gscene{position:absolute;left:0;right:0;bottom:0;height:64px;opacity:.16;background:radial-gradient(60px 30px at 18% 100%,currentColor 60%,transparent),radial-gradient(90px 44px at 58% 100%,currentColor 55%,transparent),radial-gradient(54px 28px at 88% 100%,currentColor 60%,transparent);}
svg.gpath{position:absolute;inset:0;z-index:1;pointer-events:none;}
.gnode{position:absolute;width:66px;height:66px;transform:translate(-50%,-50%);z-index:3;cursor:pointer;}
.gnode.pop{opacity:0;animation:gpop .5s cubic-bezier(.2,.85,.25,1) forwards;}
@keyframes gpop{from{opacity:0;transform:translate(-50%,-50%) scale(.4);}to{opacity:1;transform:translate(-50%,-50%) scale(1);}}
.gtwrap{position:relative;width:66px;height:66px;}
.gtile{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.14),0 10px 20px rgba(0,0,0,.22);border:4px solid #fff;}
.gtile.done{background:radial-gradient(circle at 38% 32%,#ffefb0,#e0b84a 62%,#b07d12);color:#5c4300;text-shadow:0 1px 0 rgba(255,255,255,.5);}
.gtile.locked{background:radial-gradient(circle at 38% 32%,#e9e9ee,#b9b9c2 72%,#9a9aa4);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.1),0 8px 14px rgba(0,0,0,.16);}
.gtile.active{background:radial-gradient(circle at 38% 32%,#fff,var(--wc,#5b6cff) 135%);overflow:visible;box-shadow:0 0 0 6px rgba(255,210,74,.4),0 10px 22px rgba(0,0,0,.3);}
.gnum{position:absolute;bottom:-3px;right:-3px;width:24px;height:24px;border-radius:50%;background:#1d1d1f;color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #fff;z-index:4;}
.gtile.done::after{content:'';position:absolute;inset:0;border-radius:50%;background:linear-gradient(120deg,transparent 34%,rgba(255,255,255,.7) 50%,transparent 66%);background-size:230% 230%;animation:gshine 3.4s ease-in-out infinite;}
@keyframes gshine{0%,100%{background-position:175% 175%;}50%{background-position:-75% -75%;}}
.gpiece{position:absolute;inset:-6px;border-radius:50%;overflow:hidden;border:4px solid #ffd24a;box-shadow:0 0 0 4px rgba(255,210,74,.4),0 10px 20px rgba(0,0,0,.32);background:#5b6cff;z-index:6;}
.gpiece img{width:100%;height:100%;object-fit:cover;}
.gpiece .gpini{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:20px;}
.gnode.active{z-index:7;}
.gnode.active .gpiece{animation:gbob 2.4s ease-in-out infinite;}
@keyframes gbob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.gnode.just .gpiece{animation:gland .8s cubic-bezier(.2,1.5,.35,1);}
@keyframes gland{0%{transform:translateY(-72px) scale(.4);opacity:.2;}55%{transform:translateY(9px) scale(1.15);opacity:1;}100%{transform:none;}}
.glabel{position:absolute;top:50%;transform:translateY(-50%);width:138px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 11px;box-shadow:0 4px 12px rgba(0,0,0,.08);}
.gnode.l .glabel{left:80px;text-align:left;}
.gnode.r .glabel{right:80px;text-align:right;}
.gnode.locked .glabel{opacity:.7;}
.gln{font-weight:800;font-size:12.5px;line-height:1.15;color:var(--ink);}
.glm{font-size:10.5px;color:var(--ink3);font-weight:700;margin-top:2px;}
.gnode.active .glabel{border-color:#ffd24a;box-shadow:0 6px 16px rgba(255,210,74,.3);}
.gnode.active .gln::after{content:' • HERE';color:var(--accent);font-size:9px;font-weight:900;}
.gfinish{position:absolute;transform:translate(-50%,-50%);z-index:3;text-align:center;font-size:42px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25));}
.gfl{font-size:11px;font-weight:900;color:var(--gold);margin-top:-6px;letter-spacing:.03em;}
@media(max-width:560px){.glabel{width:100px;padding:6px 8px;}.gnode.l .glabel{left:70px;}.gnode.r .glabel{right:70px;}}
@media(prefers-reduced-motion:reduce){.node.active .dot,.node.active .av3,.node.justarrived .av3,.node.reveal .dot,.dot.done::after,.gtile.done::after,.gnode.active .gpiece,.gnode.just .gpiece{animation:none!important;}.node.pop,.gnode.pop{opacity:1;transform:translate(-50%,-50%);animation:none;}.xpbar>span,.path .trail{transition:none;}.celecard{animation:none;}.confetti{display:none!important;}}
</style>
</head>

  <a class="side-link on" href="roadmap.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span>My Tracker</span></a>

  <a class="side-link" href="org.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="5" rx="1.5"/><rect x="3" y="16" width="6" height="5" rx="1.5"/><rect x="15" y="16" width="6" height="5" rx="1.5"/><path d="M12 8v4M6 16v-2h12v2"/></svg><span>Org Chart</span></a>
  <a class="side-link" href="ops.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="6" rx="1"/><rect x="12" y="7" width="3" height="10" rx="1"/><rect x="17" y="13" width="3" height="4" rx="1"/></svg><span>Ops Dashboard</span></a>
  <div class="tsfg-foot"><a class="side-link" href="#" onclick="tsfgSignOut();return false;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span>Sign out</span></a></div>
</aside>
<header class="tsfg-top"><button class="tsfg-ic" onclick="tsfgToggle()" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="tsfg-title">My Journey</div><div style="flex:1"></div><a class="tsfg-ic" href="checklist.html?classic=1" title="Classic checklist" style="width:auto;padding:0 12px;font-size:12.5px;font-weight:700;gap:6px">📋 Classic</a></header>

<div class="wrap" id="wrap"><div class="spin">Loading your journey…</div></div>

<div class="ov" id="ov" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="cele" id="cele"><div class="celecard" id="celecard"></div></div>
<div class="toast" id="toast"></div>

<script>
var ROADMAP="https://bmfqxtocxkjhsgfnndlo.supabase.co/functions/v1/roadmap-api";
var TRACKER="https://bmfqxtocxkjhsgfnndlo.supabase.co/functions/v1/tracker-api";
var AVATAR="https://bmfqxtocxkjhsgfnndlo.supabase.co/functions/v1/avatar";
var CODE="",NAME="";
try{CODE=(localStorage.getItem('tsfg_code')||'').toUpperCase();NAME=localStorage.getItem('tsfg_name')||'';}catch(e){}
var PLAYER=null,WORLDS=[],LABELS={},NEARBY={},AGENT=null,PROGRESS={},OPENLVL=null;
var FIRST=true,JUSTID='';
function scrollToCurrent(){var el=document.querySelector('.gnode.active');if(!el){var dn=document.querySelectorAll('.gnode.done');el=dn[dn.length-1];}if(el&&el.scrollIntoView){try{el.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){try{el.scrollIntoView();}catch(_){}}}}
var $=function(id){return document.getElementById(id);};
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2000);}
function initials(n){var p=(n||'').trim().split(/\s+/).filter(function(x){return x&&x!=='&';});return (((p[0]||'')[0]||'')+((p[1]||'')[0]||'')).toUpperCase();}
function worldById(id){for(var i=0;i<WORLDS.length;i++)if(WORLDS[i].id===id)return WORLDS[i];return {name:id,icon:'⭐',color:'#5b6cff'};}
function avImg(code,name,cls){return '<div class="'+cls+'">'+(code?('<img src="'+AVATAR+'?code='+encodeURIComponent(code)+'" alt="" loading="lazy" onerror="this.remove()">'):'')+(name?('<span class="ini" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center">'+esc(initials(name))+'</span>'):'')+'</div>';}

function load(){
  if(!CODE){$('wrap').innerHTML='<div class="spin">Sign in from Home to see your journey.</div>';return;}
  Promise.all([
    fetch(ROADMAP,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'player',code:CODE})}).then(function(r){return r.json();}),
    fetch(ROADMAP,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'nearby',code:CODE})}).then(function(r){return r.json();}),
    fetch(TRACKER+'?action=load&code='+encodeURIComponent(CODE)).then(function(r){return r.json();}).catch(function(){return {};})
  ]).then(function(res){
    var pd=res[0];if(!pd||!pd.ok){$('wrap').innerHTML='<div class="spin">Could not load your journey.</div>';return;}
    PLAYER=pd.player;WORLDS=pd.worlds||[];LABELS=pd.labels||{};NEARBY=res[1]&&res[1].ok?res[1]:{};
    AGENT=(res[2]&&res[2].agent)||{};PROGRESS=(AGENT.progress&&typeof AGENT.progress==='object')?AGENT.progress:{};
    render();
  }).catch(function(){$('wrap').innerHTML='<div class="spin">Network error — try again.</div>';});
}

function xpToNext(){
  // XP within the current level bracket: base 100 per level; simple next-milestone bar off current level's challenge completion
  var cur=PLAYER.levels.filter(function(l){return l.id===PLAYER.current_level;})[0];
  if(!cur||!cur.total)return {pct:100,label:'Journey complete 🎉'};
  return {pct:Math.round(cur.completed*100/cur.total),label:cur.completed+' / '+cur.total+' challenges in "'+cur.name+'"'};
}
function render(){
  var w=worldById(PLAYER.current_world);
  var xn=xpToNext();
  var rank=PLAYER.contract_level||(PLAYER.pathway?(PLAYER.pathway.charAt(0).toUpperCase()+PLAYER.pathway.slice(1)):'Rookie Broker');
  var h='<div class="hud"><div class="row">'+avImg(PLAYER.has_photo?PLAYER.code:'',PLAYER.name,'av')
    +'<div style="min-width:0"><div class="nm">'+esc(PLAYER.name||'Broker')+'</div><div class="sub">'+esc(w.icon+' '+w.name)+' · '+esc(rank)+'</div></div>'
    +'<div class="streak"><div class="f">🔥</div><div class="n">'+(PLAYER.streak||0)+'</div><div class="l">day streak</div></div></div>'
    +'<div class="xpwrap"><div class="xprow"><span>'+esc(xn.label)+'</span><span>'+PLAYER.xp+' XP</span></div><div class="xpbar"><span style="width:'+xn.pct+'%"></span></div></div>'
    +'<div class="chips"><span class="chip">Level '+PLAYER.level_index+' / '+PLAYER.total_levels+'</span><span class="chip">'+PLAYER.pct+'% complete</span><span class="chip">'+PLAYER.done_challenges+' challenges done</span></div></div>';

  // nearby
  var nc=[];
  (NEARBY.ahead||[]).forEach(function(s){nc.push(nearCard(s,'ahead','Catching…'));});
  (NEARBY.same||[]).forEach(function(s){nc.push(nearCard(s,'same','Neck & neck'));});
  (NEARBY.behind||[]).forEach(function(s){nc.push(nearCard(s,'behind','Behind you'));});
  if(nc.length)h+='<div class="sechead">Who’s near you</div><div class="near">'+nc.join('')+'</div>';

  // video-game board
  var wasFirst=FIRST;
  h+='<div class="sechead">Your journey board</div><div class="board">'+buildBoard()+'</div>';
  $('wrap').innerHTML=h;
  FIRST=false;JUSTID='';
  if(wasFirst)setTimeout(scrollToCurrent,540);else scrollToCurrent();
}
function pathThrough(pts){if(!pts.length)return '';var d='M '+pts[0].x+' '+pts[0].y;for(var i=1;i<pts.length;i++){var a=pts[i-1],b=pts[i];var my=(a.y+b.y)/2;d+=' C '+a.x+' '+my+' '+b.x+' '+my+' '+b.x+' '+b.y;}return d;}
function pieceHtml(){return '<span class="gpiece">'+(PLAYER.has_photo?('<img src="'+AVATAR+'?code='+encodeURIComponent(PLAYER.code)+'" alt="" onerror="this.remove()">'):('<span class="gpini">'+esc(initials(PLAYER.name))+'</span>'))+'</span>';}
function buildBoard(){
  var L=PLAYER.levels;if(!L.length)return '<div class="hint" style="padding:30px;text-align:center;color:var(--ink3)">Your board is being set up.</div>';
  var TOP=82,SP=132,BOT=150,XL=26,XR=74;
  var pos=L.map(function(l,n){return {x:(n%2===0?XL:XR),y:TOP+n*SP};});
  var H=TOP+(L.length-1)*SP+BOT;
  var activeIdx=-1;L.forEach(function(l,n){if(l.status==='active'&&activeIdx<0)activeIdx=n;});if(activeIdx<0)activeIdx=L.length-1;
  var full=pathThrough(pos);var trav=pathThrough(pos.slice(0,activeIdx+1));
  // world regions
  var regHtml='';
  WORLDS.slice().sort(function(a,b){return (a.order||0)-(b.order||0);}).forEach(function(w){
    var idxs=[];L.forEach(function(l,n){if(l.world===w.id)idxs.push(n);});if(!idxs.length)return;
    var y0=Math.max(0,pos[idxs[0]].y-SP*0.62),y1=pos[idxs[idxs.length-1]].y+SP*0.62;
    regHtml+='<div class="gregion" style="top:'+y0+'px;height:'+(y1-y0)+'px;background:linear-gradient(165deg,'+w.color+'26,'+w.color+'0a)"><div class="gscene" style="color:'+w.color+'"></div><div class="gflag" style="background:linear-gradient(135deg,'+w.color+'dd,'+w.color+')"><span>'+esc(w.icon)+'</span>'+esc(w.name)+'</div></div>';
  });
  var svg='<svg class="gpath" viewBox="0 0 100 '+H+'" preserveAspectRatio="none" width="100%" height="'+H+'"><defs><linearGradient id="travg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe89a"/><stop offset="1" stop-color="#c99a2e"/></linearGradient></defs>'
    +'<path d="'+full+'" fill="none" stroke="#d3d3dc" stroke-width="10" stroke-linecap="round" vector-effect="non-scaling-stroke" stroke-dasharray="0.5 16"/>'
    +'<path d="'+trav+'" fill="none" stroke="url(#travg)" stroke-width="10" stroke-linecap="round" vector-effect="non-scaling-stroke" style="filter:drop-shadow(0 0 5px rgba(224,184,74,.6))"/></svg>';
  var nodes=L.map(function(l,n){
    var p=pos[n];var side=(n%2===0)?'l':'r';var w=worldById(l.world);var tile;
    if(l.status==='done'){tile='<span class="gtile done">✓</span>';}
    else if(l.status==='active'){tile='<span class="gtile active" style="--wc:'+w.color+'">'+pieceHtml()+'</span>';}
    else{tile='<span class="gtile locked">🔒</span>';}
    var pop=FIRST?' pop':'';var just=(l.status==='active'&&l.id===JUSTID)?' just':'';
    var st='left:'+p.x+'%;top:'+p.y+'px;'+(FIRST?'animation-delay:'+(n*0.04).toFixed(2)+'s':'');
    return '<div class="gnode '+l.status+' '+side+pop+just+'" style="'+st+'" onclick="openLevel(\''+l.id+'\')">'
      +'<div class="gtwrap">'+tile+(l.status!=='active'?'<span class="gnum">'+(n+1)+'</span>':'')+'</div>'
      +'<div class="glabel"><div class="gln">'+esc(l.name)+'</div>'+(l.total?'<div class="glm">'+l.completed+'/'+l.total+'</div>':'')+'</div></div>';
  }).join('');
  var fx=(L.length%2===0?XL:XR),fy=TOP+(L.length-1)*SP+BOT*0.5;
  var finish='<div class="gfinish" style="left:'+fx+'%;top:'+fy+'px">🏆<div class="gfl">The Standard</div></div>';
  return '<div class="gboard" style="height:'+H+'px">'+regHtml+svg+finish+nodes+'</div>';
}
function nearCard(s,cls,tlabel){
  var lead=cls==='ahead'?('+'+(s.level_index-PLAYER.level_index)+' lvl'):(cls==='behind'?('-'+(PLAYER.level_index-s.level_index)+' lvl'):('Lvl '+s.level_index));
  return '<div class="ncard '+cls+'"><div class="t">'+tlabel+'</div><div class="p">'+avImg(s.has_photo?s.code:'',s.name,'nav2')+'<div style="min-width:0"><div class="nn">'+esc((s.name||'').split(' ')[0])+'</div><div class="nl">'+lead+' · '+s.xp+' XP</div></div></div></div>';
}

function openLevel(id){
  var l=PLAYER.levels.filter(function(x){return x.id===id;})[0];if(!l)return;
  if(l.status==='locked'){toast('🔒 Finish the level before this to unlock it');return;}
  OPENLVL=l;var w=worldById(l.world);
  var reward=l.reward_emblem?('<div class="reward">🏅 Completing this unlocks the <b>'+esc(l.reward_emblem.replace(/_/g,' '))+'</b> emblem</div>'):'';
  var chl=(l.challenges||[]).map(function(id){
    var done=!!PROGRESS[id];
    return '<div class="ci'+(done?' done':'')+'" onclick="toggleChallenge(\''+id+'\')"><div class="ck">'+(done?'✓':'')+'</div><div class="cn">'+esc(LABELS[id]||id)+'</div><div class="cx">+25 XP</div></div>';
  }).join('');
  $('sheet').innerHTML='<div class="sh-h"><div class="sh-ic" style="background:'+w.color+'">'+(l.status==='done'?'✓':w.icon)+'</div>'
    +'<div style="min-width:0"><h3>'+esc(l.name)+'</h3><div class="d">'+esc(w.icon+' '+w.name)+(l.difficulty==='hard'?' · ⚡ Hard':'')+'</div></div><button class="sh-x" onclick="closeSheet()">✕</button></div>'
    +(l.desc?'<div style="font-size:13.5px;color:var(--ink2);margin-top:10px">'+esc(l.desc)+'</div>':'')+reward
    +'<div class="chl">'+chl+'</div>'
    +'<div style="font-size:11.5px;color:var(--ink3);text-align:center;margin-top:14px">Checking a challenge saves to your tracker instantly.</div>';
  $('ov').classList.add('on');
}
function closeSheet(){$('ov').classList.remove('on');OPENLVL=null;}

var SAVING=false;
function toggleChallenge(id){
  if(SAVING)return;
  var wasDone=!!PROGRESS[id];
  if(wasDone)delete PROGRESS[id];else PROGRESS[id]=1;
  var lvlBefore=PLAYER.level_index;
  SAVING=true;
  // echo preserved fields so nothing else is blanked
  var body={action:'save',code:CODE,progress:PROGRESS,total:AGENT.total||0,pathway:AGENT.pathway||PLAYER.pathway||'',
    emd:AGENT.emd,md:AGENT.md,ft_log:AGENT.ft_log,carrier_codes:AGENT.carrier_codes,warm_market:AGENT.warm_market,activity_log:AGENT.activity_log,promo:AGENT.promo};
  fetch(TRACKER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(){
    // re-derive from the engine
    return fetch(ROADMAP,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'player',code:CODE})}).then(function(r){return r.json();});
  }).then(function(pd){
    SAVING=false;
    if(pd&&pd.ok){var justCompleted=null;var openId=OPENLVL&&OPENLVL.id;
      // detect a level that flipped to done
      var before={};PLAYER.levels.forEach(function(l){before[l.id]=l.status;});
      PLAYER=pd.player;LABELS=pd.labels||LABELS;WORLDS=pd.worlds||WORLDS;
      PLAYER.levels.forEach(function(l){if(l.status==='done'&&before[l.id]&&before[l.id]!=='done')justCompleted=l;});
      if(justCompleted)JUSTID=PLAYER.current_level; /* avatar lands on its new tile */
      render();
      if(openId){var still=PLAYER.levels.filter(function(x){return x.id===openId;})[0];if(still&&still.status!=='locked')openLevel(openId);else closeSheet();}
      if(justCompleted){closeSheet();celebrate(justCompleted);}
      else if(!wasDone)toast('+25 XP');
      // refresh nearby quietly
      fetch(ROADMAP,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'nearby',code:CODE})}).then(function(r){return r.json();}).then(function(n){if(n&&n.ok){NEARBY=n;}});
    }
  }).catch(function(){SAVING=false;toast('Save failed — check connection');});
}

function celebrate(l){
  var w=worldById(l.world);
  $('celecard').innerHTML='<div class="big">'+(l.reward_emblem?'🏅':'🎉')+'</div><h2>Level Complete!</h2><p>'+esc(l.name)+'</p><div class="xpgain">+'+((l.total*25)+100)+' XP earned</div>'
    +(l.reward_emblem?'<p style="color:var(--gold);font-weight:800">🏅 '+esc(l.reward_emblem.replace(/_/g,' '))+' emblem unlocked!</p>':'')
    +'<button onclick="closeCele()">Keep going →</button>';
  $('cele').classList.add('on');fireConfetti();
}
function closeCele(){$('cele').classList.remove('on');}
function fireConfetti(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var cols=['#ffd24a','#5b6cff','#34c759','#ff2d55','#af52de','#ff9f0a'];
  for(var i=0;i<80;i++){(function(){
    var c=document.createElement('div');c.className='confetti';
    c.style.left=(Math.random()*100)+'vw';c.style.background=cols[i%cols.length];
    var dur=2.4+Math.random()*1.6;c.style.transition='transform '+dur+'s linear, opacity '+dur+'s linear';
    document.body.appendChild(c);
    requestAnimationFrame(function(){c.style.transform='translateY('+(window.innerHeight+40)+'px) rotate('+(Math.random()*720-360)+'deg)';c.style.opacity='0';});
    setTimeout(function(){c.remove();},dur*1000+100);
  })();}
}
function tsfgToggle(){if(window.innerWidth<=860)tsfgDrawer(!document.body.classList.contains('tsfg-drawer'));}
function tsfgDrawer(on){document.body.classList.toggle('tsfg-drawer',!!on);}
function tsfgSignOut(){try{localStorage.removeItem('tsfg_code');localStorage.removeItem('tsfg_name');}catch(e){}location.href='index.html';}
load();
</script>
<script defer src="notif.js"></script>
</body>
