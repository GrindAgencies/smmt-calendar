<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Team — GRIND Agencies</title>
<link rel="icon" href="logo.png">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1120px;margin:0 auto;padding-bottom:60px;}
a{color:inherit}
.head{text-align:center;padding:26px 16px 6px;}
.head .wm{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#6e6e73;font-weight:700;}
.head h1{margin:6px 0 2px;font-size:26px;font-weight:900;letter-spacing:-.01em;background:linear-gradient(180deg,#fff4cf,#c99a2e 55%,#cda22f);-webkit-background-clip:text;background-clip:text;color:transparent;}
.head .sub{font-size:13px;color:#6e6e73;}
.panel{margin:16px;border:1px solid #ececf0;border-radius:16px;background:linear-gradient(160deg,#ffffff,#fbfbfd);padding:16px 16px 18px;}
.muted{color:#6e6e73;}.center{text-align:center;}
.spin{text-align:center;color:#6e6e73;padding:34px;font-style:italic;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#eef0f4;border:1px solid #8a6d1f;color:#1d1d1f;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.2s;z-index:90;}
.toast.show{opacity:1;}
/* stat cards */
.tmstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin:14px 16px 4px;}
.tmst{background:#fff;border:1px solid #ececf0;border-radius:14px;padding:13px 15px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.tmst b{display:block;font-size:24px;font-weight:900;line-height:1;color:#1d1d1f;font-variant-numeric:tabular-nums;}
.tmst span{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#6e6e73;font-weight:800;margin-top:5px;display:block;}
.tmst.grn b{color:#1a9c52}.tmst.gold b{color:#c99a2e}.tmst.blu b{color:#5b6cff}
/* legs */
.legttl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#c99a2e;margin:12px 16px 4px;}
.legrow{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 6px;scrollbar-width:thin;}
.legcard{flex:0 0 auto;min-width:152px;border:1px solid #ececf0;border-radius:13px;background:#fbfbfd;padding:11px 13px;cursor:pointer;transition:.12s;}
.legcard:hover{border-color:#c99a2e;}
.legcard.on{border-color:#c99a2e;background:#fff7e6;}
.legcard .ln{font-weight:800;font-size:13.5px;color:#1d1d1f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;}
.legcard .lm{font-size:11.5px;color:#6e6e73;margin-top:3px;}
/* controls + roster */
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 16px 2px;}
.tbar input,.tbar select{font:inherit;font-size:13px;font-weight:600;padding:9px 13px;border:1px solid #e3e3e8;border-radius:11px;background:#fff;color:#1d1d1f;}
.tbar input{flex:1;min-width:150px;max-width:260px;}
.crumb{margin:6px 16px 0;font-size:13px;color:#6e6e73;}
.crumb a{color:#5b6cff;font-weight:700;cursor:pointer;}
.trow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;border:1px solid #ececf0;border-left-width:5px;border-radius:12px;background:#fff;padding:10px 13px;margin-top:8px;cursor:pointer;transition:.12s;}
.trow:hover{border-color:#e3e3e8;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.trow.g{border-left-color:#3ec98a}.trow.y{border-left-color:#c99a2e}.trow.r{border-left-color:#e0533d}.trow.n{border-left-color:#b7b7bd}
.tav{position:relative;width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,#f0d08a,#c99433);color:#3a2a12;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto;}
.tav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.tnm{font-weight:800;font-size:14.5px;color:#1d1d1f;}
.tbadge{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.03em;padding:2px 6px;border-radius:999px;margin-left:6px;vertical-align:middle;}
.tbadge.emd{background:rgba(201,154,46,.16);color:#8a6d1f;border:1px solid #caa23a;}
.tbadge.md{background:rgba(91,108,255,.12);color:#4048c0;border:1px solid #7fb0e6;}
.tbadge.new{background:rgba(52,199,89,.16);color:#1a7f47;border:1px solid #2c6b4d;}
.tmeta{font-size:12px;color:#6e6e73;margin-top:3px;line-height:1.5;}
.tmeta span{margin-right:11px;white-space:nowrap;}
.tright{text-align:right;font-size:10.5px;color:#6e6e73;font-weight:700;white-space:nowrap;}
.tright .big{font-size:18px;font-weight:900;color:#1d1d1f;display:block;line-height:1;}
@media(max-width:560px){.trow{grid-template-columns:36px 1fr auto;}.tmeta span{margin-right:8px;}}
</style>
<style id="tsfg-skin">
:root, html[data-theme]{
  --bg:#f5f5f7!important;--panel:#ffffff!important;--ink:#1d1d1f!important;--muted:#6e6e73!important;--line:#ececf0!important;
  --gold:#c99a2e!important;--green:#34c759!important;--red:#ff3b30!important;--blue:#5b6cff!important;
  --tsfg-accent:#5b6cff;--tsfg-side:248px;
}
html,body{background:#f5f5f7!important;color:#1d1d1f!important;}
body{padding-left:var(--tsfg-side)!important;padding-top:60px!important;-webkit-font-smoothing:antialiased;}
.tsfg-side{position:fixed;left:0;top:0;height:100vh;width:var(--tsfg-side);background:#fff;border-right:1px solid #ececf0;
  display:flex;flex-direction:column;gap:3px;padding:16px 12px;z-index:900;overflow-y:auto;transition:transform .24s cubic-bezier(.2,.8,.2,1);}
.tsfg-brand{display:flex;align-items:center;gap:11px;padding:6px 8px 14px;color:#1d1d1f;text-decoration:none;}
.tsfg-brand img{width:34px;height:34px;border-radius:10px;object-fit:cover;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.tsfg-brand .bn{font-weight:800;font-size:16px;letter-spacing:-.02em;}
.tsfg-brand .bn b{color:var(--tsfg-accent);}
.tsfg-side .side-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:#6e6e73;font-weight:600;font-size:14px;text-decoration:none;transition:.15s;white-space:nowrap;}
.tsfg-side .side-link svg{width:20px;height:20px;flex:0 0 auto;}
.tsfg-side .side-link:hover{background:#f5f5f7;color:#1d1d1f;}
.tsfg-side .side-link.on{background:rgba(91,108,255,.10);color:var(--tsfg-accent);}
.tsfg-foot{margin-top:auto;padding-top:10px;border-top:1px solid #ececf0;}
.tsfg-top{position:fixed;top:0;left:var(--tsfg-side);right:0;height:60px;z-index:850;display:flex;align-items:center;gap:14px;
  padding:0 22px;background:rgba(245,245,247,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid #ececf0;}
.tsfg-title{font-weight:800;font-size:17px;letter-spacing:-.02em;color:#1d1d1f;}
.tsfg-ic{width:38px;height:38px;border-radius:11px;border:1px solid #e3e3e8;background:#fff;color:#6e6e73;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.tsfg-ic:hover{color:#1d1d1f;}
.tsfg-ic svg{width:18px;height:18px;}
.tsfg-scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:880;}
body.tsfg-drawer .tsfg-scrim{display:block;}
@media(max-width:860px){
  body{padding-left:0!important;}
  .tsfg-side{transform:translateX(-100%);box-shadow:0 20px 60px rgba(0,0,0,.25);}
  body.tsfg-drawer .tsfg-side{transform:none;}
  .tsfg-top{left:0;}
}
input,textarea,select{border-radius:12px;}
</style>
</head>

<div class="tsfg-scrim" onclick="tsfgDrawer(false)"></div><aside class="tsfg-side"><a class="tsfg-brand" href="index.html"><img src="logo.png" alt="" onerror="this.style.visibility='hidden'"><span class="bn">The <b>Standard</b></span></a><a class="side-link" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="lbl">Home</span></a><a class="side-link" href="teamhub.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/></svg><span class="lbl">Team Hub</span></a><a class="side-link" href="calendar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 3v3M16 3v3"/></svg><span class="lbl">Scheduler</span></a><a class="side-link" href="newbusiness.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span class="lbl">New Business</span></a><a class="side-link" href="pfr.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-2M9 12h6M9 16h6M9 8h6"/></svg><span class="lbl">PFR Builder</span></a><a class="side-link" href="checklist.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span class="lbl">My Tracker</span></a><a class="side-link" href="marketing.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg><span class="lbl">Leads</span></a><a class="side-link on" href="team.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="lbl">My Team</span></a><a class="side-link" href="org.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="5" rx="1.5"/><rect x="3" y="16" width="6" height="5" rx="1.5"/><rect x="15" y="16" width="6" height="5" rx="1.5"/><path d="M12 8v4M6 16v-2h12v2"/></svg><span class="lbl">Org Chart</span></a><a class="side-link" href="resources.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-2z"/><path d="M4 5v14M9 3v18"/></svg><span class="lbl">Resources</span></a><a class="side-link" href="ops.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="6" rx="1"/><rect x="12" y="7" width="3" height="10" rx="1"/><rect x="17" y="13" width="3" height="4" rx="1"/></svg><span class="lbl">Ops Dashboard</span></a><div class="tsfg-foot"><a class="side-link" href="#" onclick="tsfgSignOut();return false;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span class="lbl">Sign out</span></a></div></aside><header class="tsfg-top"><button class="tsfg-ic" onclick="tsfgToggle()" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="tsfg-title">My Team</div><div style="flex:1"></div><button class="tsfg-ic" onclick="tsfgTheme()" id="tsfgThemeBtn" aria-label="Theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></button></header>

<div class="wrap">
  <div class="head">
    <div class="wm">The Standard Financial Group</div>
    <h1>My Team</h1>
    <div class="sub" id="viewSub">Your full downline — momentum, growth, and every leg.</div>
  </div>
  <div id="teamArea"><div class="spin">Loading your team…</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const ORGAPI="https://bmfqxtocxkjhsgfnndlo.supabase.co/functions/v1/org-api";
const AVATAR="https://bmfqxtocxkjhsgfnndlo.supabase.co/functions/v1/avatar";
let CODE="",NAME="";
try{CODE=(localStorage.getItem('tsfg_code')||'').toUpperCase();NAME=localStorage.getItem('tsfg_name')||'';}catch(e){}
let VIEW=CODE, LEADER=null, CREW=[], STATS=null, LEG="", Q="", SORT="team";
const $=function(id){return document.getElementById(id);};
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2100);}
function initials(n){var p=(n||'').trim().split(/\s+/).filter(function(x){return x&&x!=='&';});return (((p[0]||'')[0]||'')+((p[1]||'')[0]||'')).toUpperCase();}
function actClass(n){if(n.active)return 'g';if(n.days_inactive==null)return 'n';if(n.days_inactive<=45)return 'y';return 'r';}
function lvlBadge(lvl){var l=(lvl||'').toLowerCase();if(/executive|national vice|senior executive/.test(l))return '<span class="tbadge emd">EMD</span>';if(/marketing director/.test(l))return '<span class="tbadge md">MD</span>';return '';}

function load(code){
  VIEW=(code||CODE||'').toUpperCase();
  if(!VIEW){ $('teamArea').innerHTML='<div class="panel center muted">Sign in from Home first to see your team.</div>'; return; }
  $('teamArea').innerHTML='<div class="spin">Loading team…</div>';
  Promise.all([
    fetch(ORGAPI,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'stats',code:VIEW})}).then(function(r){return r.json();}),
    fetch(ORGAPI,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'downline',code:VIEW})}).then(function(r){return r.json();})
  ]).then(function(res){
    var st=res[0], dl=res[1];
    if(!st||!st.ok){ $('teamArea').innerHTML='<div class="panel center muted">Could not load this team.</div>'; return; }
    STATS=st; LEADER=st.leader||{}; CREW=(dl&&dl.downline)||[]; LEG=""; Q=""; render();
    try{window.scrollTo(0,0);}catch(e){}
  }).catch(function(){ $('teamArea').innerHTML='<div class="panel center muted">Network error — try again.</div>'; });
}
function render(){
  if(!STATS)return;
  var L=LEADER||{};
  $('viewSub').textContent=(VIEW===CODE?'Your full downline':(L.name+"’s team"))+' — momentum, growth, and every leg.';
  var crumb=(VIEW!==CODE)?'<div class="crumb"><a onclick="load(\''+CODE+'\')">← Back to my team</a> · viewing <b>'+esc(L.name||'')+'</b>'+(L.baseshop?(' · '+esc(L.baseshop)):'')+'</div>':'';
  var stat='<div class="tmstat">'+
    '<div class="tmst"><b>'+(STATS.total_downline||0)+'</b><span>Team size</span></div>'+
    '<div class="tmst"><b>'+(STATS.directs||0)+'</b><span>Direct legs</span></div>'+
    '<div class="tmst grn"><b>'+(STATS.active_pct||0)+'%</b><span>Active</span></div>'+
    '<div class="tmst gold"><b>'+(STATS.new_recruits_30d||0)+'</b><span>New · 30d</span></div>'+
    '</div>';
  var legNew={}; CREW.forEach(function(p){ if(p.is_new&&p.leg) legNew[p.leg]=(legNew[p.leg]||0)+1; });
  var legs=(STATS.legs||[]);
  var legHtml=legs.length?('<div class="legttl">Legs</div><div class="legrow">'+
    '<div class="legcard'+(LEG===''?' on':'')+'" onclick="setLeg(\'\')"><div class="ln">All legs</div><div class="lm">'+(STATS.total_downline||0)+' people</div></div>'+
    legs.map(function(l){return '<div class="legcard'+(LEG===l.code?' on':'')+'" onclick="setLeg(\''+l.code+'\')"><div class="ln">'+esc(l.name)+'</div><div class="lm">'+l.size+' team · '+l.active+' active'+(legNew[l.code]?(' · +'+legNew[l.code]+' new'):'')+'</div></div>';}).join('')+'</div>'):'';
  var ctrl='<div class="tbar"><input id="q" placeholder="Search your team…" oninput="onSearch()" value="'+esc(Q)+'"><select id="sort" onchange="SORT=this.value;paint()"><option value="team"'+(SORT==='team'?' selected':'')+'>Sort: team size</option><option value="name"'+(SORT==='name'?' selected':'')+'>Sort: name</option><option value="active"'+(SORT==='active'?' selected':'')+'>Sort: activity</option><option value="new"'+(SORT==='new'?' selected':'')+'>Sort: newest</option></select></div>';
  $('teamArea').innerHTML=crumb+stat+legHtml+ctrl+'<div id="roster" style="margin:0 16px"></div>';
  paint();
}
function paint(){
  var el=$('roster'); if(!el)return;
  var rows=CREW.slice();
  if(LEG) rows=rows.filter(function(p){return p.leg===LEG;});
  if(Q) rows=rows.filter(function(p){return (p.name+' '+p.code+' '+(p.baseshop||'')+' '+(p.direct_to_name||'')).toLowerCase().indexOf(Q)>=0;});
  rows.sort(function(a,b){
    if(SORT==='name')return a.name.localeCompare(b.name);
    if(SORT==='active')return (b.active?1:0)-(a.active?1:0)||((a.days_inactive==null?999:a.days_inactive)-(b.days_inactive==null?999:b.days_inactive));
    if(SORT==='new')return (b.is_new?1:0)-(a.is_new?1:0)||String(b.created_at||'').localeCompare(String(a.created_at||''));
    return (b.downline_total||0)-(a.downline_total||0)||a.name.localeCompare(b.name);
  });
  if(!rows.length){ el.innerHTML='<div class="panel center muted">'+(CREW.length?'No one matches that search.':'No downline yet — recruits will appear here as your team grows.')+'</div>'; return; }
  el.innerHTML=rows.map(function(p){
    var ac=actClass(p);
    var act=p.active?'Active':(p.days_inactive==null?'No activity yet':(p.days_inactive+'d quiet'));
    var face=p.has_photo?('<img src="'+AVATAR+'?code='+encodeURIComponent(p.code)+'" alt="" loading="lazy" onerror="this.remove()">'):'';
    var right=(p.downline_total>0)?('<div class="tright"><span class="big">'+p.downline_total+'</span>team →</div>'):('<div class="tright"><span class="big">'+(p.onboarding_pct||0)+'%</span>onboard</div>');
    return '<div class="trow '+ac+'" onclick="load(\''+p.code+'\')" title="'+(p.downline_total>0?'Open '+esc(p.name)+'’s team':esc(p.name))+'">'+
      '<div class="tav">'+face+esc(initials(p.name))+'</div>'+
      '<div style="min-width:0"><div class="tnm">'+esc(p.name)+lvlBadge(p.level)+(p.is_new?'<span class="tbadge new">New</span>':'')+'</div>'+
        '<div class="tmeta"><span>'+esc(p.baseshop||'—')+'</span><span>under '+esc(p.direct_to_name||'—')+'</span><span>'+esc(act)+'</span>'+(p.license_status?('<span>'+esc(p.license_status)+'</span>'):'')+'</div></div>'+
      right+'</div>';
  }).join('');
}
function onSearch(){ Q=(($('q')||{}).value||'').trim().toLowerCase(); paint(); }
function setLeg(l){ LEG=l; render(); }
load(CODE);
</script>

<script>
function tsfgToggle(){ if(window.innerWidth<=860){tsfgDrawer(!document.body.classList.contains('tsfg-drawer'));} }
function tsfgDrawer(on){document.body.classList.toggle('tsfg-drawer',!!on);}
function tsfgTheme(){var d=document.documentElement.getAttribute('data-theme')==='dark';document.documentElement.setAttribute('data-theme',d?'light':'dark');try{localStorage.setItem('gfi_theme',d?'light':'dark');}catch(e){}}
function tsfgSignOut(){try{localStorage.removeItem('tsfg_code');localStorage.removeItem('tsfg_name');}catch(e){}location.href='index.html';}
</script>
<script defer src="notif.js"></script>
</body>
