<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Standard</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f1a;color:#e8ecf3;
    font-family:-apple-system,system-ui,Inter,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px;box-sizing:border-box;gap:18px;}
  .mono{width:76px;height:76px;border-radius:20px;background:#11172a;border:1px solid #223;
    display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;
    font-weight:700;font-size:30px;color:#c99a2e;letter-spacing:1px;}
  h1{font-size:19px;margin:4px 0 0;font-weight:800;}
  p{color:#8b93a7;font-size:14px;line-height:1.5;margin:0;max-width:280px;}
  button{margin-top:8px;border:none;background:#5b6cff;color:#fff;font-weight:700;font-size:15px;
    padding:13px 26px;border-radius:13px;font-family:inherit;}
</style></head><body>
  <div class="wrap">
    <div class="mono">TS</div>
    <h1>The Standard</h1>
    <p>Can't reach the network right now. Check your connection and try again.</p>
    <button onclick="location.href='https://tsfg.app/app.html'">Retry</button>
  </div>
</body></html>
