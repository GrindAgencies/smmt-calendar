<!doctype html>
<html lang="en" data-theme="dark">
<head>
<script src="session.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Summit — The Standard</title>
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* ===== Summit: obsidian / warm charcoal / refined gold / ivory =========================
   This page deliberately commits to one look rather than following the app's light/dark
   toggle — it is the championship room, and the handoff specifies a single premium
   identity. Every colour is painted explicitly so it never borrows a host theme. */
:root{
  --summit-black:#090806; --summit-panel:#14110e; --summit-panel2:#1b1713;
  --summit-gold:#d7ae54; --summit-bright:#f2d17a; --summit-ivory:#f4efe3;
  --summit-muted:#b9b0a0; --summit-line:rgba(215,174,84,.20); --summit-line2:rgba(215,174,84,.34);
  --nvp:#ff4d4d; --md:#f2d14f; --sa:#55a8ff; --assoc:#55d982; --pending:#8d8577;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--summit-black);color:var(--summit-ivory);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 600px at 50% -10%,rgba(215,174,84,.07),transparent 60%)}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{position:relative;z-index:1;max-width:1420px;margin:0 auto;padding:0 18px 80px}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:calc(12px + env(safe-area-inset-top)) 18px 12px;
  background:rgba(9,8,6,.88);backdrop-filter:saturate(160%) blur(18px);
  border-bottom:1px solid var(--summit-line)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
/* The brand sits centred between the two side slots rather than hard-left, so the wordmark is
   optically centred regardless of which side controls are showing. */
.top{justify-content:space-between}
.top .brand{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none}
.top .iconbtn{flex:0 0 auto}
/* 38px is the drawn control; the tap target is padded out to the 44pt minimum. */
.top .iconbtn.back{font-size:26px;line-height:1;text-decoration:none;display:flex;align-items:center;justify-content:center}
.top .iconbtn.back::after{content:'';position:absolute;inset:-4px}
.top .iconbtn{position:relative}
/* ROAD VIEW: section 10's simplified composition. No hamburger, no per-view title, no tab bar. */
body.road-view .top .ptitle,
body.road-view .top .iconbtn.menu,
body.road-view .tabs{display:none}
body.road-view .top{justify-content:flex-start}
.brand .mk{width:34px;height:34px;flex:0 0 auto}
.brand b{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--summit-ivory)}
.brand small{display:block;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--summit-muted)}
.ptitle{margin-left:auto;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--summit-muted)}
/* On a phone the per-view label collided with the brand ("ORG CHART" drawn over "THE STANDARD"),
   and the tab bar right beneath already names the view. */
@media (max-width:560px){ .top .ptitle{display:none} }
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--summit-line);
  background:var(--summit-panel);color:var(--summit-ivory);display:flex;align-items:center;
  justify-content:center;font-size:16px;transition:.16s}
.iconbtn:hover{border-color:var(--summit-line2);background:var(--summit-panel2)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;padding:16px 0 4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:10px 18px;border-radius:12px;border:1px solid transparent;
  color:var(--summit-muted);font-weight:700;font-size:13px;letter-spacing:.04em;
  text-transform:uppercase;transition:.16s;white-space:nowrap}
.tab:hover{color:var(--summit-ivory)}
.tab.on{color:var(--summit-black);background:linear-gradient(140deg,var(--summit-bright),var(--summit-gold));
  box-shadow:0 6px 20px rgba(215,174,84,.22)}

/* ---------- generic panel ---------- */
.panel{border:1px solid var(--summit-line);border-radius:22px;background:
  linear-gradient(145deg,rgba(25,21,15,.94),rgba(8,7,5,.98));padding:20px}
.eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--summit-gold);font-weight:800}
h1.big{margin:4px 0 0;font-size:26px;letter-spacing:-.01em;font-weight:800}
.muted{color:var(--summit-muted)}

/* ---------- org map ---------- */
.maptools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0}
.tool{padding:8px 13px;border-radius:10px;border:1px solid var(--summit-line);
  background:var(--summit-panel);color:var(--summit-muted);font-weight:700;font-size:12.5px;transition:.15s}
.tool:hover{color:var(--summit-ivory);border-color:var(--summit-line2)}
.srch{flex:1;min-width:170px;padding:9px 13px;border-radius:10px;border:1px solid var(--summit-line);
  background:var(--summit-panel);color:var(--summit-ivory);outline:none}
.srch::placeholder{color:#6f685c}
.srch:focus{border-color:var(--summit-line2)}
.zoomwrap{display:flex;align-items:center;gap:6px;margin-left:auto}
.zpct{min-width:52px;text-align:center;font-weight:800;font-size:12.5px;color:var(--summit-gold);
  font-variant-numeric:tabular-nums}
.tagbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.tagchip{padding:6px 12px;border-radius:999px;border:1px solid var(--summit-line);
  background:var(--summit-panel);color:var(--summit-muted);font-size:12px;font-weight:700;transition:.15s}
.tagchip.on{background:linear-gradient(140deg,var(--summit-bright),var(--summit-gold));
  color:var(--summit-black);border-color:transparent}

#stage{position:relative;height:min(82vh,860px);border:1px solid var(--summit-line);
  border-radius:24px;overflow:hidden;background:
   radial-gradient(circle at 50% 42%,rgba(215,174,84,.07),transparent 58%),var(--summit-panel);
  cursor:grab;touch-action:none}
#stage.grabbing{cursor:grabbing}
#plane{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
#wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.bub{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:grab;
  user-select:none;touch-action:none;transition:opacity .18s}
.bub.dragging{cursor:grabbing;z-index:20}
.bub.dim{opacity:.17}
.bub.hit .disc{border-color:var(--summit-bright);box-shadow:0 0 0 3px rgba(242,209,122,.3),0 8px 26px rgba(0,0,0,.4)}
.disc{position:relative;border-radius:50%;background:#14110e;
  border:1px solid rgba(215,174,84,.34);display:flex;align-items:center;justify-content:center;
  font-weight:800;color:var(--summit-ivory);margin:0 auto;
  box-shadow:0 7px 24px rgba(0,0,0,.3),inset 0 0 18px rgba(215,174,84,.025);transition:.16s}
.disc img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.bub:hover .disc{border-color:var(--summit-line2)}
.bnm{margin-top:7px;font-size:12.5px;font-weight:700;line-height:1.25;max-width:132px;
  color:var(--summit-ivory);text-shadow:0 1px 3px rgba(0,0,0,.7)}
.brk{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:800;margin-top:2px}
.rank-nvp,.rank-emd{color:var(--nvp)} .rank-md{color:var(--md)}
.rank-sa{color:var(--sa)} .rank-a{color:var(--assoc)} .rank-pending{color:var(--pending)}
.prod{position:absolute;top:-4px;right:-6px;background:linear-gradient(140deg,var(--summit-bright),var(--summit-gold));
  color:#2a1e06;font-size:9.5px;font-weight:900;padding:2px 6px;border-radius:999px;
  box-shadow:0 3px 9px rgba(0,0,0,.45);font-variant-numeric:tabular-nums}
.tog{position:absolute;bottom:-3px;right:-3px;width:21px;height:21px;border-radius:50%;
  background:var(--summit-panel2);border:1px solid var(--summit-line2);color:var(--summit-gold);
  font-size:13px;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center}
.tog:hover{background:var(--summit-gold);color:var(--summit-black)}
.maphint{margin-top:10px;font-size:12px;color:var(--summit-muted);display:flex;gap:16px;flex-wrap:wrap}

/* ---------- performers ---------- */
.prow{display:flex;align-items:center;gap:15px;padding:13px 16px;border-radius:15px;
  border:1px solid var(--summit-line);background:var(--summit-panel);margin-bottom:9px}
.pplace{width:32px;font-weight:900;font-size:15px;color:var(--summit-gold);
  font-variant-numeric:tabular-nums;text-align:center}
.pini{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#231d15,#0e0c09);
  border:1px solid var(--summit-line2);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;flex:0 0 auto;overflow:hidden}
.pini img{width:100%;height:100%;object-fit:cover}
.ppts{margin-left:auto;text-align:right}
.ppts b{display:block;font-size:17px;font-weight:900;color:var(--summit-bright);font-variant-numeric:tabular-nums}
.ppts small{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--summit-muted)}
.prow.top1{border-color:var(--summit-line2);background:linear-gradient(140deg,rgba(215,174,84,.1),var(--summit-panel))}

/* ---------- road to emd ---------- */
.rank-top{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.agentsel{margin-left:auto}
.agentsel small{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--summit-muted);margin-bottom:5px;font-weight:800}
.agentsel select{padding:9px 13px;border-radius:11px;border:1px solid var(--summit-line);
  background:var(--summit-panel);color:var(--summit-ivory);outline:none;min-width:190px}
.mini-track{display:flex;gap:5px;overflow-x:auto;padding:12px 4px;scrollbar-width:thin;margin-bottom:14px}
.mini-track::-webkit-scrollbar{height:5px}
.mini-track::-webkit-scrollbar-thumb{background:var(--summit-line2);border-radius:9px}
.mini{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:4px 3px;border-radius:10px;border:1px solid transparent;transition:.18s}
.mini svg{width:34px;height:34px;filter:grayscale(.55) brightness(.68);transition:transform .18s,filter .18s}
.mini.complete svg{filter:none}
.mini.current svg{transform:scale(1.2);filter:none}
.mini.current{border-color:var(--summit-line2);background:rgba(215,174,84,.08)}
.mini span{font-size:9.5px;font-weight:800;color:var(--summit-muted);font-variant-numeric:tabular-nums}
.mini.current span{color:var(--summit-bright)}
.stagewrap{display:flex;align-items:center;gap:12px}
.arrow{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:1px solid var(--summit-line);
  background:var(--summit-panel);color:var(--summit-gold);font-size:20px;line-height:1;transition:.16s}
.arrow:hover:not(:disabled){background:var(--summit-gold);color:var(--summit-black)}
.arrow:disabled{opacity:.28;cursor:not-allowed}
/* min-width:0 is load-bearing. A flex item will not shrink below its intrinsic content
   width without it, so on a phone the card stayed wide enough for its longest label and
   shoved the next-stage chevron 41px off the right edge, making the whole page scroll
   sideways. Measured identically on stages with and without alternative paths, so this
   predates the twenty-stage rebuild. */
.rank-card{flex:1;min-width:0;min-height:428px;border:1px solid rgba(215,174,84,.28);border-radius:30px;padding:28px;
  display:grid;grid-template-columns:minmax(280px,1.1fr) minmax(300px,.9fr);gap:28px;
  background:linear-gradient(145deg,rgba(25,21,15,.94),rgba(8,7,5,.98));
  box-shadow:inset 0 0 50px rgba(0,0,0,.45),0 24px 60px rgba(0,0,0,.25)}
.rank-visual{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  border:1px solid rgba(215,174,84,.1);border-radius:24px;
  background:radial-gradient(circle,rgba(215,174,84,.08),transparent 55%)}
.rank-visual svg{width:min(200px,62%);height:auto;filter:drop-shadow(0 18px 24px rgba(0,0,0,.42));
  transition:transform .25s ease,filter .25s ease}
.rank-visual:hover svg{transform:scale(1.035);filter:drop-shadow(0 20px 32px rgba(215,174,84,.18))}
.rank-visual p{margin:0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--summit-gold);font-weight:800}
.rank-visual small{color:var(--summit-muted);font-size:11px}
.rank-req{padding:22px;border:1px solid rgba(215,174,84,.18);border-radius:20px;background:rgba(8,7,5,.42)}
.rank-req>header{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.rank-req h2{margin:2px 0 0;font-size:20px;font-weight:800;line-height:1.2}
.rank-req .cnt{margin-left:auto;font-size:19px;font-weight:900;color:var(--summit-bright);
  font-variant-numeric:tabular-nums}
/* Alternative-path stages (Marketing Director, EMD). Both groups are always visible so the
   evidence on the path you are not currently chasing is never hidden or lost. */
.altnote{margin:2px 0 10px;font-size:12.5px;color:var(--ink2);font-weight:600;}
.pathgrp{border:1px solid var(--line2);border-radius:14px;padding:10px;margin-bottom:12px;}
.pathgrp.done{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
.pathhd{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:2px 4px 9px;font-size:13px;letter-spacing:-.01em;}
.pathhd b{font-weight:800;}
.pathcnt{font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap;}
.pathgrp.done .pathcnt{color:var(--gold);}
.stmean{font-size:12.5px;color:var(--ink2);margin:2px 0 0;font-weight:600;}
@media(max-width:560px){.pathhd{flex-wrap:wrap;}.pathcnt{flex:0 0 auto;}}
.reqrow{display:flex;align-items:flex-start;gap:12px;padding:12px;border-radius:13px;
  border:1px solid transparent;cursor:pointer;transition:.15s}
.reqrow:hover{background:rgba(215,174,84,.05)}
.reqrow.checked{border-color:var(--summit-line);background:rgba(215,174,84,.07)}
.reqrow input{position:absolute;opacity:0;pointer-events:none}
.ck{flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--summit-line2);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;
  color:transparent;transition:.16s;margin-top:1px}
.reqrow.checked .ck{background:linear-gradient(140deg,var(--summit-bright),var(--summit-gold));
  border-color:transparent;color:#1d1405}
.reqrow strong{display:block;font-size:13.5px;font-weight:700}
.reqrow small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--summit-muted);font-weight:800}
.reqrow.checked small{color:var(--summit-gold)}
/* A tick awaiting the EMD: outlined, not filled, so it never reads as complete. */
.reqrow.pending{border-color:var(--summit-line2);border-style:dashed}
.reqrow.pending .ck{border-style:dashed;border-color:var(--summit-gold);color:var(--summit-gold)}
.reqrow.pending small{color:var(--summit-gold)}
.reqbtn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;
  border:1px solid var(--summit-line);background:rgba(215,174,84,.1);color:var(--summit-bright);
  font-weight:800;font-size:12.5px;cursor:pointer}
.reqbtn b{background:var(--summit-gold);color:#1d1405;border-radius:999px;padding:1px 8px;font-size:11.5px}
.apgrp{border:1px solid var(--summit-line);border-radius:13px;padding:12px;margin:0 0 12px}
.apgrp h4{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.aprow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:8px 0;border-top:1px solid rgba(215,174,84,.1)}
.aprow:first-of-type{border-top:0}
.aprow div{min-width:0;flex:1}.aprow strong{display:block;font-size:13px;overflow-wrap:anywhere}
.aprow small{color:var(--summit-muted);font-size:11px}
.apact{display:flex;gap:6px;flex:0 0 auto}
.apact button{min-height:36px;min-width:44px;padding:0 10px;border-radius:9px;border:1px solid var(--summit-line);
  background:transparent;color:var(--ink2);font-weight:800;font-size:12px;cursor:pointer}
.apact button.ok{background:linear-gradient(140deg,var(--summit-bright),var(--summit-gold));color:#1d1405;border-color:transparent}
.stepbar{height:6px;border-radius:999px;background:rgba(215,174,84,.13);margin-top:18px;overflow:hidden}
.stepbar span{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--summit-gold),var(--summit-bright));transition:width .3s ease}
.platform{margin-top:14px;padding:11px 13px;border-radius:12px;border:1px dashed var(--summit-line);
  font-size:12px;color:var(--summit-muted)}
.platform b{color:var(--summit-bright)}
/* ---------- ladder: overall progress, stage state, team view ---------- */
.rv{display:flex;gap:4px;padding:4px;border-radius:13px;border:1px solid var(--summit-line);
  background:var(--summit-panel)}
.rvb{padding:8px 15px;border-radius:10px;font-weight:800;font-size:12.5px;color:var(--summit-muted);
  white-space:nowrap;transition:.15s}
.rvb.on{background:linear-gradient(140deg,var(--summit-bright),var(--summit-gold));color:var(--summit-black)}
.overall{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:13px 17px;margin:2px 0 4px;
  border:1px solid var(--summit-line);border-radius:15px;background:var(--summit-panel)}
.ov1{font-size:13px;color:var(--summit-muted)} .ov1 b{color:var(--summit-bright);font-size:16px}
.ov2{font-size:12px;color:var(--summit-muted);font-variant-numeric:tabular-nums}
.ov2 b{color:var(--summit-ivory)}
.ovbar{flex:1;min-width:130px;height:7px;border-radius:999px;background:rgba(215,174,84,.14);overflow:hidden}
.ovbar>span{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--summit-gold),var(--summit-bright));transition:width .35s ease}
.stchip{display:inline-block;margin-top:7px;padding:3px 10px;border-radius:999px;font-size:10px;
  font-weight:900;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--summit-line)}
.stchip.complete{background:rgba(215,174,84,.16);color:var(--summit-bright);border-color:var(--summit-line2)}
.stchip.started{color:var(--summit-gold)} .stchip.open{color:var(--summit-muted)}
.sw.done{border-color:var(--summit-line2)}
.sw.done small{color:var(--summit-gold)}
.tstats{display:flex;gap:26px;flex-wrap:wrap;margin-top:10px}
.tstats span{display:flex;flex-direction:column}
.tstats b{font-size:22px;font-weight:900;color:var(--summit-bright);font-variant-numeric:tabular-nums}
.tstats i{font-style:normal;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--summit-muted);font-weight:700}
.tl{display:flex;align-items:center;gap:14px;width:100%;padding:11px 13px;border-radius:14px;
  border:1px solid var(--summit-line);background:var(--summit-panel);margin-bottom:8px;
  text-align:left;transition:.15s}
.tl:hover{border-color:var(--summit-line2);background:var(--summit-panel2)}
.tlb{flex:0 0 auto;display:flex}
.tli{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.tli b{font-size:14px;font-weight:700;color:var(--summit-ivory)}
.tli i{font-style:normal}
.tls{flex:0 0 165px;display:none;flex-direction:column;gap:1px}
.tls b{font-size:12.5px;color:var(--summit-bright);font-weight:800}
.tls i{font-style:normal;font-size:11.5px;color:var(--summit-muted)}
.tlp{flex:0 0 118px;display:flex;align-items:center;gap:9px}
.tlbar{flex:1;height:6px;border-radius:999px;background:rgba(215,174,84,.14);overflow:hidden}
.tlbar>span{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--summit-gold),var(--summit-bright))}
.tlp i{font-style:normal;font-size:11px;font-weight:800;color:var(--summit-muted);
  font-variant-numeric:tabular-nums}
@media(min-width:760px){.tls{display:flex}}
.cashbox{margin-top:14px;padding:15px;border-radius:15px;border:1px solid var(--summit-line2);
  background:linear-gradient(140deg,rgba(215,174,84,.1),rgba(8,7,5,.5))}
.cashhead{display:flex;align-items:baseline;gap:12px}
.cashhead b{margin-left:auto;font-size:22px;font-weight:900;color:var(--summit-bright);
  font-variant-numeric:tabular-nums}
.cashstars{display:flex;align-items:center;gap:5px;margin-top:9px}
.cashstars .cs{font-size:15px;color:rgba(215,174,84,.26)}
.cashstars .cs.on{color:var(--summit-bright);text-shadow:0 0 9px rgba(242,209,122,.5)}
.cashstars i{font-style:normal;margin-left:8px;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:900;color:var(--summit-gold)}
.cashnote{margin-top:9px;font-size:12px;color:var(--summit-muted)}
.swipe{display:flex;gap:8px;overflow-x:auto;padding:16px 2px 4px;scrollbar-width:thin}
.swipe::-webkit-scrollbar{height:5px}
.swipe::-webkit-scrollbar-thumb{background:var(--summit-line2);border-radius:9px}
.sw{flex:0 0 118px;padding:11px;border-radius:13px;border:1px solid var(--summit-line);
  background:var(--summit-panel);text-align:left;transition:.16s}
.sw small{display:block;font-size:10px;font-weight:900;color:var(--summit-muted);
  font-variant-numeric:tabular-nums}
.sw span{display:block;font-size:11.5px;font-weight:700;margin-top:3px;line-height:1.25;color:var(--summit-ivory)}
.sw.active{border-color:var(--summit-gold);background:rgba(215,174,84,.1)}
.sw.active small{color:var(--summit-bright)}

/* ---------- drawer ---------- */
.ov{position:fixed;inset:0;background:rgba(3,3,2,.68);z-index:120;display:none;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.ov.on{display:flex}
@media(min-width:640px){.ov{align-items:center}}
.dr{width:100%;max-width:470px;max-height:86vh;overflow-y:auto;background:var(--summit-panel);
  border:1px solid var(--summit-line2);border-radius:24px 24px 0 0;padding:24px;
  padding-bottom:calc(24px + env(safe-area-inset-bottom))}
@media(min-width:640px){.dr{border-radius:24px}}
.dr h3{margin:0 0 4px;font-size:19px;font-weight:800}
.dr .dsub{margin:0 0 18px;font-size:13px;color:var(--summit-muted)}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:800;color:var(--summit-muted);margin-bottom:6px}
.fld input,.fld select{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--summit-line);
  background:var(--summit-black);color:var(--summit-ivory);outline:none}
.fld input:focus,.fld select:focus{border-color:var(--summit-line2)}
.go{width:100%;padding:13px;border-radius:13px;font-weight:800;
  background:linear-gradient(140deg,var(--summit-bright),var(--summit-gold));color:#1d1405}
.ghost{width:100%;padding:12px;border-radius:13px;font-weight:700;border:1px solid var(--summit-line);
  background:transparent;color:var(--summit-muted);margin-top:8px}
.menurow{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;
  border:1px solid var(--summit-line);background:var(--summit-black);margin-bottom:9px;
  text-align:left;color:var(--summit-ivory);font-weight:700;transition:.15s}
.menurow:hover{border-color:var(--summit-line2);background:var(--summit-panel2)}
.menurow span:first-child{font-size:18px}
.tagmanrow{display:flex;align-items:center;gap:10px;padding:10px;border-radius:11px;
  border:1px solid var(--summit-line);margin-bottom:7px}
.tagmanrow b{flex:1;font-size:13px}
.xbtn{color:#ff6b6b;font-size:12px;font-weight:800}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--summit-ivory);color:var(--summit-black);padding:12px 20px;border-radius:12px;
  font-size:13.5px;font-weight:700;opacity:0;transition:.25s;z-index:400;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:38px 18px;text-align:center;color:var(--summit-muted);font-size:13.5px}
.spin{padding:44px;text-align:center;color:var(--summit-muted)}

/* ---------- loading curtain ---------- */
#curtain{position:fixed;inset:0;z-index:900;background:var(--summit-black);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s}
#curtain.gone{opacity:0;pointer-events:none}
#curtain .bar{width:168px;height:2px;background:rgba(215,174,84,.16);border-radius:9px;overflow:hidden}
#curtain .bar i{display:block;height:100%;width:34%;border-radius:9px;
  background:linear-gradient(90deg,transparent,var(--summit-bright),transparent);
  animation:sweep 1.15s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(420%)}}
#curtain .t3{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--summit-muted)}
@media (prefers-reduced-motion:reduce){#curtain .bar i{animation:none;width:100%}
  .rank-visual svg,.mini svg{transition:none}}

@media(max-width:800px){
  .rank-top{gap:12px}
  .agentsel{margin-left:0;width:100%}
  .agentsel select{width:100%}
  .rank-card{grid-template-columns:1fr;padding:20px;min-height:0}
  /* The card is a GRID; its children need min-width:0 for the same reason the card itself
     needs it as a flex item. Without it the heading, the completion count, every requirement
     row and the progress bar kept their intrinsic widths and ran outside the card's own
     border — the "panel extends beyond its narrower enclosing outline" from the video. */
  .rank-card > *{ min-width:0; }
  .rank-req header{ gap:10px; }
  .rank-req header .cnt{ flex:0 0 auto; }
  /* Was min-height:280px, which reserved a block taller than the emblem now is and kept the
     requirements below the fold even after the artwork shrank. The emblem sizes itself; the
     container only needs to not collapse. */
  .rank-visual{min-height:0;padding:14px 0}
  .mini svg{width:24px;height:24px}

  /* Previous/next sat either side of the card in a nowrap flex row, so on a 386px phone the
     two arrows plus gaps took 108px and left the card 254px. That is what put the next arrow
     over the completion count: measured, the count ended at x350 and the arrow began at x326.
     On a phone they get their own row under the card — the card gets the full column, and the
     controls land where a thumb already is. */
  .stagewrap{
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
    grid-template-areas:"card card" "prev next";
  }
  .stagewrap > .rank-card{ grid-area:card; }
  .stagewrap > .arrow:first-child{ grid-area:prev; justify-self:start; }
  .stagewrap > .arrow:last-child{  grid-area:next; justify-self:end; }
  /* 44px is the touch target the brief asks for; 36 was under it. */
  .arrow{width:44px;height:44px;font-size:19px}

  /* Three tabs at desktop scale measured 433px of content in a 350px rail, so "Road to EMD"
     rested 59px off the right edge. They fit at phone scale instead of needing a scroll. */
  .tabs{ gap:4px; }
  .tab{ padding:9px 10px; font-size:12px; letter-spacing:.01em; }
  #stage{height:64vh}
  .wrap{padding:0 12px 70px}
}

/* Everyone is on this chart, so the chart has to say who is who at a glance. */
.bub.alum{opacity:.42;filter:grayscale(.85)}
.bub.alum .bname::after{content:' \00b7 Alumni';font-size:9px;color:var(--ink3,#8e8e93);font-weight:700}

  cursor:pointer;display:grid;place-items:center;padding:0;font-family:inherit}

.bub .arch{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;border-radius:50%;

  cursor:pointer;display:grid;place-items:center;padding:0;font-family:inherit}

.bub.moving{outline:2px dashed #f2d17a;outline-offset:4px;z-index:40}

<body>

<!-- A LOADING STATE, NOT A SECOND INTRO. Opening Road to EMD from the app board already
     plays a branded title transition; this then covered the screen with a full-size THE
     STANDARD FINANCIAL GROUP / SUMMIT wordmark and sat there for a further 900ms AFTER the
     page had finished rendering. Two consecutive branded intros, the second of them stalling
     on content that was already built. Elijah asked for the duplicate to go.
     What is left is a quiet progress line that leaves the moment the organization is on
     screen. The header carries the real Standard logo and wordmark as of 2026-10-23; the
     hand-drawn Summit mountain that used to sit there was a substitute mark. -->
<div id="curtain" role="status" aria-live="polite">
  <div class="bar"><i></i></div>
  <div class="t3">Building the organization</div>
</div>

<!-- HEADER, per the 2026-10-23 handoff section 10: back chevron on the FAR LEFT, the actual
     Standard logo and wordmark CENTRED, no hamburger and no right-side back on the Road screen.
     The mountain/triangle "Summit" mark it replaced was a hand-drawn substitute, which section 3
     explicitly forbids standing in for the real artwork.

     WHY THE MENU AND TABS SURVIVE ON THE OTHER TWO VIEWS. This file is not the Road screen; it
     is three screens. TAB is one of map (Org Chart), perf (Top Performers) and road, and it
     DEFAULTS to map -- summit.html?tab=map is the org chart, and it is linked from twelve
     files including the main navigation and app-wide search. The hamburger is not duplicate
     navigation either: it carries Manage tags, Reset map layout and Cashflow levels, which
     belong to the map. Deleting either outright would remove two features and strand twelve
     entry points, which section 10 expressly does not authorise ("Removing these local
     navigation items does not authorize deleting organization data or unrelated routes").
     So the simplification is applied TO THE ROAD VIEW: body.road-view hides the menu button,
     the per-view title and the tab bar, and nothing changes for map or perf. -->
<header class="top">
  <a class="iconbtn back" href="index.html" title="Back" aria-label="Back to home">&#8249;</a>
  <script>/* On a phone (and in the installed app) home is the tools screen, app.html - the same
     place the Hub, New Business and Leaderboard return to. Desktop keeps the dashboard. */
  (function(){try{var b=document.currentScript.previousElementSibling;var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;if(standalone||window.innerWidth<=980)b.setAttribute('href','app.html');}catch(e){}})();</script>
  <div class="brand">
    <img class="mk" src="logo.png" alt="" onerror="this.style.display='none'">
    <div><b>The Standard</b><small>Financial Group</small></div>
  </div>
  <div class="ptitle" id="ptitle">Org Chart</div>
  <button class="iconbtn menu" onclick="openMenu()" title="Menu" aria-label="Menu">&#9776;</button>
</header>

<div class="wrap">
  <nav class="tabs" role="tablist">
    <button class="tab on" id="tab_map"  onclick="setTab('map')">Org Chart</button>
    <button class="tab"    id="tab_perf" onclick="setTab('perf')">Top Performers</button>
    <button class="tab"    id="tab_road" onclick="setTab('road')">Road to EMD</button>
  </nav>
  <main id="view"><div class="spin">Loading the organization…</div></main>
</div>

<div class="ov" id="ov" onclick="if(event.target===this)closeDrawer()"><div class="dr" id="drawer"></div></div>
<div class="toast" id="toast"></div>

<script src="road-core.js"></script>
<script>
/* ========================================================================================
   Summit — Org Chart · Top Performers · Road to EMD
   Integrated into the existing app rather than rebuilt: the hierarchy, ranks and production
   all come from the live platform. org-api owns the tree (and applies baseshop scoping),
   the policies ledger owns production, and summit-api owns only what is genuinely new —
   tags, ladder progress and each viewer's own bubble layout.
   ==================================================================================== */
var ORGAPI="https://bmfqxtocxkjhsgfnndlo.supabase.co/functions/v1/org-api";
var SUMAPI="https://bmfqxtocxkjhsgfnndlo.supabase.co/functions/v1/summit-api";
var AVATAR="https://bmfqxtocxkjhsgfnndlo.supabase.co/functions/v1/avatar";

var CODE=(localStorage.getItem('tsfg_code')||'').toUpperCase();
var NAME=localStorage.getItem('tsfg_name')||'';
var TAB='map';

var NODES=[], BYCODE={}, KIDS={}, ROOTS=[];
var CANEDIT=false, SCOPE='baseshop', MOVING=null, SHOWALUM=false;   /* MOVING = the code currently being re-parented */
var BOARD={tags:[],agent_tags:{},progress:{},production:{},stages:{},cash:{},requirements:{},signals:{},layout:{},can_manage:false,can_set_standards:false,my_baseshop:''};
var POS={}, ZOOM=1, PAN={x:0,y:0}, DRAG=null, COLLAPSED={}, QUERY='', ACTIVETAGS=[];
var STEP=0, LADDER='', ROADVIEW='mine';
/* My Tracker opens this page straight on the ladder (?tab=road), so the Road to EMD is the
   tracker rather than a third tab someone has to go looking for. */
(function(){var m=/[?&]tab=(map|perf|road)/.exec(location.search);
  if(m)TAB=m[1]; else if(location.hash==='#road')TAB='road';
  /* Road to EMD has ONE entry transition, the tool title on Home (brief section 10). No second
     full-screen curtain here: the page header paints at once and the ladder fills in. */
  if(TAB==='road'){ var cu=document.getElementById('curtain'); if(cu) cu.classList.add('gone'); }})();

function $(id){return document.getElementById(id);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},2200);}
function initials(n){n=(n||'').trim();if(!n)return '?';var p=n.split(/\s+/);return ((p[0][0]||'')+(p.length>1?p[p.length-1][0]:'')).toUpperCase();}
function closeDrawer(){$('ov').classList.remove('on');}
/* Back from a stage drawer returns to the Road, not Home (brief section 10). Opening a drawer
   adds one history entry, so the phone's back gesture and the header chevron both close it
   first; closing it any other way takes that entry back off so the next back goes Home. */
(function(){
  var DR=false;
  function watch(){
    var ov=$('ov'); if(!ov||!window.MutationObserver) return;
    new MutationObserver(function(){
      var on=ov.classList.contains('on');
      if(on&&!DR){ DR=true; try{ history.pushState({tsfgDrawer:1},''); }catch(e){} }
      else if(!on&&DR){ DR=false; try{ if(history.state&&history.state.tsfgDrawer) history.back(); }catch(e){} }
    }).observe(ov,{attributes:true,attributeFilter:['class']});
    window.addEventListener('popstate',function(){ if(DR){ DR=false; ov.classList.remove('on'); } });
    var bk=document.querySelector('.top .iconbtn.back');
    if(bk) bk.addEventListener('click',function(e){ if(ov.classList.contains('on')){ e.preventDefault(); closeDrawer(); } });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',watch); else watch();
})();
function fmtPts(n){n=Number(n)||0;if(n>=1e6)return (n/1e6).toFixed(1)+'M';if(n>=1e3)return Math.round(n/1e3)+'K';return String(Math.round(n));}

/* ===== rank vocabulary =================================================================
   Ranks are read from the platform, never invented. Anything the record does not state
   reads RANK PENDING, exactly as the handoff requires. */
function rankOf(n){
  var r=((n&&(n.level||n.title))||'').trim();
  if(!r)return null;
  var L=r.toLowerCase();
  if(L.indexOf('national vice')>=0||L==='nvp')return {short:'NVP',cls:'rank-nvp'};
  if(L.indexOf('executive marketing')>=0||L==='emd')return {short:'EMD',cls:'rank-emd'};
  if(L.indexOf('marketing director')>=0||L==='md')return {short:'MD',cls:'rank-md'};
  if(L.indexOf('senior')>=0)return {short:'Senior Associate',cls:'rank-sa'};
  if(L.indexOf('associate')>=0)return {short:'Associate',cls:'rank-a'};
  return {short:r,cls:'rank-pending'};
}

/* ===== THE 19 RANK BADGES =============================================================
   The prototype shipped 19 PNGs behind a login we cannot reach, so the emblems are drawn
   here as SVG instead — which is better anyway: they scale, they theme, they weigh nothing,
   and they speak the same visual language as the trophy case already in the profile.

   The progression is the point. Call-of-Duty campaign emblems escalate by ACCUMULATING
   devices, not by swapping art, so each level here adds to the last:
     metal   iron -> bronze -> silver -> gold -> prestige   (bands of four)
     burst   6 points climbing to 24
     laurels from 9, wings from 13, crown from 17
     gems    from 13, up to five by 19
     pips    position within the band
   Level 1 is a plain dark disc. Level 19 is a crowned, winged, jewelled championship crest. */
var METALS=[
  {a:'#9aa0a8',b:'#3b3f47',rim:'#23262b',ring:'#2f333a'},   /* iron      1-4  */
  {a:'#e8a769',b:'#8a4f22',rim:'#53301a',ring:'#6b3d1c'},   /* bronze    5-8  */
  {a:'#f2f5f8',b:'#97a1ab',rim:'#69727c',ring:'#7d8792'},   /* silver    9-12 */
  {a:'#f7dd9a',b:'#c08a1e',rim:'#7f5a10',ring:'#a2740f'},   /* gold     13-16 */
  {a:'#fff6d2',b:'#d7ae54',rim:'#8d6a1c',ring:'#b98f2c'}    /* prestige 17-19 */
];
var GEMHUE=['#7ad6ff','#7affc0','#ffd36e','#ff8fa3','#c79bff'];
function starPath(cx,cy,ro,ri,pts,rot){var p='';for(var i=0;i<pts*2;i++){var a=Math.PI*i/pts-Math.PI/2+(rot||0);var r=(i%2===0)?ro:ri;p+=(i===0?'M':'L')+(cx+Math.cos(a)*r).toFixed(1)+' '+(cy+Math.sin(a)*r).toFixed(1);}return p+'Z';}
function laurel(side){
  var d=side<0?-1:1,p='';
  for(var i=0;i<6;i++){
    var t=i/5, ang=-2.5+t*2.0, rx=50+d*(30+t*7)*Math.cos(ang*0.5), ry=54+t*22;
    p+='<ellipse cx="'+rx.toFixed(1)+'" cy="'+ry.toFixed(1)+'" rx="5.4" ry="2.5" transform="rotate('+(d*(28+t*32)).toFixed(0)+' '+rx.toFixed(1)+' '+ry.toFixed(1)+')" opacity="'+(0.5+t*0.42).toFixed(2)+'"/>';
  }
  return p;
}
/* level: 1..19 · state: 'future' | 'current' | 'complete' · prestige: 0..5 (EMD only)
   Past EMD the emblem stops tracking rank and starts tracking money — Christopher: "once
   people become EMDs they start to really grow in cashflow and their emblem needs to grow
   based on their cashflow and less about their promotion." Each cashflow tier adds a gem and
   a brighter aura to the level 19 crest, so an EMD keeps climbing after the ladder ends. */
/* The 19 ranks are real artwork now (Summit_Website_Logo_Assets, 2026-09-30) — gunmetal through
   gold to gemstone, one file per stage, matched to the ladder by the designer's manifest. The
   generated SVG below stays as rankBadgeSVG(): it is what draws if an image ever fails to load,
   so a rank is never a blank square. */
function rankBadgeSVG(level,state,size,prestige){
  level=Math.max(1,Math.min(STAGE_COUNT,level|0)); size=size||120;
  prestige=(level>=stageIndexById('emd')+1)?Math.max(0,Math.min(5,prestige|0)):0;
  var band=Math.min(4,Math.floor((level-1)/4));
  var m=METALS[band], uid='rk'+level+'_'+Math.floor(Math.random()*1e6);
  var pts=6+Math.floor((level-1)/2)*2;                 /* 6 -> 24 */
  var gems=level>=13?Math.min(5,Math.floor((level-11)/2)):0;
  gems=Math.min(9,gems+prestige);   /* every cashflow tier sets another stone */
  var pip=((level-1)%4)+1;
  var wings=level>=13, crown=level>=17, laur=level>=9;
  var dim=(state==='future');
  var g='<g'+(dim?' opacity=".92"':'')+'>';

  /* outer radiance on the last band */
  if(level>=17&&!dim)g+='<circle cx="50" cy="47" r="'+(46+prestige*1.6).toFixed(1)+'" fill="url(#gl'+uid+')"/>';
  /* a prestige wreath of rays, one pass per cashflow tier */
  if(prestige&&!dim)g+='<g transform="translate(50,47)" opacity="'+(0.2+prestige*0.1).toFixed(2)
    +'"><path d="'+starPath(0,0,48+prestige*2,26,20+prestige*2)+'" fill="'+m.a+'"/></g>';
  /* wings */
  if(wings)g+='<g fill="'+m.ring+'" opacity=".85">'
    +'<path d="M22 44 C6 40 2 50 12 54 C4 56 6 64 16 62 C10 66 16 72 24 66 Z"/>'
    +'<path d="M78 44 C94 40 98 50 88 54 C96 56 94 64 84 62 C90 66 84 72 76 66 Z"/></g>';
  /* laurels */
  if(laur)g+='<g fill="'+m.a+'" opacity=".55">'+laurel(-1)+laurel(1)+'</g>';
  /* starburst */
  g+='<g transform="translate(50,47)">'
    +'<path d="'+starPath(0,0,42,Math.max(16,42-pts*0.9),pts)+'" fill="'+m.ring+'"/>'
    +'<path d="'+starPath(0,0,38,Math.max(18,38-pts*0.8),pts,Math.PI/pts)+'" fill="'+m.rim+'" opacity=".62"/></g>';
  /* crown */
  if(crown)g+='<g fill="'+m.a+'"><path d="M35 13 L41 22 L50 9 L59 22 L65 13 L63 27 L37 27 Z"/>'
    +'<rect x="36" y="27" width="28" height="3.4" rx="1.5"/>'
    +'<circle cx="50" cy="7" r="2.6" fill="'+GEMHUE[2]+'"/></g>';
  /* the disc */
  g+='<circle cx="50" cy="47" r="30" fill="'+m.rim+'"/>'
    +'<circle cx="50" cy="47" r="27" fill="url(#mg'+uid+')" stroke="'+m.rim+'" stroke-width="1.2"/>'
    +'<circle cx="50" cy="47" r="20" fill="rgba(0,0,0,.22)"/>'
    +'<ellipse cx="43" cy="36" rx="16" ry="8.5" fill="rgba(255,255,255,.28)"/>';
  /* summit mark inside */
  g+='<path d="M36 55 L45 41 L50 49 L54 44 L64 55 Z" fill="none" stroke="'+(dim?'#cfc7b6':'#fff')
    +'" stroke-width="2.1" stroke-linejoin="round" opacity=".95"/>';
  /* gems around the rim */
  for(var i=0;i<gems;i++){
    var a=-Math.PI/2+(i-(gems-1)/2)*0.52, gx=50+Math.cos(a)*30.5, gy=47+Math.sin(a)*30.5;
    g+='<circle cx="'+gx.toFixed(1)+'" cy="'+gy.toFixed(1)+'" r="3.5" fill="'+GEMHUE[i%5]+'" stroke="'+m.rim+'" stroke-width="1"/>';
  }
  /* banner + level numeral */
  g+='<path d="M31 72 L69 72 L69 95 L50 87 L31 95 Z" fill="'+m.b+'"/>'
    +'<path d="M31 72 L69 72 L69 77 L31 77 Z" fill="'+m.rim+'"/>'
    +'<text x="50" y="86" font-size="12.5" font-weight="900" text-anchor="middle" fill="'+(dim?'#e6e0d2':'#fff')
    +'" font-family="Inter,-apple-system,sans-serif" letter-spacing=".5">'+(level<10?('0'+level):level)+'</text>';
  /* band pips */
  var pipN=(level>=RANK_ART_MAX&&prestige)?prestige:pip;
  for(var p2=0;p2<pipN;p2++){var px=50+(p2-(pipN-1)/2)*7.5;

/* Same signature as before: level 1-19, state complete|current|future, pixel size, prestige 0-5.
   Small list badges (34-40px) load the 128px set; the 290px hero loads the 512px one, so the map
   does not pull a megabyte of artwork to draw thumbnails. */
/* There are exactly 19 pieces of rank artwork on disk (assets/ranks/rank-01..19.webp). The
   twentieth stage, Senior Partner, has none — so rather than request rank-20.webp and get a
   404 and a blank square, levels past the artwork are drawn with the generated emblem that
   already exists as the fallback for every other level. Raise this the day art 20 lands. */
var RANK_ART_MAX=19;
/* HOW BIG THE HERO EMBLEM IS. It was a hard 290px, which is what screenshot H of the
   2026-10-23 handoff means by "the large emblem consumes most of the remaining viewport":
   on a 390pt phone that is three quarters of the content width before a single requirement
   is visible. Section 10 asks for "around 140-180 logical points on a standard portrait
   phone, adapting to space".

   larger screens where there is room. 390pt lands at 179, 320pt at 147, and anything desktop
   stops at 200 rather than growing without limit. */
function heroEmblemSize(){
  var w = window.innerWidth || 390;

function rankBadge(level,state,size,prestige){
  level=Math.max(1,Math.min(STAGE_COUNT,level|0)); size=size||120;
  /* Past EMD the emblem grows on CASHFLOW, not promotion. The artwork is fixed, so each level Eli
     has set adds a DIAMOND under the badge — Christopher, 2026-09-30: "set more levels to be able
     to add diamonds to the emblem to make them grow". The cap is however many levels exist.
     EMD moved from level 19 to level 15 when the ladder was rebuilt, so "past EMD" is resolved
     from the ladder rather than from a number that silently became wrong. */
  var emdLevel=stageIndexById('emd')+1;

  prestige=(level>=emdLevel)?Math.max(0,Math.min(maxPrestige,prestige|0)):0;

    : (state==='current' ? 'filter:drop-shadow(0 0 '+Math.max(5,Math.round(size*0.05))+'px rgba(212,175,55,.6))' : '');

     fixed, so prestige shows as a widening glow plus a star chip rather than extra gemstones. */
  var glow=(prestige&&!future)
    ? '<span style="position:absolute;inset:'+(-Math.round(size*0.06))+'px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(212,175,55,'+(0.10+prestige*0.05).toFixed(2)+') 0%,rgba(212,175,55,0) 70%)"></span>'

         +'transform:rotate(45deg);border-radius:'+Math.max(1,Math.round(ds*0.12))+'px;'
         +'box-shadow:0 0 '+Math.round(ds*0.5)+'px rgba(120,190,255,.75),inset 0 0 2px rgba(255,255,255,.9);'

  return '<span style="position:relative;display:inline-block;line-height:0;width:'+size+'px;height:'+size+'px">'
    + glow

    + ' data-rank="'+level+'" data-state="'+String(state||'')+'" data-size="'+size+'" data-prestige="'+prestige+'"'
    + ' alt="Rank '+level+' \u2014 '+(STAGES[level-1]||'').replace(/"/g,'')+'"'
    + ' style="position:relative;display:block;width:'+size+'px;height:'+size+'px;object-fit:contain;'+fx+'">'

function boot(){

    fetch(ORGAPI,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'tree',code:CODE})}).then(function(r){return r.json();}).catch(function(){return null;}),
    fetch(SUMAPI,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'board',code:CODE})}).then(function(r){return r.json();}).catch(function(){return null;})
  ]).then(function(res){
    var t=res[0]||{}, b=res[1]||{};
    /* THE ORG CHART IS THE ONE DELIBERATELY COMPANY-WIDE VIEW. Christopher, asked directly
       (org-api v10): "Names company-wide, details own shop only." org-api already enforces that
       — a `limited` node arrives with its name, level and upline but with email, phone, licence
       status, activity and streak stripped. Filtering those people out here, as this map did
       from 2026-09-28, hid most of the company from most of the company and contradicted the
       rule the Org Chart page itself has always followed.
       Departed people stay as shadow Alumni: on the tree, never counted. */
    NODES=(t.nodes||[]).slice();
    CANEDIT=!!t.can_edit_hierarchy;
    loadCanArchive();
    SCOPE=t.scope||'baseshop';
    BYCODE={};KIDS={};
    NODES.forEach(function(n){n.code=(n.code||'').toUpperCase();BYCODE[n.code]=n;});
    NODES.forEach(function(n){var p=(n.direct_to||'').toUpperCase();if(p&&BYCODE[p])(KIDS[p]=KIDS[p]||[]).push(n);});
    /* Re-root on what this viewer may actually see: for an ELEVATE associate the company root
       is out of scope, so their own EMD becomes the centre of their map. */
    ROOTS=(t.roots||[]).map(function(r){return (typeof r==='string')?r:r.code;})
            .map(function(c){return (c||'').toUpperCase();})
            .filter(function(c){return !!BYCODE[c];});
    if(!ROOTS.length){ROOTS=NODES.filter(function(n){var p=(n.direct_to||'').toUpperCase();return !p||!BYCODE[p];}).map(function(n){return n.code;});}
    if(b&&b.ok)BOARD=b;
    POS=Object.assign({},BOARD.layout||{});
    if(BOARD.zoom)ZOOM=Number(BOARD.zoom)||1;
    /* Past the second generation the map is unreadable at 138 people, so deeper branches
       start folded. Every one of them can be opened individually. */
    /* Opening on 74 bubbles is noise, not insight. The map starts on leadership and their
       direct teams; every branch below opens with one tap on its own + control. */
    /* Opening on depth 1 alone showed 9 bubbles out of 136 people and read as if the rest of the
       company had never been loaded. Two levels shows every leader AND their team leads. */
    NODES.forEach(function(n){if(depthOf(n.code)>=2&&(KIDS[n.code]||[]).length)COLLAPSED[n.code]=true;});
    LADDER=CODE;
    STEP=firstOpenStage(LADDER);
    applyTabChrome(TAB);
    $('ptitle').textContent=(TAB==='map')?'Org Chart':(TAB==='perf')?'Top Performers':'Road to EMD';
    render();

       drawn. The curtain goes the moment there is something to look at. */
    dropCurtain();
  });
}
/* A curtain that fails to lift is worse than no curtain: the page is fully loaded and
   completely unreachable behind it. Promise.all above cannot reject (every fetch catches its

   timer as well and is safe to call twice. */
function dropCurtain(){ var c=$('curtain'); if(c) c.classList.add('gone'); }

function leafCount(code){
  var k=visibleKids(code);
  if(!k.length)return 1;
  var s=0;for(var i=0;i<k.length;i++)s+=leafCount(k[i].code);
  return s;

function layout(){
  /* Two passes, because a ring's size depends on how much of the circle its people actually
     get. A team of 21 does not receive the whole circumference — it receives its parent's
     slice — so pass one measures the tightest slice at each depth and pass two lays the map
     out on rings wide enough for it. Fixed radii were fine for the prototype's seventeen
     people; at 138 they collided into an unreadable knot. */
  var cx=700, cy=520, SQUASH=0.95;
  var minArc=function(d){return d<=2?150:120;};
  var R={0:0}; for(var d=1;d<=12;d++)R[d]=300+(d-1)*185;

  function run(record){
    var laid={};
    function place(code,depth,a0,a1,tier){
      var r=(R[depth]!==undefined?R[depth]:(300+(depth-1)*185))+((tier||0)*170);
      var mid=(a0+a1)/2;
      laid[code]={x:cx+Math.cos(mid)*r, y:cy+Math.sin(mid)*r*SQUASH, depth:depth};
      var k=visibleKids(code); if(!k.length)return;
      var span=Math.max(0.0001,a1-a0), total=0;
      k.forEach(function(c){total+=leafCount(c.code);});
      /* Slices are proportional to team size so a big team gets room, but every child is
         guaranteed a floor — otherwise a one-person branch beside a twenty-one person branch
         gets a sliver and collides with its neighbour while the big team looks fine. */
      var floorW=Math.min(span/k.length, 0.16);
      var extra=Math.max(0, span-floorW*k.length);
      /* A team of thirty-five cannot fit legibly on one ring at any sane radius, so a wide
         team is dealt onto two concentric sub-rings. Neighbours on the same ring end up twice
         as far apart, which is what makes the names readable again. */
      var split=k.length>14, cur=a0;
      k.forEach(function(c,ix){
        var w=floorW+extra*(leafCount(c.code)/total);
        var eff=split?w*2:w;   /* same-ring neighbours are two slices apart */
        if(record)record[depth+1]=Math.max(record[depth+1]||0, minArc(depth+1)/Math.max(eff,0.0001));
        place(c.code,depth+1,cur,cur+w,split?(ix%2):0);
        cur+=w;
      });
    }
    if(ROOTS.length===1){ place(ROOTS[0],0,-Math.PI,Math.PI); }
    else {
      var n=ROOTS.length, step=(Math.PI*2)/n;
      ROOTS.forEach(function(rc,i){ place(rc,0,-Math.PI+i*step,-Math.PI+(i+1)*step); });
      ROOTS.forEach(function(rc,i){ var a=-Math.PI/2+i*step;
        if(laid[rc]){laid[rc].x=cx+Math.cos(a)*175;laid[rc].y=cy+Math.sin(a)*150;} });
    }
    return laid;
  }

  var need={};
  run(need);
  var prev=0;
  for(var d2=1;d2<=12;d2++){
    R[d2]=Math.min(2200, Math.max(prev+185, 300+(d2-1)*185, need[d2]||0));
    prev=R[d2];
  }
  return run(null);
}

function applyTransform(){

}
var clampZ=function(v){return Math.max(.35,Math.min(2.2,v));};
function bumpZoom(d){ZOOM=clampZ(ZOOM+d);applyTransform();saveLayout();}
function centreMap(){
  var st=$('stage');if(!st)return;

function resetLayout(){

function fitToView(){
  /* A correctly spaced ring can be very wide, so the camera frames whatever is open rather
     than leaving people to hunt for their team off the edge of the canvas. */
  var st=$('stage');if(!st)return;
  var laid=layout(), xs=[], ys=[];
  Object.keys(laid).forEach(function(c){var p=POS[c]||laid[c];xs.push(p.x);ys.push(p.y);});
  if(!xs.length)return;
  var pad=130;
  var minX=Math.min.apply(null,xs)-pad, maxX=Math.max.apply(null,xs)+pad;
  var minY=Math.min.apply(null,ys)-pad, maxY=Math.max.apply(null,ys)+pad;
  var r=st.getBoundingClientRect();
  var z=clampZ(Math.min(r.width/(maxX-minX), r.height/(maxY-minY)));
  ZOOM=z;
  PAN.x=r.width/2-((minX+maxX)/2)*z;
  PAN.y=r.height/2-((minY+maxY)/2)*z;

/* ===== Moving someone on the tree =====
   Reparenting is TWO TAPS, not a drag: dragging a bubble already repositions it, and drag-and-drop
   is miserable on a phone — which is where most of this team works. Tap the person, then tap their
   new upline. org-api is the authority on who may do this (Operations and Eli Cox only, NOT every
   MD/EMD), so the button only appears when the API says can_edit_hierarchy. org.html decided that
   client-side from the viewer's level, which offered the control to MDs whose save was then
   refused with a 403. */
function canDropOn(target){
  if(!MOVING||target===MOVING)return false;
  var n=BYCODE[target]; if(!n||n.departed)return false;          /* never report to an alumnus */
  /* descendantsOf() is the page's own helper and returns an ARRAY OF NODES, not a lookup —
     a second copy of it here silently lost to the original and let someone be moved under
     their own downline, which org-api would then refuse. */
  var below=descendantsOf(MOVING)||[];
  for(var i=0;i<below.length;i++) if(below[i] && below[i].code===target) return false;
  return true;
}
function bubbleTap(code){
  if(!MOVING){ openAgent(code); return; }
  if(code===MOVING){ MOVING=null; paintBubbles(); toast('Move cancelled'); return; }
  if(!canDropOn(code)){
    var n=BYCODE[code];
    toast(n&&n.departed ? 'That person has left — pick someone active.'
                        : 'You can\u2019t move someone under their own downline.');
    return;
  }
  var who=BYCODE[MOVING], up=BYCODE[code];
  if(!confirm('Move '+(who&&who.name||MOVING)+' to report to '+(up&&up.name||code)+'?')) return;
  doMove(MOVING, code);
}
function startMove(code){
  if(!CANEDIT){ toast('The hierarchy is managed by Operations and Eli Cox.'); return; }
  MOVING=code; paintBubbles();
  var n=BYCODE[code];
  toast('Now tap '+((n&&n.name||'this person').split(' ')[0])+'\u2019s new upline \u2014 or tap them again to cancel');
}
function cancelMove(){ MOVING=null; paintBubbles(); }
function doMove(code,upline){
  var prev=MOVING; MOVING=null; paintBubbles();
  fetch(ORGAPI,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'set_upline',code:code,direct_to:upline,by:CODE})})
   .then(function(r){return r.json();})
   .then(function(r){
     if(!r||!r.ok){ toast((r&&r.error)||'Could not move them.'); MOVING=prev; paintBubbles(); return; }
     var n=BYCODE[code]; if(n){ n.direct_to=upline; n.direct_to_name=(BYCODE[upline]||{}).name||''; }
     toast('Moved \u2713 reloading the tree\u2026');
     reloadTree();
   })
   .catch(function(){ toast('Network error.'); MOVING=prev; paintBubbles(); });
}
function reloadTree(){
  fetch(ORGAPI,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'tree',code:CODE})})
   .then(function(r){return r.json();})
   .then(function(t){
     if(!t||!t.ok)return;
     NODES=(t.nodes||[]).slice(); CANEDIT=!!t.can_edit_hierarchy; SCOPE=t.scope||SCOPE;
     BYCODE={};KIDS={};
     NODES.forEach(function(n){n.code=(n.code||'').toUpperCase();BYCODE[n.code]=n;});
     NODES.forEach(function(n){var p=(n.direct_to||'').toUpperCase();if(p&&BYCODE[p])(KIDS[p]=KIDS[p]||[]).push(n);});
     ROOTS=(t.roots||[]).map(function(r){return (typeof r==='string')?r:r.code;})
             .map(function(c){return (c||'').toUpperCase();}).filter(function(c){return !!BYCODE[c];});
     if(!ROOTS.length){ROOTS=NODES.filter(function(n){var p=(n.direct_to||'').toUpperCase();return !p||!BYCODE[p];}).map(function(n){return n.code;});}
     paintBubbles();
   });
}
function collapseDeep(){COLLAPSED={};NODES.forEach(function(n){if(depthOf(n.code)>=1&&(KIDS[n.code]||[]).length)COLLAPSED[n.code]=true;});paintBubbles();centreMap();}
function focusOn(code){
  /* Framing the whole company every time a branch opens just shrinks everyone. Opening a team
     frames THAT team at a readable size; the rest is still there to pan to. */
  var st=$('stage');if(!st)return;
  var laid=layout(), xs=[], ys=[];
  (function collect(c){var p=POS[c]||laid[c];if(p){xs.push(p.x);ys.push(p.y);}
    visibleKids(c).forEach(function(k){collect(k.code);});})(code);
  var parent=(BYCODE[code]&&(BYCODE[code].direct_to||'').toUpperCase());
  if(parent&&(POS[parent]||laid[parent])){var pp=POS[parent]||laid[parent];xs.push(pp.x);ys.push(pp.y);}
  if(!xs.length)return fitToView();
  var pad=150;
  var minX=Math.min.apply(null,xs)-pad, maxX=Math.max.apply(null,xs)+pad;
  var minY=Math.min.apply(null,ys)-pad, maxY=Math.max.apply(null,ys)+pad;
  var r=st.getBoundingClientRect();
  ZOOM=clampZ(Math.min(r.width/(maxX-minX), r.height/(maxY-minY), 1.25));
  PAN.x=r.width/2-((minX+maxX)/2)*ZOOM;
  PAN.y=r.height/2-((minY+maxY)/2)*ZOOM;
  applyTransform();saveLayout();
}

function toggleTag(id){var i=ACTIVETAGS.indexOf(id);if(i>=0)ACTIVETAGS.splice(i,1);else ACTIVETAGS.push(id);renderMap();}
var saveT=null;
function saveLayout(){
  if(saveT)clearTimeout(saveT);
  saveT=setTimeout(function(){
    fetch(SUMAPI,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'layout_save',code:CODE,positions:POS,zoom:ZOOM})}).catch(function(){});
  },900);
}
function wireStage(){
  var st=$('stage');if(!st)return;
  st.addEventListener('wheel',function(e){
    e.preventDefault();
    var before=ZOOM; ZOOM=clampZ(ZOOM-e.deltaY*0.0016);
    var r=st.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
    PAN.x=mx-(mx-PAN.x)*(ZOOM/before); PAN.y=my-(my-PAN.y)*(ZOOM/before);
    applyTransform();saveLayout();
  },{passive:false});
  st.addEventListener('pointerdown',function(e){
    var b=e.target.closest?e.target.closest('.bub'):null;
    if(b&&!e.target.closest('.tog')){
      var code=b.getAttribute('data-code');
      var laid=layout(); var cur=POS[code]||laid[code];
      DRAG={kind:'node',code:code,sx:e.clientX,sy:e.clientY,ox:cur.x,oy:cur.y,moved:false};
      b.classList.add('dragging');
    } else if(!b){
      DRAG={kind:'canvas',sx:e.clientX,sy:e.clientY,ox:PAN.x,oy:PAN.y,moved:false};
      st.classList.add('grabbing');
    }
    if(DRAG)st.setPointerCapture(e.pointerId);
  });
  st.addEventListener('pointermove',function(e){
    if(!DRAG)return;
    var dx=e.clientX-DRAG.sx, dy=e.clientY-DRAG.sy;
    if(Math.abs(dx)>3||Math.abs(dy)>3)DRAG.moved=true;
    if(DRAG.kind==='canvas'){PAN.x=DRAG.ox+dx;PAN.y=DRAG.oy+dy;applyTransform();}
    else{
      POS[DRAG.code]={x:DRAG.ox+dx/ZOOM,y:DRAG.oy+dy/ZOOM};
      var el=$('plane').querySelector('.bub[data-code="'+DRAG.code+'"]');
      if(el){el.style.left=POS[DRAG.code].x+'px';el.style.top=POS[DRAG.code].y+'px';}
      redrawWires();
    }
  });
  function endDrag(){
    if(!DRAG)return;
    var wasNode=DRAG.kind==='node', moved=DRAG.moved, code=DRAG.code;
    DRAG=null;
    st.classList.remove('grabbing');
    var d=$('plane').querySelector('.bub.dragging');if(d)d.classList.remove('dragging');
    if(wasNode&&moved){saveLayout();}
    if(wasNode&&!moved&&code){/* a tap, not a drag */}
  }
  st.addEventListener('pointerup',endDrag);
  st.addEventListener('pointercancel',endDrag);
  setTimeout(fitToView,30);
}
function redrawWires(){
  var laid=layout(), lines='';
  Object.keys(laid).forEach(function(code){
    visibleKids(code).forEach(function(c){
      var a=POS[code]||laid[code], b=POS[c.code]||laid[c.code];
      if(!a||!b)return;
      lines+='<line x1="'+a.x.toFixed(1)+'" y1="'+a.y.toFixed(1)+'" x2="'+b.x.toFixed(1)+'" y2="'+b.y.toFixed(1)
        +'" stroke="rgba(242,209,122,.5)" stroke-width="1.6" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
    });
  });
  var s=$('wires');if(s)s.innerHTML=lines;
}

/* ===== ROAD TO EMD ============================================================== */
/* Only people whose Road this viewer is allowed to see: summit-api answers with progress for
   in-scope agents only, so its keys are the allowed set. Alumni are not on anyone's Road. */
function ladderAgents(){
  var ok={}; ok[CODE]=1;
  ['derived','checks','pending','progress'].forEach(function(k){ Object.keys((BOARD&&BOARD[k])||{}).forEach(function(c){ ok[String(c).toUpperCase()]=1; }); });
  var out=NODES.filter(function(n){ return ok[n.code] && !n.departed; })
               .sort(function(a,b){return (a.name||'').localeCompare(b.name||'');});
  return out;
}
/* Stages the platform can already prove for this agent: rank, the licensing board, the steps
   they ticked in My Tracker, and logged field trainings. Per stage rather than a single floor —
   somebody can have ten field trainings done and still not have passed the exam. */
/* (moved to road-core.js, 2026-10-26) */
/* summit-api v8: a tick from anyone but an EMD in scope is a request. Pending never counts. */
function pendMap(code){ return (BOARD.pending||{})[code]||{}; }
function canApprove(code){
  var a=BOARD.approvable;
  if(a==='all')return code!==CODE;
  return !!(a&&a.indexOf&&a.indexOf(code)>=0);
}
function pendingForMe(){
  var n=0,p=BOARD.pending||{};
  Object.keys(p).forEach(function(c){ if(canApprove(c)) n+=Object.keys(p[c]).length; });
  return n;
}
/* Turn a stored id back into the words on screen, using the agent's shop wording if any. */
function reqLabelByKey(code,key){
  var sid=String(key).split('.')[0], i=stageIndexById(sid); if(i<0)return key;
  var hit=reqLabels(code,i).filter(function(r){return r.key===key;})[0];
  return (i+1)+'. '+STAGES[i]+' — '+(hit?(hit.pathName?hit.pathName+': ':'')+hit.label:key);
}
/* (moved to road-core.js, 2026-10-26) */
function cashOf(code){var c=(BOARD.cash||{})[code];return c?c:{amount:0,prestige:0};}
/* The cashflow levels past EMD are Eli's and Operations' to set (summit-api v5,
   app_settings.summit_cash_tiers). This array used to be hardcoded here AND in summit_ladder()'s
   SQL — two copies that both needed a code change to add a level. The literal below is only a
   cold-load fallback. */
function cashTiers(){var t=(typeof BOARD!=='undefined'&&BOARD&&BOARD.tiers)||[];return t.length?t:[{at:100000,name:'100K Ring'},{at:250000,name:'Quarter Million'},{at:500000,name:'Half Million'},{at:1000000,name:'Million Dollar'},{at:2500000,name:'Multi-Million'}];}
function tierAmounts(){return cashTiers().map(function(t){return t.at;});}
function tierName(i){var t=cashTiers()[i];return t?(t.name||('Level '+(i+1))):'';}
function money(n){n=Number(n)||0;
  if(n>=1e6)return '$'+(Math.round(n/1e5)/10)+'M';
  if(n>=1e3)return '$'+Math.round(n/1e3)+'K';
  return '$'+Math.round(n);}
/* (moved to road-core.js, 2026-10-26) */
/* Everyone beneath you in the tree — this is what makes it a TEAM tracker rather than a
   personal one. Alumni are already filtered out of NODES, so nobody departed is counted. */
function descendantsOf(code){
  var out=[], seen={};
  (function walk(c){
    (KIDS[c]||[]).forEach(function(k){
      if(seen[k.code])return; seen[k.code]=1; out.push(k); walk(k.code);
    });
  })(code);
  return out;
}
function stageState(code,i){
  if(stageComplete(code,i))return 'complete';
  var c=checksFor(code,i);
  return c.some(Boolean)?'started':'open';

/* The emblem shows the stage being BROWSED, so it says which it is: cleared, the person's current
   level, or a stage ahead of them. Browsing never changes the saved level. */
function emblemState(){
  if(stageComplete(LADDER,STEP)) return 'complete';
  return STEP===firstOpenStage(LADDER) ? 'current' : 'future';
}
function emblemCaption(){
  var st=emblemState(), who=(LADDER===CODE);
  if(st==='complete') return 'Cleared';
  if(st==='current') return who ? 'Your current level' : 'Their current level';
  return 'Browsing a stage ahead';
}
function renderRoad(){
  if(!LADDER)LADDER=CODE;
  if(ROADVIEW==='team')return renderTeamLadder();
  var agents=ladderAgents();
  var sig=(LADDER===CODE)?(BOARD.signals||{}):{};
  var checks=checksFor(LADDER,STEP);
  var sc=stageCount(LADDER,STEP), done=sc.done, total=sc.total;
  var cleared=stagesDone(LADDER), pctAll=Math.round(cleared/STAGE_COUNT*100);
  var st=stageState(LADDER,STEP);

  var mini=STAGES.map(function(sg,i){
    var cls=(i===STEP?'current ':'')+(stageComplete(LADDER,i)?'complete':'');
    return '<button class="mini '+cls+'" onclick="goStep('+i+')" title="'+esc((i+1)+'. '+sg)+'">'
      +rankBadge(i+1,stageComplete(LADDER,i)?'complete':(i===STEP?'current':'future'),34,cashOf(LADDER).prestige)
      +'<span>'+(i+1)+'</span></button>';
  }).join('');

  var auto=isDerived(LADDER,STEP);
  var labels=reqLabels(LADDER,STEP);
  var drv=derivedReqs(LADDER);
  function reqRow(r){
    var on=reqDone(LADDER,STEP,r.key);
    var pend=!on&&pendMap(LADDER)[r.key]===true;
    var why=on?(auto?'Cleared by record':(drv[r.key]?'Cleared by record':'Completed'))
      :(pend?(canApprove(LADDER)?'Requested — tap to approve':'Awaiting EMD approval'):'Not yet complete');
    return '<label class="reqrow'+(on?' checked':'')+(pend?' pending':'')+'" onclick="toggleReq(\''+esc(r.key)+'\')">'
      +'<span class="ck">\u2713</span>'
      +'<div><strong>'+esc(r.label)+'</strong><small>'+why+'</small></div></label>';
  }
  var pp=pathProgress(LADDER,STEP), reqs;
  if(pp){
    /* Both paths stay inspectable. Switching between them must never erase the other's
       evidence, so both are rendered - neither is hidden behind a toggle. */
    var sdef=ROAD[STEP];
    reqs='<p class="altnote">Either complete path qualifies \u2014 you do not need both.</p>'
      +sdef.paths.map(function(p,pi){
        var pr=pp[pi];
        return '<div class="pathgrp'+(pr.complete?' done':'')+'">'
          +'<div class="pathhd"><b>'+esc(p.name)+'</b>'
          +'<span class="pathcnt">'+pr.done+'/'+pr.total+(pr.complete?' \u00b7 qualifies':'')+'</span></div>'
          +p.reqs.map(function(r){return reqRow({key:sdef.id+'.'+p.id+'.'+r.id,label:r.label});}).join('')
          +'</div>';
      }).join('');
  } else {
    reqs=labels.map(reqRow).join('');
  }

  var says=platformSays(STEP,sig);
  var swipe=STAGES.map(function(sg,i){
    var sc=stageComplete(LADDER,i)?' done':'';
    return '<button class="sw'+(i===STEP?' active':'')+sc+'" onclick="goStep('+i+')">'
      +'<small>'+(i<9?('0'+(i+1)):(i+1))+'</small><span>'+esc(sg)+'</span></button>';
  }).join('');

  $('view').innerHTML=roadHeader()
    +'<div class="overall">'
      +'<span class="ov1">Current stage <b>'+(firstOpenStage(LADDER)+1)+'</b> of '+STAGE_COUNT+'</span>'
      +'<span class="ovbar"><span style="width:'+pctAll+'%"></span></span>'
      +'<span class="ov2"><b>'+cleared+'</b> of '+STAGE_COUNT+' stages cleared \u00b7 '+pctAll+'%</span>'
    +'</div>'
    +'<div class="mini-track">'+mini+'</div>'
    +'<div class="stagewrap">'
    +'<button class="arrow" onclick="goStep('+(STEP-1)+')"'+(STEP===0?' disabled':'')+' aria-label="Previous stage">\u2039</button>'
    +'<div class="rank-card">'
    +'<div class="rank-visual">'+rankBadge(STEP+1,emblemState(),heroEmblemSize(),cashOf(LADDER).prestige)
    +'<p>Level '+(STEP<9?('0'+(STEP+1)):(STEP+1))+' emblem</p><small>'+emblemCaption()+'</small></div>'
    +'<div class="rank-req"><header><div><div class="eyebrow">Progression step</div>'
    +'<h2>'+esc(STAGES[STEP])+'</h2>'
    +(ROAD[STEP].meaning?('<div class="stmean">'+esc(ROAD[STEP].meaning)+'</div>'):'')
    +'<span class="stchip '+st+'">'+(st==='complete'?'Stage complete':(st==='started'?'In progress':'Not started'))+'</span>'
    +'</div><span class="cnt">'+done+'/'+total+'</span></header>'
    +reqs
    +'<div class="stepbar"><span style="width:'+Math.round(done/total*100)+'%"></span></div>'
    +(auto?('<div class="platform">Cleared automatically from '+esc(LADDER===CODE?'your':'their')+' record \u2014 '
            +esc(rankLabelOf(LADDER))+'.</div>'):'')
    +(says?('<div class="platform">'+says+'</div>'):'')
    +(STEP===stageIndexById('emd')?cashPanel(LADDER):'')
    +(BOARD.can_set_standards?('<button class="ghost" style="margin-top:12px" onclick="openStandards('+STEP+')">Edit '+esc(shopOf(LADDER).toUpperCase()||'shop')+' standards for this stage</button>'):'')
    +'</div></div>'
    +'<button class="arrow" onclick="goStep('+(STEP+1)+')"'+(STEP===STAGES.length-1?' disabled':'')+' aria-label="Next stage">\u203a</button>'
    +'</div>'
    +'<div class="swipe">'+swipe+'</div>';
}
function rankLabelOf(code){
  var n=BYCODE[code], rk=rankOf(n);
  var lic=(code===CODE&&BOARD.signals)?(BOARD.signals.license_status||''):'';
  return (rk?rk.short:'rank pending')+(lic?(' \u00b7 '+lic):'');
}
/* Past EMD the ladder is finished, so the last card tracks cashflow instead of checkboxes. */
function cashPanel(code){
  var c=cashOf(code), amt=c.amount, pr=c.prestige;
  var next=null;
  var _ct=tierAmounts();for(var i=0;i<_ct.length;i++){if(amt<_ct[i]){next=_ct[i];break;}}
  var prevT=pr>0?tierAmounts()[pr-1]:0;
  var pct=next?Math.max(2,Math.round((amt-prevT)/(next-prevT)*100)):100;
  return '<div class="cashbox">'
    +'<div class="cashhead"><span class="eyebrow">Cashflow from here</span>'
    +'<b>'+money(amt)+'</b></div>'
    +'<div class="cashstars">'+[0,1,2,3,4].map(function(i){
        return '<span class="cs'+(i<pr?' on':'')+'">\u2605</span>';}).join('')
    +'<i>'+(pr?('Prestige '+pr):'EMD')+'</i></div>'
    +'<div class="stepbar" style="margin-top:12px"><span style="width:'+pct+'%"></span></div>'
    +'<div class="cashnote">'+(next
        ? (money(next-amt)+' more cashflow lifts the emblem to prestige '+(pr+1)+'.')
        : 'Top prestige reached \u2014 the emblem is fully set.')+'</div>'
    +'</div>';
}
/* An EMD writes their own shop's promotion standards. Up to six per stage; clearing them all
   puts that stage back on the placeholders. Only this shop's EMD or Operations gets here —
   the server checks again, so hiding the button is convenience rather than the control. */
/* The editor renames the requirements of a stage in place. It deliberately cannot ADD or
   REMOVE requirements: the ids are what completion is stored against, so changing the count
   would orphan evidence. A stage with alternative paths shows its groups separately and
   labels each field with the path it belongs to. */
function openStandards(stage){
  var shop=shopOf(LADDER)||BOARD.my_baseshop||'';
  var canon=reqsOf(stage);
  var over=((BOARD.requirements||{})[shop]||{})[String(stage)]||[];
  var isDefault=!over.length;
  var fields='', lastPath=null;
  canon.forEach(function(r,i){
    if(r.pathName&&r.pathName!==lastPath){
      lastPath=r.pathName;
      fields+='<div class="pathhd" style="padding-top:10px"><b>'+esc(r.pathName)+'</b></div>';
    }
    var v=(!isDefault&&over[i])?over[i]:r.label;
    fields+='<div class="fld"><label>Requirement '+(i+1)+'</label>'
      +'<input id="rq'+i+'" value="'+esc(v)+'" placeholder="'+esc(r.label)+'"></div>';
  });
  $('drawer').innerHTML='<h3>'+esc(shop.toUpperCase()||'Baseshop')+' standards</h3>'
    +'<p class="dsub">Stage '+(stage+1)+' \u00b7 '+esc(STAGES[stage])+' \u2014 '+canon.length+' requirement'
    +(canon.length===1?'':'s')+'. These apply to everyone in '
    +esc(shop.toUpperCase()||'this shop')+' \u2014 other baseshops keep their own.</p>'
    +(isDefault?'<div class="platform" style="margin:0 0 14px">Currently on the standard wording. Editing changes only how a requirement reads here, never how many there are.</div>':'')
    +fields
    +'<button class="go" onclick="saveStandards('+stage+')">Save standards</button>'
    +'<button class="ghost" onclick="closeDrawer()">Cancel</button>';
  $('ov').classList.add('on');
}
function saveStandards(stage){
  var shop=shopOf(LADDER)||BOARD.my_baseshop||'';
  /* One label per canonical requirement, in order. A blank field falls back to the standard
     wording rather than deleting the requirement. */
  var canon=reqsOf(stage), labels=[];
  for(var i=0;i<canon.length;i++){var e=$('rq'+i);var v=e?(e.value||'').trim():'';labels.push(v||canon[i].label);}
  fetch(SUMAPI,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'req_set',code:CODE,baseshop:shop,stage_index:stage,labels:labels})})
   .then(function(r){return r.json();}).then(function(r){
     if(!r||!r.ok)return toast((r&&r.error)||'Could not save');
     if(!BOARD.requirements[shop])BOARD.requirements[shop]={};
     BOARD.requirements[shop][String(stage)]=r.labels||[];
     closeDrawer();renderRoad();
     toast(labels.length?'Standards saved for '+shop.toUpperCase():'Back to the default requirements');
   }).catch(function(){toast('Network error');});
}
function goStep(n){STEP=Math.max(0,Math.min(STAGE_COUNT-1,n));renderRoad();}
/* Stored against the requirement's stable id, so reordering or renaming a stage can never
   move somebody's tick onto a different milestone. */
function toggleReq(key){
  if(isDerived(LADDER,STEP)){
    toast('Already cleared by '+(LADDER===CODE?'your':'their')+' promotion record');
    return;
  }
  if(derivedReqs(LADDER)[key]){
    toast('Already cleared by '+(LADDER===CODE?'your':'their')+' record');
    return;
  }
  if(!BOARD.checks)BOARD.checks={};
  if(!BOARD.pending)BOARD.pending={};
  var who=LADDER, C=BOARD.checks[who]=BOARD.checks[who]||{}, P=BOARD.pending[who]=BOARD.pending[who]||{};
  var approver=canApprove(who);
  var wasOn=C[key]===true, wasPend=P[key]===true;
  /* An approved requirement belongs to the EMD now; the agent can only withdraw a request. */
  if(wasOn&&!approver){ toast('Approved by your EMD \u2014 ask them to clear it'); return; }
  /* An approver tapping a request approves it rather than un-ticking it. */
  var now=!wasOn&&!(wasPend&&!approver);
  var set=function(on,pend){ if(on)C[key]=true; else delete C[key]; if(pend)P[key]=true; else delete P[key]; renderRoad(); };
  if(now) set(approver,!approver); else set(false,false);
  var revert=function(){ set(wasOn,wasPend); };
  fetch(SUMAPI,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'check_set',code:CODE,agent_code:who,req_key:key,done:now})})
   .then(function(r){return r.json();}).then(function(r){
     if(!r||!r.ok){ revert(); toast((r&&r.error)||'Could not save'); return; }
     if(now){ set(r.status==='approved',r.status==='pending');
       if(r.status==='pending')toast('Sent to your EMD for approval'); }
     else if(wasPend&&approver&&who!==CODE) toast('Request declined');
   }).catch(function(){ revert(); toast('Network error \u2014 not saved'); });
}

/* ===== the EMD's review queue (summit-api v8) ======================================= */
function openApprovals(){
  $('drawer').innerHTML='<h3>Road requests</h3><p class="dsub">Loading\u2026</p>';
  $('ov').classList.add('on');
  fetch(SUMAPI,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'approvals',code:CODE})})
   .then(function(r){return r.json();}).then(function(r){
     if(!r||!r.ok){ $('drawer').innerHTML='<h3>Road requests</h3><p class="dsub">'+esc((r&&r.error)||'Could not load')+'</p><button class="ghost" onclick="closeDrawer()">Close</button>'; return; }
     renderApprovals(r.items||[]);
   }).catch(function(){ $('drawer').innerHTML='<h3>Road requests</h3><p class="dsub">Network error.</p><button class="ghost" onclick="closeDrawer()">Close</button>'; });
}
var APITEMS=[];
function renderApprovals(items){
  APITEMS=items;
  var by={},order=[];
  items.forEach(function(it,i){ if(!by[it.agent_code]){by[it.agent_code]=[];order.push(it.agent_code);} by[it.agent_code].push(i); });
  var body=order.length?order.map(function(c){
    var idx=by[c], nm=items[idx[0]].agent_name||c;
    return '<div class="apgrp"><h4><span>'+esc(nm)+'</span>'
      +'<span class="apact"><button class="ok" onclick="reviewItems(['+idx.join(',')+'],\'approve\')">Approve all '+idx.length+'</button></span></h4>'
      +idx.map(function(i){var it=items[i];
        var by2=(it.requested_by&&it.requested_by!==it.agent_code)?(' \u00b7 requested by '+esc(it.requested_by_name||it.requested_by)):'';
        return '<div class="aprow"><div><strong>'+esc(reqLabelByKey(it.agent_code,it.req_key))+'</strong>'
          +'<small>'+esc(String(it.requested_at||'').slice(0,10))+by2+'</small></div>'
          +'<span class="apact"><button class="ok" aria-label="Approve" onclick="reviewItems(['+i+'],\'approve\')">\u2713</button>'
          +'<button aria-label="Decline" onclick="reviewItems(['+i+'],\'reject\')">\u2715</button></span></div>';
      }).join('')+'</div>';
  }).join(''):'<div class="platform" style="margin:0 0 12px">No requests waiting. You\u2019re all caught up.</div>';
  $('drawer').innerHTML='<h3>Road requests</h3><p class="dsub">Agents on your team ticked these. They count toward a stage only once you approve.</p>'
    +body+'<button class="ghost" onclick="closeDrawer()">Close</button>';
}
function reviewItems(idx,decision){
  var list=idx.map(function(i){return APITEMS[i];}).filter(Boolean);
  if(!list.length)return;
  fetch(SUMAPI,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'check_review',code:CODE,decision:decision,items:list.map(function(it){return {agent_code:it.agent_code,req_key:it.req_key};})})})
   .then(function(r){return r.json();}).then(function(r){
     if(!r||!r.ok)return toast((r&&r.error)||'Could not save');
     list.forEach(function(it){
       var P=(BOARD.pending||{})[it.agent_code]; if(P)delete P[it.req_key];
       if(decision==='approve'){ BOARD.checks=BOARD.checks||{}; (BOARD.checks[it.agent_code]=BOARD.checks[it.agent_code]||{})[it.req_key]=true; }
     });
     toast((decision==='approve'?'Approved ':'Declined ')+r.done+(r.refused?(' \u00b7 '+r.refused+' not yours to review'):''));
     renderApprovals(APITEMS.filter(function(it){return list.indexOf(it)<0;}));
     renderRoad();
   }).catch(function(){ toast('Network error \u2014 not saved'); });
}

function setTagOn(code,id,on){
  fetch(SUMAPI,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'tag_assign',code:CODE,agent_code:code,tag_id:id,on:on})})
   .then(function(r){return r.json();}).then(function(r){
     if(!r||!r.ok)return toast((r&&r.error)||'Could not update');
     var cur=BOARD.agent_tags[code]||[];
     BOARD.agent_tags[code]=on?cur.concat([id]):cur.filter(function(x){return x!==id;});
     openTagsFor(code);
   }).catch(function(){toast('Network error');});
}

boot();
</script>
</body>
</html>
